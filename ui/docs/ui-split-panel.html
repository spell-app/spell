    <!-- Before first paint:  the viewer's colour scheme (`ThemePreference.HEAD_SCRIPT`, as oxfmt lays it out).  The theme itself is restored by site.js. -->

          d = document.documentElement,
          s = l.getItem("spell-site:scheme") || l.getItem("spell-site:theme") || l.getItem("spell-ui-site:scheme")
        if (s === "light" || s === "dark") {
          d.classList.add("ui-" + s)
          d.style.colorScheme = s
        }
      } catch (e) {}
    </script>

                <ui-example description="Panes side by side, sized by `columns`.  `resizable` puts a bar between them:  drag it, or give it the focus and use the arrow keys.">

                  </ui-split-panel>

                  <ui-split-panel columns="*,*,*" resizable style="height: 6em">
                    <ui-segment>One</ui-segment>
                    <ui-segment hidden>Not shown</ui-segment>

          <ui-tab value="usage" label="Usage">
            <!-- USAGE:  how to use it (attributes in practice, events, framework snippets), keyboard, accessibility. -->
            <ui-section id="usage-using-it" label="Using it" sticky="stack" collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  Write your panes as children, and say how big each is in `columns` or `rows`.
                  - Sizes:  a comma list, `20%,*,380px`.  A number, `px` or `em` is fixed;  `%` is a share of what the fixed panes leave;  `*` shares what's left;  `auto` is as big as its content.
                  - `resizable` puts a bar between each two.  The panel doesn't remember what's dragged:  `ui-changed` hands you `sizes`, in the same form, to keep and give back.
                  - `hidden` on a child takes it out of the panes.  Nothing is moved or redrawn as panes come and go, so what's running in one keeps running.
                </script>
              </ui-markdown>
              <ui-code language="js">
                <script type="text/plain">
                  document.querySelector("ui-split-panel").addEventListener("ui-changed", (event) => localStorage.setItem("panes", event.detail.sizes))
                </script>
              </ui-code>
            </ui-section>
            <ui-section id="usage-keyboard" label="Keyboard" sticky="stack" collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  A bar takes the focus with Tab, after every pane.  The arrow keys along it move it 16px, or 160px with Shift.
                </script>
              </ui-markdown>
            </ui-section>
            <ui-section id="usage-accessibility" label="Accessibility" sticky="stack" collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  Each bar of a `resizable` panel is a named `separator`, saying its place as a percent of the two panes beside it.  Tab reaches the bars after every pane, not between them:  each pane is placed by CSS `order`, so nothing has to move.
                </script>
              </ui-markdown>
            </ui-section>
          </ui-tab>
