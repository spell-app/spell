<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Theme Menu | Spell UI</title>
    <meta
      name="description"
      content="A theme menu picks the page&#39;s theme from Spell&#39;s own, and its light, dark or system colour scheme, and remembers both for the next page."
    />
    <!-- Before first paint:  the viewer's colour scheme (`ThemePreference.HEAD_SCRIPT`, as oxfmt lays it out).  The theme itself is restored by site.js. -->
    <script>
      try {
        var l = localStorage,
          d = document.documentElement,
          s = l.getItem("spell-site:scheme") || l.getItem("spell-site:theme") || l.getItem("spell-ui-site:scheme")
        if (s === "light" || s === "dark") {
          d.classList.add("ui-" + s)
          d.style.colorScheme = s
        }
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="/components/ui/_assets/site.css" />
    <script type="module" src="/components/ui/_assets/site.js"></script>
    <!-- the comments (bullhorns, threads, Send):  the docs runtime's, alone, beside the site's Spell UI -->
    <script defer src="/_epic/assets/spell-comments.js"></script>
  </head>
  <body class="ui-typography">
    <main id="main" class="site-main" data-toc-header="Theme Menu">
      <ui-segment appearance="vertical" class="site-masthead">
        <ui-container>
          <ui-menu icon class="site-page-links" aria-label="About this page">
            <ui-item
              link="https://github.com/spell-app/spell-app/issues/new?title=ui-theme-menu%3A%20%20"
              target="_blank"
              icon="bug"
              aria-label="Report a bug"
              title="Report a bug"
            ></ui-item>
          </ui-menu>
          <ui-header level="1" class="site-title">
            Theme Menu
            <ui-header>A theme menu picks the page&#39;s theme from Spell&#39;s own, and its light, dark or system colour scheme, and remembers both for the next page.</ui-header>
          </ui-header>
          <ui-theme-menu show="theme" compact class="site-themes"></ui-theme-menu>
        </ui-container>
      </ui-segment>

      <ui-container class="site-body">
        <ui-tabs id="site-tabs" class="site-tabs" history appearance="segmented basic" align="fluid" equal>
          <ui-tab value="examples" label="Examples">
            <!--
              EXAMPLES:  Fomantic's page, section by section, in its order (Types, Content, States, Variations,
              Groups ...).  Rules, the class-grammar mappings, gaps:  epics/spell-ui-pages/PAGES.md.
              - A section:  `<ui-section id="examples-types" label="Types" sticky="stack" collapsible dividing>` around
                its examples;  ids spell out the nesting (`<tab>-<section>-<example>`, lowercase kebab of the headers).
              - An example:  its own nested section (`label` = the example's name) around
                `<ui-example description="...">` and the live markup;  the markup IS the code shown.  A richer
                description:  `<p slot="description">` (+ `<ui-message slot="description">`).  Fomantic's header-less
                `.another.example`:  a second `<ui-example>` in the same section.
              - Or write it flat (`<ui-header level="2">`, `<ui-example heading>`) and run `yarn site:sections`:
                it nests it and writes the ids (and fixes them after a title changes).
              - A gap:  an HTML comment `GAP I<n>:  ...` BEFORE the example's section (a comment inside the example
                shows in its code).
            -->
            <ui-section id="examples-types" label="Types" sticky="stack" collapsible dividing>
              <ui-section id="examples-types-palette" label="Palette" sticky="stack" collapsible dividing>
                <ui-example
                  description="One round palette button:  its panel picks light, dark or Auto, and one of Spell's themes.  The page remembers both."
                >
                  <ui-theme-menu></ui-theme-menu>
                </ui-example>
              </ui-section>
              <ui-section id="examples-types-theme-dropdown" label="Theme dropdown" sticky="stack" collapsible dividing>
                <ui-example description='A theme dropdown, for a masthead:  `show="theme"`;  `compact` makes it an icon button.'>
                  <ui-theme-menu show="theme"></ui-theme-menu>
                </ui-example>
              </ui-section>
              <ui-section id="examples-types-light-dark-only" label="Light / dark only" sticky="stack" collapsible dividing>
                <ui-example description='A sun or a moon alone:  `show="scheme"`.  A click flips the page between light and dark.'>
                  <ui-theme-menu show="scheme"></ui-theme-menu>
                </ui-example>
              </ui-section>
              <ui-section id="examples-types-in-a-menu" label="In a menu" sticky="stack" collapsible dividing>
                <ui-example
                  description="The palette's panel alone, drawn in place:  `show=&quot;menu&quot;`.  For the body of a sub-menu in a menu of your own, which gives it its box;  `bench=&quot;none&quot;` leaves out Theme bench."
                >
                  <ui-segment style="max-width: 15em">
                    <ui-theme-menu show="menu" bench="none"></ui-theme-menu>
                  </ui-segment>
                </ui-example>
              </ui-section>
            </ui-section>

            <ui-section id="examples-variations" label="Variations" sticky="stack" collapsible dividing>
              <ui-section id="examples-variations-inverted" label="Inverted" sticky="stack" collapsible dividing>
                <ui-example description="On a dark bar:  `inverted`, here at `size=&quot;small&quot;`.">
                  <ui-segment inverted>
                    <ui-theme-menu inverted size="small"></ui-theme-menu>
                  </ui-segment>
                </ui-example>
              </ui-section>
            </ui-section>
          </ui-tab>

          <ui-tab value="usage" label="Usage">
            <!-- USAGE:  how to use it (attributes in practice, events, framework snippets), keyboard, accessibility. -->
            <ui-section id="usage-using-it" label="Using it" sticky="stack" collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  Put one anywhere:  it reads the themes from Spell UI's theme list (`UI.themes.own`), so it works on
                  any page, not only these.

                  - It lists Spell's own themes:  Spell, Glass, Fruity, Merlot, Paper, Midnight, Crisp, Pop and Matrix, each with a line saying what it is.
                  - A pick applies the theme to the page and every element on it, and remembers it (`ThemePreference`):
                    ONE choice, theme and light / dark, for every Spell place, kept in the person's space, so the
                    editor, the epic pages and these pages all draw in it, open tabs at once.
                  - A page that restores the remembered theme before any menu shows calls
                    `ThemePreference.restore()`;  a page the page server didn't serve, but whose `/api` reaches it,
                    calls `ThemePreference.keepIn("space")` first, as the Spell editor does.
                  - Under the themes, TINT:  a header as Theme's, over ONE dropdown of Spell UI's colours, each a
                    dot and its own name, None (a slashed circle) first.
                    A tint replaces the theme's primary and tints the page as a soft gradient;  it's remembered with
                    the theme as one name (`glass:pink`), and the menu says both:  "Glass - Pink".
                    - The theme editor's colour rows (Primary, Secondary, Background) are the same dropdown, their
                      first option the theme's own colour.
                  - Its `end` slot adds rows of the page's own under the themes:  the editor's "Edit theme...".
                  - `show="menu"` draws the panel alone, in place, as the body of a sub-menu in a menu of your own
                    (an epic page's gear menu).  Its `chosenTheme` names the theme chosen, for the row that opens it
                    ("Theme · Paper").
                </script>
              </ui-markdown>
              <ui-code language="js">
                <script type="text/plain">
                  document.querySelector("ui-theme-menu").addEventListener("ui-changed", (event) => console.log(event.detail))
                  // { theme: "merlot", scheme: "system", shown: "dark" }
                </script>
              </ui-code>
            </ui-section>
            <ui-section id="usage-keyboard" label="Keyboard" sticky="stack" collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  - Enter or Space on the palette button opens its panel, the chosen theme focused.
                  - In the theme list:  the arrows, Home and End move;  Enter or Space picks, and the panel stays open
                    to compare.
                  - Shift+Tab reaches Light | Dark | Auto:  the arrows move and choose, as in any radio group.
                  - Escape closes the panel, and focus goes back to the palette button.
                  - In a menu (`show="menu"`), the menu around it calls `focusChosen()` as it opens it:
                    the chosen theme is focused, and the keys are the panel's.  ArrowLeft, ArrowRight and Escape
                    are left to the menu around it, to close it.
                </script>
              </ui-markdown>
            </ui-section>
            <ui-section id="usage-accessibility" label="Accessibility" sticky="stack" collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  - The palette button's name says the theme and scheme chosen ("Theme and light / dark:  Spell,
                    Auto");  it's its tooltip too.
                  - The theme list is a `menu` of `menuitemradio`s, the chosen one checked;  Light | Dark | Auto a
                    `radiogroup`.
                  - Nothing for an author to add.
                </script>
              </ui-markdown>
            </ui-section>
          </ui-tab>

          <ui-tab value="api" label="API">
            <!-- API:  generated from the vocabularies (`site/_data/components.json5`);  nothing to write. -->
            <ui-section id="api-attributes" label="Attributes" sticky="stack" collapsible dividing>
              <ui-docs-api family="ui-theme-menu" only="attributes"></ui-docs-api>
            </ui-section>

            <ui-section id="api-events" label="Events" sticky="stack" collapsible dividing>
              <ui-docs-api family="ui-theme-menu" only="events"></ui-docs-api>
            </ui-section>

            <ui-section id="api-slots" label="Slots" sticky="stack" collapsible dividing>
              <ui-docs-api family="ui-theme-menu" only="slots"></ui-docs-api>
            </ui-section>

            <ui-section id="api-parts" label="Parts" sticky="stack" collapsible dividing>
              <ui-docs-api family="ui-theme-menu" only="parts"></ui-docs-api>
            </ui-section>

            <ui-section id="api-states" label="States" sticky="stack" collapsible dividing>
              <ui-docs-api family="ui-theme-menu" only="states"></ui-docs-api>
            </ui-section>

            <ui-section id="api-texts" label="Texts" sticky="stack" collapsible dividing>
              <ui-docs-api family="ui-theme-menu" only="texts"></ui-docs-api>
            </ui-section>
          </ui-tab>

          <ui-tab value="theming" label="Theming">
            <!-- THEMING:  the family's tokens, live, plus how to set them and which themes touch it. -->
            <ui-section id="theming-tokens" label="Tokens" sticky="stack" collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  Set a public `--ui-*` token on the element, any ancestor or `:root`; it inherits into the shadow
                  root. Edit a value below to try it.
                </script>
              </ui-markdown>
              <ui-docs-tokens family="ui-theme-menu" playground>
                <!-- playground:start  (yarn site:kitchen:  the family's main example) -->
                <ui-segment inverted>
                  <ui-theme-menu inverted size="small"></ui-theme-menu>
                </ui-segment>
                <!-- playground:end -->
              </ui-docs-tokens>
            </ui-section>
            <ui-section id="theming-themes" label="Themes" sticky="stack" collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  The theme menu above picks the theme for every page of the site:  Spell, Glass, Fruity or Merlot,
                  each restyling this component through its tokens.
                </script>
              </ui-markdown>
            </ui-section>
          </ui-tab>
        </ui-tabs>

      </ui-container>
    </main>
  </body>
</html>
