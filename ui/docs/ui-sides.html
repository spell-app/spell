<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Sides | Spell UI</title>
    <meta
      name="description"
      content="Sides edit four lengths at once, top, left, right and bottom, as a margin or a padding:  a number box per side."
    />
    <!-- Before first paint:  the viewer's colour scheme (`ThemePreference.HEAD_SCRIPT`, as oxfmt lays it out).  The theme itself is restored by site.js. -->
    <script>
      try {
        var l = localStorage,
          d = document.documentElement,
          s = l.getItem("spell-site:scheme") || l.getItem("spell-site:theme") || l.getItem("spell-ui-site:scheme")
        if (s === "light" || s === "dark") {
          d.classList.add("ui-" + s)
          d.style.colorScheme = s
        }
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="/components/ui/_assets/site.css" />
    <script type="module" src="/components/ui/_assets/site.js"></script>
    <!-- the comments (bullhorns, threads, Send):  the docs runtime's, alone, beside the site's Spell UI -->
    <script defer src="/_epic/assets/spell-comments.js"></script>
  </head>
  <body class="ui-typography">
    <main id="main" class="site-main" data-toc-header="Sides">
      <ui-segment appearance="vertical" class="site-masthead">
        <ui-container>
          <ui-menu icon class="site-page-links" aria-label="About this page">
            <ui-item
              link="https://github.com/spell-app/spell-app/issues/new?title=ui-sides%3A%20%20"
              target="_blank"
              icon="bug"
              aria-label="Report a bug"
              title="Report a bug"
            ></ui-item>
          </ui-menu>
          <ui-header level="1" class="site-title">
            Sides
            <ui-header>Sides edit four lengths at once, top, left, right and bottom, as a margin or a padding:  a number box per side.</ui-header>
          </ui-header>
          <ui-theme-menu show="theme" compact class="site-themes"></ui-theme-menu>
        </ui-container>
      </ui-segment>

      <ui-container class="site-body">
        <ui-tabs id="site-tabs" class="site-tabs" history appearance="segmented basic" align="fluid" equal>
          <ui-tab value="examples" label="Examples">
            <ui-section id="examples-types" label="Types" sticky="stack" collapsible dividing>
              <ui-section id="examples-types-sides" label="Sides" sticky="stack" collapsible dividing>
                <ui-example description="Four lengths, a margin or a padding:  top over left and right over bottom.">
                  <ui-sides aria-label="Margin" value="10 20 10 20"></ui-sides>
                </ui-example>
              </ui-section>
              <ui-section id="examples-types-as-an-object" label="As an object" sticky="stack" collapsible dividing>
                <ui-example
                  description="Its value as an object, by side names (JSON text in the attribute):  a side left out is empty, and a change gives back an object."
                >
                  <ui-sides aria-label="Padding" value='{ "top": 8, "bottom": 8 }'></ui-sides>
                </ui-example>
              </ui-section>
            </ui-section>
            <ui-section id="examples-variations" label="Variations" sticky="stack" collapsible dividing>
              <ui-section id="examples-variations-two-sides" label="Two sides" sticky="stack" collapsible dividing>
                <ui-example description="Only the sides it names, in one row.">
                  <ui-sides aria-label="Vertical padding" sides="top bottom" value="4 0"></ui-sides>
                </ui-example>
              </ui-section>
              <ui-section id="examples-variations-in-a-property-editor" label="In a property editor" sticky="stack" collapsible dividing>
                <ui-example description="A property whose type is `sides` draws one, half a row.">
                  <ui-property-editor compact show-defaults label="Box">
                    <ui-property name="margin" label="Margin" as="sides" default="0 0 0 0"></ui-property>
                    <ui-property name="padding" label="Padding" as="sides" default="0 0 0 0"></ui-property>
                  </ui-property-editor>
                </ui-example>
              </ui-section>
            </ui-section>
          </ui-tab>

          <ui-tab value="usage" label="Usage">
            <!-- USAGE:  how to use it (attributes in practice, events, framework snippets), keyboard, accessibility. -->
            <ui-section id="usage-using-it" label="Using it" sticky="stack" collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  - `value` takes CSS's text, one to four numbers in CSS's order (top right bottom left), or an object of
                    side names, `{ top, left, right, bottom }`:  as the property, or as JSON text in the attribute.
                  - It gives back the form it was given:  text in, text out;  an object in, an object out.
                  - `sides="top bottom"` (or `left right`) shows only those, in one row.
                  - In a form it submits CSS's text of all four, an empty side `0`.
                </script>
              </ui-markdown>
              <ui-code language="js">
                <script type="text/plain">
                  document.querySelector("ui-sides").addEventListener("ui-changed", (event) => console.log(event.detail.value))
                </script>
              </ui-code>
            </ui-section>
            <ui-section id="usage-keyboard" label="Keyboard" sticky="stack" collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  Tab moves from box to box;  each is a native number box, so the arrow keys step its length.
                </script>
              </ui-markdown>
            </ui-section>
            <ui-section id="usage-accessibility" label="Accessibility" sticky="stack" collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  - A group (`role="group"`), named by its `aria-label` or `<label for>`.
                  - Each box is named by its side (Top, Left ...);  the letters inside are hidden from screen readers.
                </script>
              </ui-markdown>
            </ui-section>
          </ui-tab>

          <ui-tab value="api" label="API">
            <!-- API:  generated from the vocabularies (`site/_data/components.json5`);  nothing to write. -->
            <ui-section id="api-attributes" label="Attributes" sticky="stack" collapsible dividing>
              <ui-docs-api family="ui-sides" only="attributes"></ui-docs-api>
            </ui-section>

            <ui-section id="api-properties" label="Properties" sticky="stack" collapsible dividing>
              <ui-docs-api family="ui-sides" only="properties"></ui-docs-api>
            </ui-section>

            <ui-section id="api-events" label="Events" sticky="stack" collapsible dividing>
              <ui-docs-api family="ui-sides" only="events"></ui-docs-api>
            </ui-section>

            <ui-section id="api-parts" label="Parts" sticky="stack" collapsible dividing>
              <ui-docs-api family="ui-sides" only="parts"></ui-docs-api>
            </ui-section>

            <ui-section id="api-states" label="States" sticky="stack" collapsible dividing>
              <ui-docs-api family="ui-sides" only="states"></ui-docs-api>
            </ui-section>

            <ui-section id="api-texts" label="Texts" sticky="stack" collapsible dividing>
              <ui-docs-api family="ui-sides" only="texts"></ui-docs-api>
            </ui-section>
          </ui-tab>

          <ui-tab value="theming" label="Theming">
            <!-- THEMING:  the family's tokens, live, plus how to set them and which themes touch it. -->
            <ui-section id="theming-tokens" label="Tokens" sticky="stack" collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  Set a public `--ui-*` token on the element, any ancestor or `:root`; it inherits into the shadow
                  root. Edit a value below to try it.
                </script>
              </ui-markdown>
              <ui-docs-tokens family="ui-sides" playground></ui-docs-tokens>
            </ui-section>
            <ui-section id="theming-themes" label="Themes" sticky="stack" collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  The theme menu above picks the theme for every page of the site:  Spell, Glass, Fruity or Merlot,
                  each restyling this component through its tokens.
                </script>
              </ui-markdown>
            </ui-section>
          </ui-tab>
        </ui-tabs>

      </ui-container>
    </main>
  </body>
</html>
