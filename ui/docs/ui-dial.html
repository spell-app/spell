          d.style.colorScheme = s

          <ui-tab value="usage" label="Usage">
            <!-- USAGE:  how to use it (attributes in practice, events, framework snippets), keyboard, accessibility. -->
            <ui-section id="usage-using-it" label="Using it" sticky="stack" collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  Write `<ui-dial>` with a `label`:  it's the words under the dial, and its name for screen readers.

                  - `min` / `max` / `step` default to 0, 100 and 1;  `step="0"` allows any value.
                  - `value` is the starting (and reset) value;  the `value` property is the live one.
                  - `unit` is written right after the number (`98%`), and spoken with it.
                  - `ticks` draws dots round the ring:  9 alone, or that many gaps.
                  - `color` and `size` as on any Spell UI element.

                  It works the way `<ui-slider>` does, bent round:  the same events, keys and form behaviour.

                  In Spell, `<dial label="Volume" value="40">`;  in Spanish, `<perilla etiqueta="Volumen">`.
                </script>
              </ui-markdown>
            </ui-section>
            <ui-section id="usage-events" label="Events" sticky="stack" collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  `ui-moved` fires on every move, and `ui-changed` when a key, a wheel notch or a drag ends somewhere
                  new, both with `{ value }`.  Setting `value` inside a `ui-moved` handler wins, so you can clamp or
                  refuse a turn.
                </script>
              </ui-markdown>
              <ui-code language="js">
                <script type="text/plain">
                  const weight = document.querySelector("#weight") // <ui-dial id="weight" min="100" max="900" label="Weight">
                  weight.addEventListener("ui-changed", (event) => console.log(event.detail.value))
                </script>
              </ui-code>
            </ui-section>
            <ui-section id="usage-forms" label="Forms" sticky="stack" collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  A dial is a form-associated element.

                  - With a `name`, it submits `value`.
                  - A form reset puts back the starting `value` (the attribute).
                  - `disabled` leaves it out of the form;  `readonly` still submits.
                  - `required`:  until something sets a value, the handle rests at `min` but the dial counts as empty.
                </script>
              </ui-markdown>
            </ui-section>
            <ui-section id="usage-keyboard" label="Keyboard" sticky="stack" collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  | Key                 | Action                         |
                  | ------------------- | ------------------------------ |
                  | Right / Up          | Turn up a step                 |
                  | Left / Down         | Turn down a step               |
                  | Page Up / Page Down | Turn two steps                 |
                  | Home / End          | Turn to `min` / `max`          |
                  | Mouse wheel         | A step a notch, while focused  |

                  The wheel turns the dial only while it has focus, so scrolling the page past it never changes it.
                </script>
              </ui-markdown>
            </ui-section>
            <ui-section id="usage-accessibility" label="Accessibility" sticky="stack" collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  The dial is an ARIA `slider` (the APG pattern) with `aria-valuemin`, `aria-valuemax`, `aria-valuenow`
                  and `aria-valuetext`, the value as shown (`98%`).

                  - Named by its `aria-label`, a `<label for>`, else its own `label`.
                  - Keyboard focus draws a ring round the handle.
                  - `readonly` stays focusable and announced but can't change;  `disabled` leaves the tab order.
                  - If it can't draw, its fallback is the browser's range input, so the value can still be set and
                    submitted.
                </script>
              </ui-markdown>
            </ui-section>

                  Theme with the public `--ui-dial-*` tokens:  set one on the element, on any ancestor (`:root`
                  included), or through `::part(dial)`.  `--ui-dial-size` sets its width, `--ui-dial-track-width`
                  the ring's (in its 100-wide drawing's units), and `color` replaces `--ui-dial-fill-color`.
                  Style the pieces with `::part()`:  `track`, `track-fill`, `handle`, `disc`, `ticks`, `value`
                  and `label`.  Edit a value below to try it.
                </script>
