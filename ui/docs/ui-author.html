<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Author | Spell UI</title>
    <meta
      name="description"
      content="An author names who wrote a comment or did a feed event."
    />
    <!-- Before first paint:  the viewer's colour scheme (`ThemePreference.HEAD_SCRIPT`, as oxfmt lays it out).  The theme itself is restored by site.js. -->
    <script>
      try {
        var l = localStorage,
          d = document.documentElement,
          s = l.getItem("spell-site:scheme") || l.getItem("spell-site:theme") || l.getItem("spell-ui-site:scheme")
        if (s === "light" || s === "dark") {
          d.classList.add("ui-" + s)
          d.style.colorScheme = s
        }
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="_assets/site.css" />
    <script type="module" src="_assets/site.js"></script>
    <!-- the comments (bullhorns, threads, Send):  the docs runtime's, alone, beside the site's Spell UI -->
    <script defer src="/_epic/assets/spell-comments.js"></script>
  </head>
  <body class="ui-typography">
    <main id="main" class="site-main" data-toc-header="Author">
      <ui-segment class="site-masthead" appearance="vertical">
        <ui-container>
          <ui-menu icon class="site-page-links" aria-label="About this page">
            <ui-item
              link="https://github.com/spell-app/spell-ui/issues/new?title=ui-author%3A%20%20"
              target="_blank"
              icon="bug"
              aria-label="Report a bug"
              title="Report a bug"
            ></ui-item>
          </ui-menu>
          <ui-header level="1" class="site-title">
            Author
            <ui-header>An author names who wrote a comment or did a feed event.</ui-header>
          </ui-header>
          <ui-theme-menu show="theme" compact class="site-themes"></ui-theme-menu>
        </ui-container>
      </ui-segment>

      <ui-container class="site-body">
        <ui-tabs id="site-tabs" class="site-tabs" history appearance="segmented basic" align="fluid" equal>
          <ui-tab value="examples" label="Examples">
            <!--
              EXAMPLES:  `<ui-author>` in each owner that gives it a look (from the owners' own pages and
              `src/components/ui-parts/examples/elements/`), then its attributes.  The Content parts page
              (`ui-header.html`) shows every part together.
            -->
            <ui-section id="examples-owners" label="Owners" sticky="stack" collapsible dividing>
              <ui-section id="examples-owners-comment" label="Comment" sticky="stack" collapsible dividing>
                <ui-example description="A comment's author, before its metadata.">
                  <ui-comments>
                    <ui-comment>
                      <ui-avatar src="images/avatar/small/matt.jpg"></ui-avatar>
                      <ui-content>
                        <ui-author link="#matt">Matt</ui-author>
                        <ui-meta><span>Today at 5:42PM</span></ui-meta>
                        <ui-description>How artistic!</ui-description>
                      </ui-content>
                    </ui-comment>
                  </ui-comments>
                </ui-example>
              </ui-section>

              <ui-section id="examples-owners-feed" label="Feed" sticky="stack" collapsible dividing>
                <ui-example description="A feed event's user, inline in its summary.">
                  <ui-feed>
                    <ui-event>
                      <ui-content>
                        <ui-summary><ui-author link="#elliot">Elliot Fu</ui-author> added you as a friend</ui-summary>
                      </ui-content>
                    </ui-event>
                  </ui-feed>
                </ui-example>
              </ui-section>
            </ui-section>

            <ui-section id="examples-variations" label="Variations" sticky="stack" collapsible dividing>
              <ui-section id="examples-variations-link" label="Link" sticky="stack" collapsible dividing>
                <ui-example description="With `link`, an author is a real link;  without, plain text.">
                  <ui-comments>
                    <ui-comment>
                      <ui-content>
                        <ui-author link="#stevie">Stevie Feliciano</ui-author>
                        <ui-description>A linked author.</ui-description>
                      </ui-content>
                    </ui-comment>
                    <ui-comment>
                      <ui-content>
                        <ui-author>Anonymous</ui-author>
                        <ui-description>A plain author.</ui-description>
                      </ui-content>
                    </ui-comment>
                  </ui-comments>
                </ui-example>
              </ui-section>
            </ui-section>
          </ui-tab>

          <ui-tab value="usage" label="Usage">
            <ui-section id="usage-using-it" label="Using it" sticky="stack" collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  `<ui-author>` names who wrote a comment or did a feed event (Fomantic's comment `author` and feed `user`).

                  - `link` renders a real link (`<a>`), e.g. to a profile; `target` goes with it.
                  - In a feed it sits inline in the `<ui-summary>`; in a comment it opens the content, before the `<ui-meta>`.
                </script>
              </ui-markdown>
            </ui-section>

            <ui-section id="usage-owners" label="Owners" sticky="stack" collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  `<ui-author>` finds its nearest owner and sets `:state(in-<owner>)` on itself; `UIParts.css` styles it by that
                  state. Its owners, and what each makes of it:

                  - [Comment](ui-comment.html) (`:state(in-comment)`): bold, at the start of the comment's content
                  - [Feed](ui-feed.html) (`:state(in-feed)`): bold, inline in the event's summary

                  Anywhere else it is an unstyled block. More on how parts find their owners: [Content parts](ui-header.html#usage-owners).
                </script>
              </ui-markdown>
            </ui-section>

            <ui-section id="usage-accessibility" label="Accessibility" sticky="stack" collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  - With `link` it renders a real `<a>`: **Tab** reaches it, **Enter** follows it.
                  - Without `link` it is plain inline text with no role.
                </script>
              </ui-markdown>
            </ui-section>
          </ui-tab>

          <ui-tab value="api" label="API">
            <!-- API:  generated from the vocabularies (`docs/__data/components.json5`);  nothing to write. -->
            <ui-section id="api-attributes" label="Attributes" sticky="stack" collapsible dividing>
              <ui-docs-api tag="ui-author" only="attributes"></ui-docs-api>
            </ui-section>

            <ui-section id="api-slots" label="Slots" sticky="stack" collapsible dividing>
              <ui-docs-api tag="ui-author" only="slots"></ui-docs-api>
            </ui-section>

            <ui-section id="api-parts" label="Parts" sticky="stack" collapsible dividing>
              <ui-docs-api tag="ui-author" only="parts"></ui-docs-api>
            </ui-section>

            <ui-section id="api-states" label="States" sticky="stack" collapsible dividing>
              <ui-docs-api tag="ui-author" only="states"></ui-docs-api>
            </ui-section>
          </ui-tab>
        </ui-tabs>
      </ui-container>
    </main>
  </body>
</html>
