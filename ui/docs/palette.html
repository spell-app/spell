<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Palette groups | Spell UI</title>
    <meta
      name="description"
      content="The Spell editor's palette groups moved into the editor:  its own page, at /palette."
    />
    <!--
      The palette groups page's old home (epic `editor` T81):  the arranger moved into the editor in epic `editor` P42,
      Q81 (Owen:  "shouldn't be in spell-ui at all"), as its page `/palette` (`<PaletteGroupsPage>`).
      - Kept until epic `editor` P43, pointing there:  the page server's `/editor/palette` opens it on this checkout's
        editor, whichever port it took.
    -->
    <!-- Before first paint:  the viewer's colour scheme (`ThemePreference.HEAD_SCRIPT`, as oxfmt lays it out).  The theme itself is restored by site.js. -->
    <script>
      try {
        var l = localStorage,
          d = document.documentElement,
          s = l.getItem("spell-site:scheme") || l.getItem("spell-site:theme") || l.getItem("spell-ui-site:scheme")
        if (s === "light" || s === "dark") {
          d.classList.add("ui-" + s)
          d.style.colorScheme = s
        }
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="_assets/site.css" />
    <script type="module" src="_assets/site.js"></script>
    <!-- the comments (bullhorns, threads, Send):  the docs runtime's, alone, beside the site's Spell UI -->
    <script defer src="/_epic/assets/spell-comments.js"></script>
  </head>
  <body class="ui-typography">
    <main id="main" class="site-main" data-toc-header="Palette groups">
      <ui-segment class="site-masthead" appearance="vertical">
        <ui-container>
          <ui-header level="1" class="site-title">
            Palette groups
            <ui-header
              >The Spell editor's palette groups are arranged in the editor now.</ui-header
            >
          </ui-header>
        </ui-container>
      </ui-segment>

      <ui-container class="site-body">
        <article class="site-article">
          <ui-section id="palette-groups" label="The palette's groups" dividing>
            <ui-markdown>
              <script type="text/markdown">
                The editor's **+** menu shows its components in groups.
                You arrange those groups on a page of the editor itself now:  [open the palette groups page](/editor/palette).

                - Drag a component to another group, or a group by its handle.
                - Rename a group, pick its icon, add or remove one.
                - **Save**, then reload the editor's tab to see the new groups in the **+** menu.
              </script>
            </ui-markdown>
          </ui-section>
        </article>
      </ui-container>
    </main>
  </body>
</html>
