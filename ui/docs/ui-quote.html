<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Quote | Spell UI</title>
    <meta
      name="description"
      content="A quote holds someone else&#39;s words:  a block of its own, or a few words inside a sentence."
    />
    <!-- Before first paint:  the viewer's colour scheme (`ThemePreference.HEAD_SCRIPT`, as oxfmt lays it out).  The theme itself is restored by site.js. -->
    <script>
      try {
        var l = localStorage,
          d = document.documentElement,
          s = l.getItem("spell-site:scheme") || l.getItem("spell-site:theme") || l.getItem("spell-ui-site:scheme")
        if (s === "light" || s === "dark") {
          d.classList.add("ui-" + s)
          d.style.colorScheme = s
        }
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="_assets/site.css" />
    <script type="module" src="_assets/site.js"></script>
    <!-- the comments (bullhorns, threads, Send):  the docs runtime's, alone, beside the site's Spell UI -->
    <script defer src="/_epic/assets/spell-comments.js"></script>
  </head>
  <body class="ui-typography">
    <main id="main" class="site-main" data-toc-header="Quote">
      <ui-segment appearance="vertical" class="site-masthead">
        <ui-container>
          <ui-menu icon class="site-page-links" aria-label="About this page">
            <ui-item
              link="https://github.com/spell-app/spell-app/issues/new?title=ui-quote%3A%20%20"
              icon="bug"
              aria-label="Report a bug"
              title="Report a bug"
            ></ui-item>
          </ui-menu>
          <ui-header level="1" class="site-title">
            Quote
            <ui-header>A quote holds someone else&#39;s words:  a block of its own, or a few words inside a sentence.</ui-header>
          </ui-header>
          <ui-theme-menu show="theme" compact class="site-themes"></ui-theme-menu>
        </ui-container>
      </ui-segment>

      <ui-container class="site-body">
        <ui-tabs id="site-tabs" class="site-tabs" history appearance="segmented basic" align="fluid" equal>
          <ui-tab value="examples" label="Examples">
            <!--
              EXAMPLES:  Fomantic's page, section by section, in its order (Types, Content, States, Variations,
              Groups ...).  Rules, the class-grammar mappings, gaps:  epics/spell-ui-pages/PAGES.md.
              - A section:  `<ui-section id="examples-types" label="Types" sticky collapsible dividing>` around
                its examples;  ids spell out the nesting (`<tab>-<section>-<example>`, lowercase kebab of the headers).
              - An example:  its own nested section (`header` = the example's name) around
                `<ui-docs-example description="...">` and the live markup;  the markup IS the code shown.  A richer
                description:  `<p slot="description">` (+ `<ui-message slot="description">`).  Fomantic's header-less
                `.another.example`:  a second `<ui-docs-example>` in the same section.
              - Or write it flat (`<ui-header level="2">`, `<ui-docs-example header>`) and run `yarn site:sections`:
                it nests it and writes the ids (and fixes them after a header changes).
              - A gap:  an HTML comment `GAP I<n>:  ...` BEFORE the example's section (a comment inside the example
                shows in its code).
            -->
            <ui-section id="examples-types" label="Types" sticky collapsible dividing>
              <ui-section id="examples-types-quote" label="Quote" sticky collapsible dividing>
                <ui-docs-example description="A block quote:  a bar on its leading edge, muted text.  `cite` names where the words come from, for readers' tools.">
                  <ui-quote cite="https://en.wikipedia.org/wiki/Alan_Kay">
                    The best way to predict the future is to invent it.
                  </ui-quote>
                </ui-docs-example>
              </ui-section>
              <ui-section id="examples-types-inline" label="Inline" sticky collapsible dividing>
                <ui-docs-example description="`inline`:  a few words inside a sentence, in the language's own quotation marks.">
                  <p>She looked up and said <ui-quote inline>not today</ui-quote>, then went back to her book.</p>
                  <p lang="fr">Elle a dit <ui-quote inline>pas aujourd'hui</ui-quote>.</p>
                </ui-docs-example>
              </ui-section>
            </ui-section>
          </ui-tab>

          <ui-tab value="usage" label="Usage">
            <!-- USAGE:  how to use it (attributes in practice, events, framework snippets), keyboard, accessibility. -->
            <ui-section id="usage-using-it" label="Using it" sticky collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  `<ui-quote>` holds someone else's words.

                  - By default it's a block quote:  its own block, a bar on its leading edge, the text muted.
                  - `inline` puts it inside a sentence instead, with quotation marks round it.
                    The marks are the browser's for the text's language:  “…” in English, « … » in French.
                  - `cite` is the address the words come from.  It isn't shown:  it's for readers' tools.
                  - The look is the Markdown pages' block quote.  Its tokens, `--ui-quote-color` and `--ui-quote-border`,
                    fall back to the Markdown ones, so a theme that sets those sets both.
                </script>
              </ui-markdown>
            </ui-section>
            <ui-section id="usage-accessibility" label="Accessibility" sticky collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  A block quote is a real `<blockquote>`, and an inline one a real `<q>`:  screen readers announce them as quotations.
                </script>
              </ui-markdown>
            </ui-section>
          </ui-tab>

          <ui-tab value="api" label="API">
            <!-- API:  generated from the vocabularies (`site/_data/components.json5`);  nothing to write. -->
            <ui-section id="api-attributes" label="Attributes" sticky collapsible dividing>
              <ui-docs-api family="ui-quote" only="attributes"></ui-docs-api>
            </ui-section>

            <ui-section id="api-slots" label="Slots" sticky collapsible dividing>
              <ui-docs-api family="ui-quote" only="slots"></ui-docs-api>
            </ui-section>

            <ui-section id="api-parts" label="Parts" sticky collapsible dividing>
              <ui-docs-api family="ui-quote" only="parts"></ui-docs-api>
            </ui-section>

            <ui-section id="api-states" label="States" sticky collapsible dividing>
              <ui-docs-api family="ui-quote" only="states"></ui-docs-api>
            </ui-section>
          </ui-tab>
        </ui-tabs>

      </ui-container>
    </main>
  </body>
</html>
