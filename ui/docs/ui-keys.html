          d.classList.add("ui-" + s)
          d.style.colorScheme = s
        }
      } catch (e) {}
    </script>

      <ui-container class="site-body">

          <ui-tab value="examples" label="Examples">
            <!--
              EXAMPLES:  Fomantic's page, section by section, in its order (Types, Content, States, Variations,
              Groups ...).  Rules, the class-grammar mappings, gaps:  epics/spell-ui-pages/PAGES.md.
              - A section:  `<ui-section id="examples-types" label="Types" sticky collapsible dividing>` around
                its examples;  ids spell out the nesting (`<tab>-<section>-<example>`, lowercase kebab of the headers).
              - An example:  its own nested section (`header` = the example's name) around
                `<ui-docs-example description="...">` and the live markup;  the markup IS the code shown.  A richer
                description:  `<p slot="description">` (+ `<ui-message slot="description">`).  Fomantic's header-less
                `.another.example`:  a second `<ui-docs-example>` in the same section.
              - Or write it flat (`<ui-header level="2">`, `<ui-docs-example header>`) and run `yarn site:sections`:
                it nests it and writes the ids (and fixes them after a header changes).
              - A gap:  an HTML comment `GAP I<n>:  ...` BEFORE the example's section (a comment inside the example
                shows in its code).
            -->
            <ui-section id="examples-types" label="Types" sticky collapsible dividing>
              <ui-section id="examples-types-keys" label="Keys" sticky collapsible dividing>
                <ui-docs-example description="`shortcut`, the keys joined by `+`.  `mod` is ⌘ on a Mac and Ctrl elsewhere:  this page shows the keys of the keyboard you're reading it on.">
                  <p>Save with <ui-keys shortcut="mod+S"></ui-keys>, undo with <ui-keys shortcut="mod+Z"></ui-keys>.</p>
                </ui-docs-example>
              </ui-section>
              <ui-section id="examples-types-on-a-mac-and-elsewhere" label="On a Mac, and elsewhere" sticky collapsible dividing>
                <ui-docs-example description="`platform=&quot;apple&quot;` or `&quot;other&quot;` draws one keyboard's keys whatever the reader has.">
                  <p>
                    <ui-keys shortcut="shift+mod+P" platform="apple"></ui-keys> on a Mac,
                    <ui-keys shortcut="shift+mod+P" platform="other"></ui-keys> elsewhere.
                  </p>
                </ui-docs-example>
              </ui-section>
              <ui-section id="examples-types-two-shortcuts" label="Two shortcuts" sticky collapsible dividing>
                <ui-docs-example description="Two shortcuts, a space apart, draw both.">
                  <p>Redo with <ui-keys shortcut="shift+mod+Z mod+Y"></ui-keys>.</p>
                </ui-docs-example>
              </ui-section>
              <ui-section id="examples-types-named-keys" label="Named keys" sticky collapsible dividing>
                <ui-docs-example description="Arrows, Enter, Escape, Tab, Backspace, Delete and Space have caps of their own.">
                  <p>
                    <ui-keys shortcut="up"></ui-keys> <ui-keys shortcut="down"></ui-keys> to move,
                    <ui-keys shortcut="enter"></ui-keys> to open, <ui-keys shortcut="escape"></ui-keys> to close.
                  </p>
                </ui-docs-example>
              </ui-section>
            </ui-section>
          </ui-tab>

          <ui-tab value="usage" label="Usage">
            <!-- USAGE:  how to use it (attributes in practice, events, framework snippets), keyboard, accessibility. -->
            <ui-section id="usage-using-it" label="Using it" sticky collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  `<ui-keys>` draws a keyboard shortcut as key caps, the way the reader's own keyboard writes it.

                  - `shortcut` is the keys, joined by `+`:  `"mod+S"`, `"shift+mod+P"`, `"escape"`.
                  - `mod` (or `modifier`) is ⌘ on a Mac and Ctrl elsewhere:  write it for the app's main shortcut key.
                  - `ctrl`, `alt` (Option on a Mac), `shift` and `meta` are those keys themselves.
                  - Two shortcuts, a space apart, draw both.
                  - `platform` draws a Mac's keys (`apple`) or everyone else's (`other`), whatever the reader has.

                  It only draws the shortcut.  Making the keys do something is the page's:  `UI.keyboard` reads the same words.
                </script>
              </ui-markdown>
            </ui-section>
            <ui-section id="usage-accessibility" label="Accessibility" sticky collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  Screen readers hear words, not symbols:  `<ui-keys shortcut="mod+S">` is read as "Command S" on a Mac,
                  "Control S" elsewhere.  The words are translated with the page's language.
                </script>
              </ui-markdown>
            </ui-section>
          </ui-tab>

          <ui-tab value="api" label="API">
            <!-- API:  generated from the vocabularies (`site/_data/components.json5`);  nothing to write. -->
