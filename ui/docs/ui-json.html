    <script>
      try {
        var l = localStorage,
          d = document.documentElement,
          s = l.getItem("spell-site:scheme") || l.getItem("spell-site:theme") || l.getItem("spell-ui-site:scheme")
        if (s === "light" || s === "dark") {
          d.classList.add("ui-" + s)
          d.style.colorScheme = s
        }
      } catch (e) {}
    </script>

    <script type="module" src="/components/ui/_assets/site.js"></script>

    <main id="main" class="site-main" data-toc-header="JSON data">
      <ui-segment appearance="vertical" class="site-masthead">
        <ui-container>

            <ui-item

          <ui-header level="1" class="site-title">
            JSON data
            <ui-header>JSON data holds data in a page, as its text or from a file:  it draws nothing, and other elements read it.</ui-header>
          </ui-header>
          <ui-theme-menu show="theme" compact class="site-themes"></ui-theme-menu>
        </ui-container>
      </ui-segment>

      <ui-container class="site-body">
        <ui-tabs id="site-tabs" class="site-tabs" history appearance="segmented basic" align="fluid" equal>
          <ui-tab value="examples" label="Examples">
            <!-- EXAMPLES:  it draws nothing, so each example shows it read by a <ui-tree-diagram>. -->
            <ui-section id="examples-types" label="Types" sticky="stack" collapsible dividing>
              <ui-section id="examples-types-its-own-text" label="Its own text" sticky="stack" collapsible dividing>
                <ui-example description="The data is the element's text.  It draws nothing itself:  here a tree diagram reads the `&lt;ui-json&gt;` inside it.">
                  <ui-tree-diagram>
                    <ui-json>
                      {
                        "label": "Add",
                        "children": [{ "label": "Number 1" }, { "label": "Number 2" }]
                      }
                    </ui-json>
                  </ui-tree-diagram>
                </ui-example>
              </ui-section>
              <ui-section id="examples-types-from-a-file" label="From a file" sticky="stack" collapsible dividing>
                <ui-example description="`source` loads the data from a file on this site, and the tree diagram draws it once it arrives.">
                  <ui-tree-diagram>
                    <ui-json source="examples/tree-data.json"></ui-json>
                  </ui-tree-diagram>
                </ui-example>
              </ui-section>
              <ui-section id="examples-types-a-script-child" label="A script child" sticky="stack" collapsible dividing>
                <ui-example description="A `&lt;script type=&quot;application/json&quot;&gt;` inside it holds text the page must not read as markup, such as a `&lt;`.">
                  <ui-tree-diagram>
                    <ui-json>
                      <script type="application/json">
                        { "label": "a < b", "children": [{ "label": "a" }, { "label": "b" }] }
                      </script>
                    </ui-json>
                  </ui-tree-diagram>
                </ui-example>
              </ui-section>
            </ui-section>
          </ui-tab>

          <ui-tab value="usage" label="Usage">
            <!-- USAGE:  how to use it (attributes in practice, events, framework snippets), keyboard, accessibility. -->
            <ui-section id="usage-using-it" label="Using it" sticky="stack" collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  `<ui-json>` holds JSON data in a page, and draws nothing.

                  - Its text is the data, or `source` loads it from a file on the same site.
                  - `load` says when:  `eager` (at once), `visible` or `idle`.
                  - An element that takes JSON reads a `<ui-json>` child by itself.
                    `<ui-tree-diagram>` does, and follows it as it changes.

                  A `<script type="application/json">` is the older way of holding data in a page.
                  It works where it did, and inside a `<ui-json>` too.
                  Use one there when the JSON holds a `<`, which a page would read as a tag.

                  In Spell it's `<json>`, and its text is kept as written:
                  its `{` and `[` are JSON's, not Spell's.
                </script>
              </ui-markdown>
            </ui-section>
            <ui-section id="usage-from-script" label="From script" sticky="stack" collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  `value` is the data, parsed.
                  It's `undefined` while `source` loads, and when the text is empty or isn't JSON.
                  Set it to hold other data.  `ui-changed` says when it changed.

                  ```js
                  const data = document.querySelector("ui-json")
                  await data.loaded
                  console.log(data.value)

                  data.addEventListener("ui-changed", (event) => console.log(event.detail.value))
                  data.value = { label: "New" }
                  ```

                  Text that isn't JSON logs one console warning, sends `ui-error` and sets `:state(error)`.
                  So does a file that won't load:  nothing draws, so nothing else would show it.
                </script>
              </ui-markdown>
            </ui-section>
            <ui-section id="usage-accessibility" label="Accessibility" sticky="stack" collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  JSON data has no role and shows nothing:  screen readers pass over it.
                  What reads it says what it means:  a tree diagram names itself from the data.
                </script>
              </ui-markdown>
            </ui-section>
          </ui-tab>

          <ui-tab value="api" label="API">
            <!-- API:  generated from the vocabularies (`site/_data/components.json5`);  nothing to write. -->
            <ui-section id="api-attributes" label="Attributes" sticky="stack" collapsible dividing>

            <ui-section id="api-events" label="Events" sticky="stack" collapsible dividing>

            <ui-section id="api-states" label="States" sticky="stack" collapsible dividing>
              <ui-docs-api family="ui-json" only="states"></ui-docs-api>
            </ui-section>
          </ui-tab>
        </ui-tabs>

      </ui-container>
    </main>
