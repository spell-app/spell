<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Action | Spell UI</title>
    <meta
      name="description"
      content="An action is a menu item or toolbar button drawn from something a program can do:  its title, icon and shortcut keys, greyed while it can't be done."
    />
    <!-- Before first paint:  the viewer's colour scheme (`ThemePreference.HEAD_SCRIPT`, as oxfmt lays it out).  The theme itself is restored by site.js. -->
    <script>
      try {
        var l = localStorage,
          d = document.documentElement,
          s = l.getItem("spell-site:scheme") || l.getItem("spell-site:theme") || l.getItem("spell-ui-site:scheme")
        if (s === "light" || s === "dark") {
          d.classList.add("ui-" + s)
          d.style.colorScheme = s
        }
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="_assets/site.css" />
    <script type="module" src="_assets/site.js"></script>
    <!-- the comments (bullhorns, threads, Send):  the docs runtime's, alone, beside the site's Spell UI -->
    <script defer src="/_epic/assets/spell-comments.js"></script>
  </head>

    <main id="main" class="site-main" data-toc-header="Action">
      <ui-segment class="site-masthead" appearance="vertical">
        <ui-container>
          <ui-menu icon class="site-page-links" aria-label="About this page">
            <ui-item
              link="https://github.com/spell-app/spell-app/issues/new?title=ui-action%3A%20%20"
              target="_blank"
              icon="bug"
              aria-label="Report a bug"
              title="Report a bug"
            ></ui-item>
          </ui-menu>
          <ui-header level="1" class="site-title">
            Action
            <ui-header>An action is a menu item or toolbar button drawn from something a program can do:  its title, icon and shortcut keys, greyed while it can't be done.</ui-header>
          </ui-header>
          <ui-theme-menu show="theme" compact class="site-themes"></ui-theme-menu>
        </ui-container>
      </ui-segment>

      <ui-container class="site-body">
        <ui-tabs id="site-tabs" class="site-tabs" history appearance="segmented basic" align="fluid" equal>
          <ui-tab value="examples" label="Examples">
            <!--
              EXAMPLES:  Fomantic's page, section by section, in its order (Types, Content, States, Variations,
              Groups ...).  Rules, the class-grammar mappings, gaps:  epics/spell-ui-pages/PAGES.md.
              - A section:  `<ui-section id="examples-types" label="Types" sticky collapsible dividing>` around
                its examples;  ids spell out the nesting (`<tab>-<section>-<example>`, lowercase kebab of the headers).
              - An example:  its own nested section (`header` = the example's name) around
                `<ui-docs-example description="...">` and the live markup;  the markup IS the code shown.  A richer
                description:  `<p slot="description">` (+ `<ui-message slot="description">`).  Fomantic's header-less
                `.another.example`:  a second `<ui-docs-example>` in the same section.
              - Or write it flat (`<ui-header level="2">`, `<ui-docs-example header>`) and run `yarn site:sections`:
                it nests it and writes the ids (and fixes them after a header changes).
              - A gap:  an HTML comment `GAP I<n>:  ...` BEFORE the example's section (a comment inside the example
                shows in its code).
            -->
            <ui-section id="examples-types" label="Types" sticky collapsible dividing>
              <ui-section id="examples-types-menu" label="Menu" sticky collapsible dividing>
                <ui-docs-example description="A menu of actions:  each its title, then its shortcut's keys.  `meta` is ⌘ on a Mac, Ctrl elsewhere.">
                  <ui-menu direction="vertical" aria-label="Game">
                    <ui-action icon="play" shortcut="meta+N">New game</ui-action>
                    <ui-action kind="divider"></ui-action>
                    <ui-action icon="undo" shortcut="meta+Z">Undo Turn Card</ui-action>
                    <ui-action icon="redo" shortcut="meta+shift+Z" disabled>Redo</ui-action>
                  </ui-menu>
                </ui-docs-example>
              </ui-section>
              <ui-section id="examples-types-toolbar" label="Toolbar" sticky collapsible dividing>
                <ui-docs-example description="The same actions as a toolbar's buttons.">
                  <ui-toolbar aria-label="Game">
                    <ui-action icon="play" shortcut="meta+N">New game</ui-action>
                    <ui-action icon="undo" shortcut="meta+Z">Undo</ui-action>
                    <ui-action icon="redo" shortcut="meta+shift+Z" disabled>Redo</ui-action>
                  </ui-toolbar>
                </ui-docs-example>
              </ui-section>
            </ui-section>
            <ui-section id="examples-states" label="States" sticky collapsible dividing>
              <ui-section id="examples-states-disabled-and-selected" label="Disabled and selected" sticky collapsible dividing>
                <ui-docs-example description="Greyed while it can't be done (`disabled`, or its action not enabled);  ticked while it's on (`selected`).">
                  <ui-menu direction="vertical" aria-label="View">
                    <ui-action shortcut="meta+1" selected>Show the grid</ui-action>
                    <ui-action shortcut="meta+2">Show the rulers</ui-action>
                    <ui-action shortcut="meta+3" disabled>Show the guides</ui-action>
                  </ui-menu>
                </ui-docs-example>
              </ui-section>
            </ui-section>
          </ui-tab>

          <ui-tab value="usage" label="Usage">
            <!-- USAGE:  how to use it (attributes in practice, events, framework snippets), keyboard, accessibility. -->
            <ui-section id="usage-using-it" label="Using it" sticky collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  Put `<ui-action>`s where you'd put `<ui-item>`s:  in a `<ui-menu>`, a `<ui-toolbar>` or a list.  Each draws as one of its items.

                  - Written by hand:  its title as its text, its keys in `shortcut`, `icon`, `disabled` and `selected`.
                  - Drawn from an action:  set its `action` property, and it reads the title, icon, shortcut and state from there, live.  A click runs it, unless it's disabled.
                  - Any object of the action's shape will do;  Spell's runner hands it each item of a template's menu.
                </script>
              </ui-markdown>
              <ui-code language="js">
                <script type="text/plain">
                  const undo = document.createElement("ui-action")
                  undo.action = {
                    get title() { return history.undoTitle },  // "Undo Turn Card"
                    shortcut: "meta+Z",
                    get isEnabled() { return history.canUndo },
                    isSelected: false,
                    run: () => history.undo()
                  }
                  document.querySelector("ui-menu").append(undo)
                </script>
              </ui-code>
            </ui-section>
            <ui-section id="usage-keyboard" label="Keyboard" sticky collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  As its menu's or toolbar's items:  Tab, or the arrow keys in an `interactive` menu, reach it;  Enter or Space runs it.  Its `shortcut` is only drawn:  the page binds the keys (Spell's runner does, for a program's actions).
                </script>
              </ui-markdown>
            </ui-section>
            <ui-section id="usage-accessibility" label="Accessibility" sticky collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  A `<button>` (a link with `link`), named by its title;  `aria-disabled` while it can't be done, the owner's role in a menubar (`menuitem`).  The key caps are part of its name as a screen reader reads it, after the title.
                </script>
              </ui-markdown>
            </ui-section>
          </ui-tab>

          <ui-tab value="api" label="API">
            <!-- API:  generated from the vocabularies (`site/_data/components.json5`);  nothing to write. -->
            <ui-section id="api-attributes" label="Attributes" sticky collapsible dividing>
              <ui-docs-api family="ui-action" only="attributes"></ui-docs-api>
            </ui-section>

            <ui-section id="api-properties" label="Properties" sticky collapsible dividing>
              <ui-docs-api family="ui-action" only="properties"></ui-docs-api>
            </ui-section>

            <ui-section id="api-slots" label="Slots" sticky collapsible dividing>
              <ui-docs-api family="ui-action" only="slots"></ui-docs-api>
            </ui-section>

            <ui-section id="api-parts" label="Parts" sticky collapsible dividing>
              <ui-docs-api family="ui-action" only="parts"></ui-docs-api>
            </ui-section>

            <ui-section id="api-states" label="States" sticky collapsible dividing>
              <ui-docs-api family="ui-action" only="states"></ui-docs-api>
            </ui-section>

            <ui-section id="api-texts" label="Texts" sticky collapsible dividing>
              <ui-docs-api family="ui-action" only="texts"></ui-docs-api>
            </ui-section>
          </ui-tab>

          <ui-tab value="theming" label="Theming">
            <!-- THEMING:  the family's tokens, live, plus how to set them and which themes touch it. -->
            <ui-section id="theming-tokens" label="Tokens" sticky collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  Set a public `--ui-*` token on the element, any ancestor or `:root`; it inherits into the shadow
                  root. Edit a value below to try it.
                </script>
              </ui-markdown>
              <ui-docs-tokens family="ui-action" playground></ui-docs-tokens>
            </ui-section>
            <ui-section id="theming-themes" label="Themes" sticky collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  The theme menu above picks the theme for every page of the site:  Spell, Glass, Fruity or Merlot,
                  each restyling this component through its tokens.
                </script>
              </ui-markdown>
            </ui-section>
          </ui-tab>
        </ui-tabs>

      </ui-container>
    </main>
  </body>
</html>
