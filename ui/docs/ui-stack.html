<!doctype html>

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Stack | Spell UI</title>
    <meta
      name="description"
      content="A stack lays its children out in a column, or a row that wraps, evenly spaced."
    />
    <!-- Before first paint:  the viewer's colour scheme (`ThemePreference.HEAD_SCRIPT`, as oxfmt lays it out).  The theme itself is restored by site.js. -->
    <script>
      try {
        var l = localStorage,
          d = document.documentElement,
          s = l.getItem("spell-site:scheme") || l.getItem("spell-site:theme") || l.getItem("spell-ui-site:scheme")
        if (s === "light" || s === "dark") {
          d.classList.add("ui-" + s)
          d.style.colorScheme = s
        }
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="_assets/site.css" />
    <script type="module" src="_assets/site.js"></script>
    <!-- the comments (bullhorns, threads, Send):  the docs runtime's, alone, beside the site's Spell UI -->
    <script defer src="/_epic/assets/spell-comments.js"></script>
  </head>
  <body class="ui-typography">
    <main id="main" class="site-main" data-toc-header="Stack">
      <ui-segment appearance="vertical" class="site-masthead">
        <ui-container>
          <ui-menu icon class="site-page-links" aria-label="About this page">
            <ui-item
              link="https://github.com/spell-app/spell-app/issues/new?title=ui-stack%3A%20%20"
              target="_blank"
              icon="bug"
              aria-label="Report a bug"
              title="Report a bug"
            ></ui-item>
          </ui-menu>
          <ui-header level="1" class="site-title">
            Stack
            <ui-header>A stack lays its children out in a column, or a row that wraps, evenly spaced.</ui-header>
          </ui-header>
          <ui-theme-menu show="theme" compact class="site-themes"></ui-theme-menu>
        </ui-container>
      </ui-segment>

      <ui-container class="site-body">
        <ui-tabs id="site-tabs" class="site-tabs" history appearance="segmented basic" align="fluid" equal>
          <ui-tab value="examples" label="Examples">
            <!--
              EXAMPLES:  Fomantic's page, section by section, in its order (Types, Content, States, Variations,
              Groups ...).  Rules, the class-grammar mappings, gaps:  epics/spell-ui-pages/PAGES.md.
              - A section:  `<ui-section id="examples-types" label="Types" sticky collapsible dividing>` around
                its examples;  ids spell out the nesting (`<tab>-<section>-<example>`, lowercase kebab of the headers).
              - An example:  its own nested section (`header` = the example's name) around
                `<ui-docs-example description="...">` and the live markup;  the markup IS the code shown.  A richer
                description:  `<p slot="description">` (+ `<ui-message slot="description">`).  Fomantic's header-less
                `.another.example`:  a second `<ui-docs-example>` in the same section.
              - Or write it flat (`<ui-header level="2">`, `<ui-docs-example header>`) and run `yarn site:sections`:
                it nests it and writes the ids (and fixes them after a header changes).
              - A gap:  an HTML comment `GAP I<n>:  ...` BEFORE the example's section (a comment inside the example
                shows in its code).
            -->
            <ui-section id="examples-types" label="Types" sticky collapsible dividing>
              <ui-section id="examples-types-stack" label="Stack" sticky collapsible dividing>
                <ui-docs-example description="A column, its children 1em apart.  No look of its own:  the segments are the children.">
                  <ui-stack>
                    <ui-segment>First</ui-segment>
                    <ui-segment>Second</ui-segment>
                    <ui-segment>Third</ui-segment>
                  </ui-stack>
                </ui-docs-example>
              </ui-section>
              <ui-section id="examples-types-row" label="Row" sticky collapsible dividing>
                <ui-docs-example description="`direction=&quot;horizontal&quot;`:  a row, its children centred on its middle.">
                  <ui-stack direction="horizontal">
                    <ui-icon name="inbox" size="large"></ui-icon>
                    <ui-text>3 new messages</ui-text>
                    <ui-button size="small">Open</ui-button>
                  </ui-stack>
                </ui-docs-example>
              </ui-section>
              <ui-section id="examples-types-wrapping-row" label="Wrapping row" sticky collapsible dividing>
                <ui-docs-example description="`wrap`:  a row that wraps onto the next line, for tags or buttons (Web Awesome's cluster).  Narrow the window to see it wrap.">
                  <ui-stack direction="horizontal" wrap spacing="sm">
                    <ui-label>Design</ui-label>
                    <ui-label>Engineering</ui-label>
                    <ui-label>Research</ui-label>
                    <ui-label>Writing</ui-label>
                    <ui-label>Support</ui-label>
                    <ui-label>Sales</ui-label>
                  </ui-stack>
                </ui-docs-example>
              </ui-section>
            </ui-section>
            <ui-section id="examples-variations" label="Variations" sticky collapsible dividing>
              <ui-section id="examples-variations-spacing" label="Spacing" sticky collapsible dividing>
                <ui-docs-example description="`spacing`:  `none`, `xs`, `sm`, `md` (the default), `lg`, `xl`.">
                  <ui-stack spacing="lg">
                    <ui-stack direction="horizontal" spacing="none">
                      <ui-button>none</ui-button>
                      <ui-button>none</ui-button>
                    </ui-stack>
                    <ui-stack direction="horizontal" spacing="sm">
                      <ui-button>sm</ui-button>
                      <ui-button>sm</ui-button>
                    </ui-stack>
                    <ui-stack direction="horizontal" spacing="xl">
                      <ui-button>xl</ui-button>
                      <ui-button>xl</ui-button>
                    </ui-stack>
                  </ui-stack>
                </ui-docs-example>
              </ui-section>
              <ui-section id="examples-variations-one-left-one-right" label="One left, one right" sticky collapsible dividing>
                <ui-docs-example description="`justify=&quot;between&quot;`:  the first child at the start, the last at the end.  What `floated=&quot;right&quot;` used to do.">
                  <ui-stack direction="horizontal" justify="between">
                    <ui-header level="4">Inbox</ui-header>
                    <ui-button color="primary">New message</ui-button>
                  </ui-stack>
                </ui-docs-example>
              </ui-section>
              <ui-section id="examples-variations-centred" label="Centred" sticky collapsible dividing>
                <ui-docs-example description="`align=&quot;center&quot;`:  a column's children centred across it.">
                  <ui-stack align="center" spacing="sm">
                    <ui-icon name="inbox" size="huge"></ui-icon>
                    <ui-text>No messages yet</ui-text>
                    <ui-button size="small">Write one</ui-button>
                  </ui-stack>
                </ui-docs-example>
              </ui-section>
            </ui-section>
          </ui-tab>

          <ui-tab value="usage" label="Usage">
            <!-- USAGE:  how to use it (attributes in practice, events, framework snippets), keyboard, accessibility. -->
            <ui-section id="usage-using-it" label="Using it" sticky collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  `<ui-stack>` lays out whatever is inside it, and draws nothing itself:  no padding, border or colour.

                  - A column by default;  `direction="horizontal"` makes a row, and `wrap` lets the row wrap.
                  - `spacing` is the gap between children, from `none` to `xl`.
                  - `align` lines children up ACROSS it:  a column's edges or centres, a row's tops, middles or baselines.
                  - `justify` places them ALONG it:  at the `start`, `center` or `end`, or spread out (`between`, `around`).
                  - `fluid` makes it as wide as its container.
                  - Its children's own block margins are dropped:  the stack's spacing is the space.

                  In plain HTML, the `ui-stack` and `ui-cluster` classes do the same on a `<div>`.
                  The tag is for where there's no `<div>` to put them on:  a drawing.
                </script>
              </ui-markdown>
            </ui-section>
            <ui-section id="usage-accessibility" label="Accessibility" sticky collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  A stack has no role:  screen readers read its children in order, as if it weren't there.
                  `justify` and `align` only move things on screen, so keep the order the reading order.
                </script>
              </ui-markdown>
            </ui-section>
          </ui-tab>

          <ui-tab value="api" label="API">
            <!-- API:  generated from the vocabularies (`site/_data/components.json5`);  nothing to write. -->
            <ui-section id="api-attributes" label="Attributes" sticky collapsible dividing>
              <ui-docs-api family="ui-stack" only="attributes"></ui-docs-api>
            </ui-section>

            <ui-section id="api-slots" label="Slots" sticky collapsible dividing>
              <ui-docs-api family="ui-stack" only="slots"></ui-docs-api>
            </ui-section>

            <ui-section id="api-states" label="States" sticky collapsible dividing>
              <ui-docs-api family="ui-stack" only="states"></ui-docs-api>
            </ui-section>
          </ui-tab>
        </ui-tabs>

      </ui-container>
    </main>
  </body>
</html>
