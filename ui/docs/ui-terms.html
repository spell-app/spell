<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Terms | Spell UI</title>
    <meta
      name="description"
      content="Terms list facts as a label and a value each, lined up."
    />
    <!-- Before first paint:  the viewer's colour scheme (`ThemePreference.HEAD_SCRIPT`, as oxfmt lays it out).  The theme itself is restored by site.js. -->
    <script>
      try {
        var l = localStorage,
          d = document.documentElement,
          s = l.getItem("spell-site:scheme") || l.getItem("spell-site:theme") || l.getItem("spell-ui-site:scheme")
        if (s === "light" || s === "dark") {
          d.classList.add("ui-" + s)
          d.style.colorScheme = s
        }
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="_assets/site.css" />
    <script type="module" src="_assets/site.js"></script>
    <!-- the comments (bullhorns, threads, Send):  the docs runtime's, alone, beside the site's Spell UI -->
    <script defer src="/_epic/assets/spell-comments.js"></script>
  </head>
  <body class="ui-typography">
    <main id="main" class="site-main" data-toc-header="Terms">
      <ui-segment appearance="vertical" class="site-masthead">
        <ui-container>
          <ui-menu icon class="site-page-links" aria-label="About this page">
            <ui-item
              link="https://github.com/spell-app/spell-app/issues/new?title=ui-terms%3A%20%20"
              target="_blank"
              icon="bug"
              aria-label="Report a bug"
              title="Report a bug"
            ></ui-item>
          </ui-menu>
          <ui-header level="1" class="site-title">
            Terms
            <ui-header>Terms list facts as a label and a value each, lined up.</ui-header>
          </ui-header>
          <ui-theme-menu show="theme" compact class="site-themes"></ui-theme-menu>
        </ui-container>
      </ui-segment>

      <ui-container class="site-body">
        <ui-tabs id="site-tabs" class="site-tabs" history appearance="segmented basic" align="fluid" equal>
          <ui-tab value="examples" label="Examples">
            <!--
              EXAMPLES:  Fomantic's page, section by section, in its order (Types, Content, States, Variations,
              Groups ...).  Rules, the class-grammar mappings, gaps:  epics/spell-ui-pages/PAGES.md.
              - A section:  `<ui-section id="examples-types" label="Types" sticky collapsible dividing>` around
                its examples;  ids spell out the nesting (`<tab>-<section>-<example>`, lowercase kebab of the headers).
              - An example:  its own nested section (`header` = the example's name) around
                `<ui-docs-example description="...">` and the live markup;  the markup IS the code shown.  A richer
                description:  `<p slot="description">` (+ `<ui-message slot="description">`).  Fomantic's header-less
                `.another.example`:  a second `<ui-docs-example>` in the same section.
              - Or write it flat (`<ui-header level="2">`, `<ui-docs-example header>`) and run `yarn site:sections`:
                it nests it and writes the ids (and fixes them after a header changes).
              - A gap:  an HTML comment `GAP I<n>:  ...` BEFORE the example's section (a comment inside the example
                shows in its code).
            -->
            <ui-section id="examples-types" label="Types" sticky collapsible dividing>
              <ui-section id="examples-types-terms" label="Terms" sticky collapsible dividing>
                <ui-docs-example description="Facts lined up:  the labels in one column, the values in the next.  A value can be any element, written inside the term.">
                  <ui-terms>
                    <ui-term label="Suit" value="hearts"></ui-term>
                    <ui-term label="Rank" value="queen"></ui-term>
                    <ui-term label="Played by"><ui-label color="blue">Jamie</ui-label></ui-term>
                  </ui-terms>
                </ui-docs-example>
              </ui-section>
              <ui-section id="examples-types-horizontal" label="Horizontal" sticky collapsible dividing>
                <ui-docs-example description="`direction=&quot;horizontal&quot;`:  the terms side by side, wrapping, as a game's scores.">
                  <ui-terms direction="horizontal">
                    <ui-term label="Score" value="42"></ui-term>
                    <ui-term label="Moves" value="17"></ui-term>
                    <ui-term label="Time" value="3:05"></ui-term>
                  </ui-terms>
                </ui-docs-example>
              </ui-section>
              <ui-section id="examples-types-a-rich-label" label="A rich label" sticky collapsible dividing>
                <ui-docs-example description="`slot=&quot;label&quot;`:  a label that's more than text.">
                  <ui-terms>
                    <ui-term value="Paris"><span slot="label"><ui-icon name="location dot"></ui-icon> City</span></ui-term>
                    <ui-term value="Sunny, 24°"><span slot="label"><ui-icon name="sun"></ui-icon> Weather</span></ui-term>
                  </ui-terms>
                </ui-docs-example>
              </ui-section>
            </ui-section>
          </ui-tab>

          <ui-tab value="usage" label="Usage">
            <!-- USAGE:  how to use it (attributes in practice, events, framework snippets), keyboard, accessibility. -->
            <ui-section id="usage-using-it" label="Using it" sticky collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  `<ui-terms>` lists facts, a label and a value each:  HTML's `<dl>`, `<dt>` and `<dd>`.

                  - `<ui-term label="Suit" value="hearts">`:  the label and value as attributes.
                  - Or written inside:  the value as the term's content, the label in `slot="label"`, for anything more than text.
                  - The labels line up in one column and the values in the next.
                  - `direction="horizontal"` puts the terms side by side, wrapping.
                  - `spacing` (`sm`, `md`, `lg`) is the space between terms.
                  - A `<ui-term>` on its own draws its label and value on one line.
                </script>
              </ui-markdown>
            </ui-section>
            <ui-section id="usage-accessibility" label="Accessibility" sticky collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  Screen readers hear each label as a term and its value as the term's definition (`role="term"`, `role="definition"`).
                </script>
              </ui-markdown>
            </ui-section>
          </ui-tab>

          <ui-tab value="api" label="API">
            <!-- API:  generated from the vocabularies (`site/_data/components.json5`);  nothing to write. -->
            <ui-section id="api-tags" label="Tags" sticky collapsible dividing>
              <ui-docs-api family="ui-terms" only="tags"></ui-docs-api>
            </ui-section>

            <ui-section id="api-attributes" label="Attributes" sticky collapsible dividing>
              <ui-docs-api family="ui-terms" only="attributes"></ui-docs-api>
            </ui-section>

            <ui-section id="api-slots" label="Slots" sticky collapsible dividing>
              <ui-docs-api family="ui-terms" only="slots"></ui-docs-api>
            </ui-section>

            <ui-section id="api-parts" label="Parts" sticky collapsible dividing>
              <ui-docs-api family="ui-terms" only="parts"></ui-docs-api>
            </ui-section>

            <ui-section id="api-states" label="States" sticky collapsible dividing>
              <ui-docs-api family="ui-terms" only="states"></ui-docs-api>
            </ui-section>
          </ui-tab>
        </ui-tabs>

      </ui-container>
    </main>
  </body>
</html>
