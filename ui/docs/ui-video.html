<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Video | Spell UI</title>
    <meta
      name="description"
      content="A video plays a video file in the browser&#39;s own player."
    />
    <!-- Before first paint:  the viewer's colour scheme (`ThemePreference.HEAD_SCRIPT`, as oxfmt lays it out).  The theme itself is restored by site.js. -->
    <script>
      try {
        var l = localStorage,
          d = document.documentElement,
          s = l.getItem("spell-site:scheme") || l.getItem("spell-site:theme") || l.getItem("spell-ui-site:scheme")
        if (s === "light" || s === "dark") {
          d.classList.add("ui-" + s)
          d.style.colorScheme = s
        }
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="_assets/site.css" />
    <script type="module" src="_assets/site.js"></script>
    <!-- the comments (bullhorns, threads, Send):  the docs runtime's, alone, beside the site's Spell UI -->
    <script defer src="/_epic/assets/spell-comments.js"></script>
  </head>
  <body class="ui-typography">
    <main id="main" class="site-main" data-toc-header="Video">
      <ui-segment appearance="vertical" class="site-masthead">
        <ui-container>
          <ui-menu icon class="site-page-links" aria-label="About this page">
            <ui-item
              link="https://github.com/spell-app/spell-app/issues/new?title=ui-video%3A%20%20"
              icon="bug"
              aria-label="Report a bug"
              title="Report a bug"
            ></ui-item>
          </ui-menu>
          <ui-header level="1" class="site-title">
            Video
            <ui-header>A video plays a video file in the browser&#39;s own player.</ui-header>
          </ui-header>
          <ui-theme-menu show="theme" compact class="site-themes"></ui-theme-menu>
        </ui-container>
      </ui-segment>

      <ui-container class="site-body">
        <ui-tabs id="site-tabs" class="site-tabs" history appearance="segmented basic" align="fluid" equal>
          <ui-tab value="examples" label="Examples">
            <!--
              EXAMPLES:  Fomantic's page, section by section, in its order (Types, Content, States, Variations,
              Groups ...).  Rules, the class-grammar mappings, gaps:  epics/spell-ui-pages/PAGES.md.
              - A section:  `<ui-section id="examples-types" label="Types" sticky collapsible dividing>` around
                its examples;  ids spell out the nesting (`<tab>-<section>-<example>`, lowercase kebab of the headers).
              - An example:  its own nested section (`header` = the example's name) around
                `<ui-docs-example description="...">` and the live markup;  the markup IS the code shown.  A richer
                description:  `<p slot="description">` (+ `<ui-message slot="description">`).  Fomantic's header-less
                `.another.example`:  a second `<ui-docs-example>` in the same section.
              - Or write it flat (`<ui-header level="2">`, `<ui-docs-example header>`) and run `yarn site:sections`:
                it nests it and writes the ids (and fixes them after a header changes).
              - A gap:  an HTML comment `GAP I<n>:  ...` BEFORE the example's section (a comment inside the example
                shows in its code).
            -->
            <ui-section id="examples-types" label="Types" sticky collapsible dividing>
              <ui-section id="examples-types-video" label="Video" sticky collapsible dividing>
                <ui-docs-example description="A video file in the browser's own player, with captions (`captions`, a WebVTT file) and its shape (`ratio`).">
                  <ui-video
                    src="examples/media/sample.webm"
                    captions="examples/media/sample.vtt"
                    ratio="16/9"
                    label="A ball rolls across the screen"
                    style="max-width: 32em"
                  ></ui-video>
                </ui-docs-example>
              </ui-section>
              <ui-section id="examples-types-no-controls" label="No controls" sticky collapsible dividing>
                <ui-docs-example description="`controls=&quot;false&quot;` hides the browser's controls;  `autoplay muted loop` plays it by itself, as a moving picture.">
                  <ui-video
                    src="examples/media/sample.webm"
                    controls="false"
                    autoplay
                    muted
                    loop
                    label="A ball rolls across the screen, over and over"
                    style="max-width: 20em"
                  ></ui-video>
                </ui-docs-example>
              </ui-section>
            </ui-section>
          </ui-tab>

          <ui-tab value="usage" label="Usage">
            <!-- USAGE:  how to use it (attributes in practice, events, framework snippets), keyboard, accessibility. -->
            <ui-section id="usage-using-it" label="Using it" sticky collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  `<ui-video>` plays a video file in the browser's own player.  For another site's video (YouTube, Vimeo), use
                  [`<ui-embed>`](ui-embed.html).

                  - `src` is the file, relative to the page;  `poster` a picture shown before it plays.
                  - The browser's controls show unless `controls="false"`.
                  - `captions` is a captions file (WebVTT, `.vtt`), in the page's language:  the player offers them.
                  - `ratio` is its shape, width to height (`16/9`);  by default the video's own.
                  - `autoplay` starts it at once, but a browser only allows that when it's `muted`, or after the reader has clicked
                    on the page.  There's no way round that, on purpose.
                  - `muted` and `loop` are the player's own.

                  From script:  `video.play()`, `video.pause()`, `video.currentTime`, `video.paused`, and the events `ui-play`,
                  `ui-pause` and `ui-ended`.
                </script>
              </ui-markdown>
            </ui-section>
            <ui-section id="usage-accessibility" label="Accessibility" sticky collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  - Name it with `label`:  what the video shows, for people who can't see it.
                  - Give it `captions` when it has speech:  people who can't hear it read them.
                  - The browser's controls are keyboard-ready:  Tab to them, Space to play and pause.
                </script>
              </ui-markdown>
            </ui-section>
          </ui-tab>

          <ui-tab value="api" label="API">
            <!-- API:  generated from the vocabularies (`site/_data/components.json5`);  nothing to write. -->
            <ui-section id="api-tags" label="Tags" sticky collapsible dividing>
              <ui-docs-api family="ui-video" only="tags"></ui-docs-api>
            </ui-section>

            <ui-section id="api-attributes" label="Attributes" sticky collapsible dividing>
              <ui-docs-api family="ui-video" only="attributes"></ui-docs-api>
            </ui-section>

            <ui-section id="api-events" label="Events" sticky collapsible dividing>
              <ui-docs-api family="ui-video" only="events"></ui-docs-api>
            </ui-section>

            <ui-section id="api-parts" label="Parts" sticky collapsible dividing>
              <ui-docs-api family="ui-video" only="parts"></ui-docs-api>
            </ui-section>

            <ui-section id="api-states" label="States" sticky collapsible dividing>
              <ui-docs-api family="ui-video" only="states"></ui-docs-api>
            </ui-section>

            <ui-section id="api-texts" label="Texts" sticky collapsible dividing>
              <ui-docs-api family="ui-video" only="texts"></ui-docs-api>
            </ui-section>
          </ui-tab>
        </ui-tabs>

      </ui-container>
    </main>
  </body>
</html>
