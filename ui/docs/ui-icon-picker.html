<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Icon Picker | Spell UI</title>
    <meta
      name="description"
      content="An icon picker lets people choose an icon by searching for it and clicking its glyph."
    />
    <!-- Before first paint:  the viewer's colour scheme (`ThemePreference.HEAD_SCRIPT`, as oxfmt lays it out).  The theme itself is restored by site.js. -->
    <script>
      try {
        var l = localStorage,
          d = document.documentElement,
          s = l.getItem("spell-site:scheme") || l.getItem("spell-site:theme") || l.getItem("spell-ui-site:scheme")
        if (s === "light" || s === "dark") {
          d.classList.add("ui-" + s)
          d.style.colorScheme = s
        }
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="_assets/site.css" />
    <script type="module" src="_assets/site.js"></script>
    <!-- the comments (bullhorns, threads, Send):  the docs runtime's, alone, beside the site's Spell UI -->
    <script defer src="/_epic/assets/spell-comments.js"></script>
  </head>
  <body class="ui-typography">
    <main id="main" class="site-main" data-toc-header="Icon Picker">
      <ui-segment vertical class="site-masthead">
        <ui-container>
          <ui-menu icon floated="right" class="site-page-links" aria-label="About this page">
            <ui-item
              href="https://github.com/spell-app/spell-ui/issues/new?title=ui-icon-picker%3A%20%20"
              icon="bug"
              aria-label="Report a bug"
              title="Report a bug"
            ></ui-item>
          </ui-menu>
          <ui-header level="1" class="site-title">
            Icon Picker
            <ui-header>An icon picker lets people choose an icon by searching for it and clicking its glyph.</ui-header>
          </ui-header>
          <ui-docs-themes for="ui-icon-picker" show="theme" compact class="site-themes"></ui-docs-themes>
        </ui-container>
      </ui-segment>

      <ui-container class="site-body">
        <ui-tabs id="site-tabs" class="site-tabs" history basic appearance="segmented" alignment="fluid" equal>
          <ui-tab value="examples" label="Examples">
            <!--
              EXAMPLES:  ours, no Fomantic page.
              - Every picker is named (`aria-label`), as a real form's would be.
            -->
            <ui-section id="examples-types" label="Types" sticky collapsible dividing>
              <ui-section id="examples-types-icon-picker" label="Icon picker" sticky collapsible dividing>
                <ui-docs-example
                  description="Click the field:  a search box and a grid of every icon the page knows.  Type to filter, by name or by what it shows (`mail` finds `envelope`), then click a glyph, or use the arrows and Enter."
                >
                  <ui-icon-picker value="star" aria-label="Icon"></ui-icon-picker>
                </ui-docs-example>
              </ui-section>
              <ui-section id="examples-types-none" label="None" sticky collapsible dividing>
                <ui-docs-example
                  description="With no icon chosen, the field says `none`, light and in italics;  `placeholder` says something else.  The grid's first cell, a circle with a slash, clears the choice."
                >
                  <ui-icon-picker aria-label="Icon"></ui-icon-picker>
                  <ui-icon-picker placeholder="Pick an icon" aria-label="Icon"></ui-icon-picker>
                </ui-docs-example>
              </ui-section>
              <ui-section id="examples-types-in-a-form" label="In a form" sticky collapsible dividing>
                <ui-docs-example
                  description="A form control:  it submits the icon's name under its `name`, and `required` takes the none cell out of the grid."
                >
                  <ui-form>
                    <ui-field label="Button icon">
                      <ui-icon-picker name="icon" value="paper plane" required></ui-icon-picker>
                    </ui-field>
                  </ui-form>
                </ui-docs-example>
              </ui-section>
            </ui-section>

            <ui-section id="examples-states" label="States" sticky collapsible dividing>
              <ui-section id="examples-states-read-only" label="Read-only" sticky collapsible dividing>
                <ui-docs-example description="Shows its icon, and can be focused, but never opens.">
                  <ui-icon-picker readonly value="bell" aria-label="Icon"></ui-icon-picker>
                </ui-docs-example>
              </ui-section>
              <ui-section id="examples-states-disabled" label="Disabled" sticky collapsible dividing>
                <ui-docs-example description="Can't be used, and is left out of its form.">
                  <ui-icon-picker disabled value="bell" aria-label="Icon"></ui-icon-picker>
                </ui-docs-example>
              </ui-section>
            </ui-section>

            <ui-section id="examples-variations" label="Variations" sticky collapsible dividing>
              <ui-section id="examples-variations-size" label="Size" sticky collapsible dividing>
                <ui-docs-example description="`size` scales the field and its panel, `mini` ... `massive`.">
                  <ui-icon-picker size="small" value="heart" aria-label="Small"></ui-icon-picker>
                  <ui-icon-picker value="heart" aria-label="Medium"></ui-icon-picker>
                  <ui-icon-picker size="large" value="heart" aria-label="Large"></ui-icon-picker>
                </ui-docs-example>
              </ui-section>
              <ui-section id="examples-variations-fluid" label="Fluid" sticky collapsible dividing>
                <ui-docs-example description="`fluid` takes its container's width;  the panel is at least as wide.">
                  <ui-icon-picker fluid value="house" aria-label="Icon"></ui-icon-picker>
                </ui-docs-example>
              </ui-section>
              <ui-section id="examples-variations-dark" label="Dark" sticky collapsible dividing>
                <ui-docs-example description="In a dark part of a page (`ui-dark`), the field and its panel take the dark colours.">
                  <ui-segment inverted class="ui-dark">
                    <ui-icon-picker value="moon" aria-label="Icon"></ui-icon-picker>
                  </ui-segment>
                </ui-docs-example>
              </ui-section>
            </ui-section>
          </ui-tab>

          <ui-tab value="usage" label="Usage">
            <!-- USAGE:  how to use it, where its icons come from, keyboard, accessibility. -->
            <ui-section id="usage-using-it" label="Using it" sticky collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  `value` is an icon's NAME, as `<ui-icon name>` takes it (`star`, `address book`);  `""` is none.

                  - The attribute is the starting (and reset) value;  the `value` property is the live one.
                  - Picking sends the cancelable `ui-changing` (`{ value }`) first:  a handler that sets `el.value` again wins;  then
                    `ui-changed` once it's in.
                  - In a `<ui-form value>` it binds like any control;  a property editor draws one for every
                    `icon` attribute (a button's, a rating's).
                </script>
              </ui-markdown>
              <ui-code language="js">
                <script type="text/plain">
                  document.querySelector("ui-icon-picker").addEventListener("ui-changed", (event) => {
                    document.querySelector("ui-button").icon = event.detail.value
                  })
                </script>
              </ui-code>
            </ui-section>
            <ui-section id="usage-its-icons" label="Its icons" sticky collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  It offers every icon its page knows:  its nearest `<ui-root icons>`'s packs, else the page's
                  (Font Awesome's free icons by default), one cell per glyph, A-Z.

                  - With `<ui-root icons="fomantic">`, Fomantic's names go to the glyphs they draw there.
                  - A search matches names first (exact, then starting with what you typed, then holding it),
                    then Font Awesome's search terms, loaded on the first search.
                  - The grid draws only the rows in view:  each glyph is a file of its own, fetched as it scrolls in.
                </script>
              </ui-markdown>
            </ui-section>
            <ui-section id="usage-keyboard" label="Keyboard" sticky collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  - On the field:  Enter, Space, Down or Up opens it;  a letter opens it searching for that letter.
                  - In the panel, the focus stays in the search box:
                    - the arrows move through the grid, Enter picks
                    - Escape closes it, back on the field;  Tab closes it and moves on
                </script>
              </ui-markdown>
            </ui-section>
            <ui-section id="usage-accessibility" label="Accessibility" sticky collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  - The field is a button that opens a listbox;  named by the picker's `<label for>` or
                    `aria-label`, then what it shows ("Icon, star").
                  - The search box is a combobox over the grid, a listbox of options, each named for its icon,
                    the chosen one `aria-selected`.
                  - Each glyph's name is its tooltip too.
                </script>
              </ui-markdown>
            </ui-section>
          </ui-tab>

          <ui-tab value="api" label="API">
            <!-- API:  generated from the vocabularies (`site/_data/components.json5`);  nothing to write. -->
            <ui-section id="api-attributes" label="Attributes" sticky collapsible dividing>
              <ui-docs-api family="ui-icon-picker" only="attributes"></ui-docs-api>
            </ui-section>

            <ui-section id="api-events" label="Events" sticky collapsible dividing>
              <ui-docs-api family="ui-icon-picker" only="events"></ui-docs-api>
            </ui-section>

            <ui-section id="api-parts" label="Parts" sticky collapsible dividing>
              <ui-docs-api family="ui-icon-picker" only="parts"></ui-docs-api>
            </ui-section>

            <ui-section id="api-states" label="States" sticky collapsible dividing>
              <ui-docs-api family="ui-icon-picker" only="states"></ui-docs-api>
            </ui-section>

            <ui-section id="api-texts" label="Texts" sticky collapsible dividing>
              <ui-docs-api family="ui-icon-picker" only="texts"></ui-docs-api>
            </ui-section>
          </ui-tab>

          <ui-tab value="theming" label="Theming">
            <!-- THEMING:  the family's tokens, live, plus how to set them and which themes touch it. -->
            <ui-section id="theming-tokens" label="Tokens" sticky collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  Set a public `--ui-*` token on the element, any ancestor or `:root`; it inherits into the shadow
                  root. The field's box falls back to `<ui-input>`'s tokens, so a form that shapes its inputs shapes
                  the picker too. Edit a value below to try it.
                </script>
              </ui-markdown>
              <ui-docs-tokens family="ui-icon-picker" playground></ui-docs-tokens>
            </ui-section>
            <ui-section id="theming-themes" label="Themes" sticky collapsible dividing>
              <ui-markdown>
                <script type="text/markdown">
                  The theme picker above lists the Fomantic themes that restyle this component; the one in the
                  header applies a theme to the whole site.
                </script>
              </ui-markdown>
            </ui-section>
          </ui-tab>
        </ui-tabs>
      </ui-container>
    </main>
  </body>
</html>
