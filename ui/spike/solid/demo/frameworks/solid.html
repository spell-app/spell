<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Solid spike: Solid 1.9 host (duplicate runtime)</title>
  </head>
  <body>
    <h1>Solid 1.9 host</h1>
    <p>The element bundle carries Solid 2.0 RC; this page's app runs Solid 1.9 from esm.sh: two runtimes.</p>
    <div id="app"></div>
    <script type="module" src="./smoke.ts"></script>
    <script type="module">
      // `solid-js/h` + `solid-js/web` 1.9:  `prop:options`, `on:ui-change`, reactive props as functions.
      import { createSignal, createContext, useContext } from "https://esm.sh/solid-js@1.9.9"
      import { render } from "https://esm.sh/solid-js@1.9.9/web"
      import h from "https://esm.sh/solid-js@1.9.9/h"
      const OPTIONS = [
        { value: "apple", text: "Apple" },
        { value: "banana", text: "Banana" },
        { value: "cherry", text: "Cherry" }
      ]
      const Theme = createContext("light")
      const [value, setValue] = createSignal("banana")
      const [open, setOpen] = createSignal(false)
      const [mounted, setMounted] = createSignal(true)
      function App() {
        return h(Theme.Provider, { value: "dark" }, () =>
          h(
            "div",
            null,
            () =>
              mounted()
                ? h("ui-dropdown", {
                    selection: true,
                    placeholder: "Fruit",
                    "prop:options": OPTIONS,
                    "prop:value": value,
                    "prop:open": open,
                    "on:ui-change": (event) => setValue(event.detail.value),
                    "on:ui-open": () => setOpen(true),
                    "on:ui-close": () => setOpen(false)
                  })
                : null,
            h("output", { id: "value" }, value),
            h("button", { id: "set", onClick: () => setValue("cherry") }, "set cherry"),
            h("button", { id: "open", onClick: () => setOpen(true) }, "open"),
            h("button", { id: "unmount", onClick: () => setMounted(false) }, "unmount"),
            h("span", { id: "theme" }, () => useContext(Theme))
          )
        )
      }
      render(App, document.getElementById("app"))
      window.smokeHost = "solid-1.9"
    </script>
  </body>
</html>
