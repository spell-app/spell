<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Solid spike: vanilla host</title>
  </head>
  <body>
    <h1>Vanilla host</h1>
    <ui-dropdown selection placeholder="Fruit"></ui-dropdown>
    <output id="value"></output>
    <button id="set">set cherry</button>
    <button id="open">open</button>
    <script type="module" src="./smoke.ts"></script>
    <script type="module">
      // Plain DOM:  properties and listeners, no framework.  Set BEFORE the bundle defines the element too,
      // which exercises the upgrade backstop.
      const dropdown = document.querySelector("ui-dropdown")
      const output = document.getElementById("value")
      dropdown.options = [
        { value: "apple", text: "Apple" },
        { value: "banana", text: "Banana" },
        { value: "cherry", text: "Cherry" }
      ]
      dropdown.value = "banana"
      output.value = "banana"
      dropdown.addEventListener("ui-change", (event) => (output.value = event.detail.value))
      document.getElementById("set").onclick = () => (dropdown.value = output.value = "cherry")
      document.getElementById("open").onclick = () => (dropdown.open = true)
      window.smokeHost = "vanilla"
    </script>
  </body>
</html>
