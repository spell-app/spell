<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Spell UI in Spanish -- smoke page</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <h1>Spell UI en español, from <code>dist/</code></h1>
    <ui-root>
      <p>
        <es-boton primario tamano="grande">Guardar</es-boton>
        <es-boton color="rojo" basico>Borrar</es-boton>
        <es-boton color="azul" tamano="pequeño" desactivado>Desactivado</es-boton>
      </p>
      <p>
        <es-desplegable seleccion marcador="Elige un color" id="colores">
          <es-elemento value="r">Rojo</es-elemento>
          <es-elemento value="v">Verde</es-elemento>
          <es-elemento value="a">Azul</es-elemento>
        </es-desplegable>
      </p>
      <es-tarjeta color="verde">
        <es-contenido><es-encabezado>Informe</es-encabezado></es-contenido>
      </es-tarjeta>
    </ui-root>
    <p>Último <code>es-cambiado</code>: <output id="value">(ninguno)</output></p>
    <pre id="result">checking...</pre>
    <script type="module">
      import { flush } from "solid-js"
      import { UI } from "spell-ui/core"
      import "spell-ui/ui-root"

      // `<html lang="es">`:  the root loads Spanish, then each `es-*` tag's family, on demand
      const root = document.querySelector("ui-root")
      await root.ready
      const failed = await root.component.settled
      const dropdown = document.querySelector("#colores")
      const output = document.querySelector("#value")
      dropdown.addEventListener("es-cambiado", (event) => (output.textContent = JSON.stringify(event.detail.value)))
      const buttons = [...document.querySelectorAll("es-boton")]
      const card = document.querySelector("es-tarjeta")
      await Promise.all([...buttons, dropdown, card].map((element) => element.ready))
      flush()
      const classes = buttons.map((button) => button.shadowRoot.querySelector("button").className)
      // a Spanish tag's properties are Spanish too:  `abierto`, not `open`
      dropdown.abierto = true
      flush()
      dropdown.shadowRoot.querySelector("[role=option]:last-of-type").click()
      flush()
      buttons[1].color = "verde"
      flush()
      const checks = {
        rootLoaded: failed.length === 0,
        largePrimary: classes[0] === "ui large primary button",
        redBasic: classes[1] === "ui red basic button",
        smallBlueDisabled: classes[2] === "ui small blue disabled button",
        localizedEvent: output.textContent === '"a"',
        localizedPropertyValue:
          buttons[1].color === "green" &&
          buttons[1].getAttribute("color") === "verde" &&
          buttons[1].shadowRoot.querySelector("button").className === "ui green basic button",
        lazyCard: customElements.get("es-tarjeta") !== undefined && card.color === "green",
        spanishTexts: UI.i18n.t("close") === "Cerrar"
      }
      const ok = Object.values(checks).every(Boolean)
      window.smokeResult = { ok, label: "es (<ui-root> in Spanish)", checks }
      document.querySelector("#result").textContent = `${ok ? "PASS" : "FAIL"} ${JSON.stringify({ classes, checks })}`
    </script>
  </body>
</html>
