<!-- <ui-steps>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-steps" data-omit="">
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="size"></ui-property>
    <ui-property name="color"></ui-property>
    <ui-property name="inverted"></ui-property>
    <ui-property name="ordered"></ui-property>
    <ui-property name="appearance"></ui-property>
    <ui-property name="widths"></ui-property>
  </ui-property-group>
  <ui-property-group label="Layout" data-group="layout">
    <ui-property name="direction"></ui-property>
    <ui-property name="fluid"></ui-property>
    <ui-property name="equal"></ui-property>
    <ui-property name="attach-to"></ui-property>
    <ui-property name="unstackable"></ui-property>
    <ui-property name="stackable"></ui-property>
    <ui-property name="stack-with"></ui-property>
  </ui-property-group>
</ui-property-editor>
