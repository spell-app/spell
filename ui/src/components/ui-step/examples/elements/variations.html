<!-- `src/components/ui-step/examples/variations.html` as element markup. -->
<div class="ui-stack">
  <section>
    <h4>Stackable (tablet)</h4>
    <ui-steps stackable="tablet">
      <ui-step icon="truck" heading="Shipping" description="Choose your shipping options"></ui-step>
      <ui-step selected icon="credit-card" heading="Billing" description="Enter billing information"></ui-step>
      <ui-step disabled icon="circle-info" heading="Confirm Order"></ui-step>
    </ui-steps>
  </section>

  <section>
    <h4>Unstackable</h4>
    <ui-steps unstackable>
      <ui-step icon="truck" heading="Shipping" description="Choose your shipping options"></ui-step>
      <ui-step selected icon="credit-card" heading="Billing" description="Enter billing information"></ui-step>
      <ui-step disabled icon="circle-info" heading="Confirm Order"></ui-step>
    </ui-steps>
  </section>

  <section>
    <h4>Fluid</h4>
    <ui-steps fluid direction="vertical">
      <ui-step completed icon="truck" heading="Shipping" description="Choose your shipping options"></ui-step>
      <ui-step selected icon="credit-card" heading="Billing" description="Enter billing information"></ui-step>
    </ui-steps>
  </section>

  <section>
    <h4>Right vertical</h4>
    <ui-steps direction="vertical-right">
      <ui-step icon="truck" heading="Shipping" description="Choose your shipping options"></ui-step>
      <ui-step selected icon="credit-card" heading="Billing" description="Enter billing information"></ui-step>
    </ui-steps>
  </section>

  <section>
    <h4>Attached and evenly divided</h4>
    <ui-steps widths="3" attach="top">
      <ui-step icon="truck" heading="Shipping" description="Choose your shipping options"></ui-step>
      <ui-step selected icon="credit-card" heading="Billing" description="Enter billing information"></ui-step>
      <ui-step disabled icon="circle-info" heading="Confirm Order"></ui-step>
    </ui-steps>
    <ui-segment attach="both"><p>Te eum doming eirmod, nominati pertinacia argumentum ad his.</p></ui-segment>
    <ui-steps widths="3" attach="bottom">
      <ui-step icon="truck" heading="Shipping" description="Choose your shipping options"></ui-step>
      <ui-step selected icon="credit-card" heading="Billing" description="Enter billing information"></ui-step>
      <ui-step disabled icon="circle-info" heading="Confirm Order"></ui-step>
    </ui-steps>
  </section>

  <section>
    <h4>Size</h4>
    <ui-steps size="mini">
      <ui-step icon="truck" heading="Shipping" description="Choose your shipping options"></ui-step>
      <ui-step selected icon="credit-card" heading="Billing" description="Enter billing information"></ui-step>
      <ui-step disabled icon="circle-info" heading="Confirm Order"></ui-step>
    </ui-steps>
    <ui-steps size="large">
      <ui-step icon="truck" heading="Shipping" description="Choose your shipping options"></ui-step>
      <ui-step selected icon="credit-card" heading="Billing" description="Enter billing information"></ui-step>
      <ui-step disabled icon="circle-info" heading="Confirm Order"></ui-step>
    </ui-steps>
  </section>

  <section>
    <h4>Inverted</h4>
    <ui-steps inverted>
      <ui-step icon="truck" heading="Shipping" description="Choose your shipping options"></ui-step>
      <ui-step selected icon="credit-card" heading="Billing" description="Enter billing information"></ui-step>
      <ui-step disabled icon="circle-info" heading="Confirm Order"></ui-step>
    </ui-steps>
  </section>

  <section>
    <h4>Circular</h4>
    <ui-steps appearance="circular">
      <ui-step completed heading="Shipping" description="Choose your shipping options"></ui-step>
      <ui-step selected heading="Billing" description="Enter billing information"></ui-step>
      <ui-step heading="Confirm Order"></ui-step>
    </ui-steps>
    <ui-steps color="red" appearance="circular" ordered>
      <ui-step completed heading="Shipping"></ui-step>
      <ui-step selected heading="Billing"></ui-step>
      <ui-step heading="Confirm Order"></ui-step>
    </ui-steps>
    <ui-steps appearance="circular" direction="vertical">
      <ui-step completed heading="Shipping" description="Choose your shipping options"></ui-step>
      <ui-step selected heading="Billing" description="Enter billing information"></ui-step>
      <ui-step heading="Confirm Order"></ui-step>
    </ui-steps>
  </section>
</div>
