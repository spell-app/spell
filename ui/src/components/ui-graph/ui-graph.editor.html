<!-- <ui-graph>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-graph" data-omit="">
  <ui-property-group label="Content" data-group="content">
    <ui-property name="graph"></ui-property>
    <ui-property name="boundary"></ui-property>
  </ui-property-group>
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="arrange"></ui-property>
  </ui-property-group>
  <ui-property-group label="States" data-group="states">
    <ui-property name="selected"></ui-property>
  </ui-property-group>
  <ui-property-group label="Behaviour" data-group="behaviour">
    <ui-property name="child-view"></ui-property>
    <ui-property name="path"></ui-property>
  </ui-property-group>
</ui-property-editor>
