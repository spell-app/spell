<!-- <ui-embed>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-embed" data-omit="">
  <ui-property-group label="Name" data-group="name">
    <ui-property name="label"></ui-property>
  </ui-property-group>
  <ui-property-group label="Content" data-group="content">
    <ui-property name="source"></ui-property>
    <ui-property name="alt"></ui-property>
    <ui-property name="icon"></ui-property>
  </ui-property-group>
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="video-id"></ui-property>
    <ui-property name="aspect-ratio"></ui-property>
  </ui-property-group>
  <ui-property-group label="States" data-group="states">
    <ui-property name="active"></ui-property>
  </ui-property-group>
  <ui-property-group label="Form" data-group="form">
    <ui-property name="placeholder"></ui-property>
  </ui-property-group>
  <ui-property-group label="Link" data-group="link">
    <ui-property name="url"></ui-property>
  </ui-property-group>
  <ui-property-group label="Behaviour" data-group="behaviour">
    <ui-property name="autoplay"></ui-property>
    <ui-property name="parameters"></ui-property>
  </ui-property-group>
</ui-property-editor>
