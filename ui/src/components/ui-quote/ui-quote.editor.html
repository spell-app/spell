<!-- <ui-quote>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-quote" data-omit="">
  <ui-property-group label="Content" data-group="content">
    <ui-property name="cite"></ui-property>
  </ui-property-group>
  <ui-property-group label="Layout" data-group="layout">
    <ui-property name="inline"></ui-property>
  </ui-property-group>
</ui-property-editor>
