<!-- `<ui-quote>`:  a block quote, and one inside a sentence. -->
<div class="ui-stack">
  <section>
    <h4>Quote</h4>
    <ui-quote cite="https://en.wikipedia.org/wiki/Alan_Kay">
      The best way to predict the future is to invent it.
    </ui-quote>
  </section>
  <section>
    <h4>Inline</h4>
    <p>She looked up and said <ui-quote inline>not today</ui-quote>, then went back to her book.</p>
  </section>
</div>
