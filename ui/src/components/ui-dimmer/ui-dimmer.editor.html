<!-- <ui-dimmer>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-dimmer" data-omit="">
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="shade"></ui-property>
    <ui-property name="page"></ui-property>
    <ui-property name="blurring"></ui-property>
    <ui-property name="appearance"></ui-property>
    <ui-property name="show-on"></ui-property>
    <ui-property name="inverted"></ui-property>
  </ui-property-group>
  <ui-property-group label="Layout" data-group="layout">
    <ui-property name="vertical-align"></ui-property>
  </ui-property-group>
  <ui-property-group label="States" data-group="states">
    <ui-property name="disabled"></ui-property>
  </ui-property-group>
  <ui-property-group label="Behaviour" data-group="behaviour">
    <ui-property name="closedby"></ui-property>
  </ui-property-group>
</ui-property-editor>
