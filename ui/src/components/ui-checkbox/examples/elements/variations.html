<!-- `src/components/ui-checkbox/examples/variations.html` as element markup. -->
<div class="ui-stack">
  <section>
    <h4>Fitted</h4>
    <div class="ui-cluster">
      <ui-checkbox padding="none" aria-label="Fitted"></ui-checkbox>
      <ui-checkbox padding="none" appearance="slider" aria-label="Fitted slider"></ui-checkbox>
      <ui-checkbox padding="none" appearance="toggle" aria-label="Fitted toggle"></ui-checkbox>
    </div>
  </section>

  <section>
    <h4>Right aligned</h4>
    <div class="ui-stack">
      <ui-checkbox align="right">Checkbox</ui-checkbox>
      <ui-checkbox align="right" appearance="toggle" selected>Toggle</ui-checkbox>
    </div>
  </section>

  <section>
    <h4>Invisible</h4>
    <div class="ui-cluster">
      <ui-checkbox invisible>Unchosen</ui-checkbox>
      <ui-checkbox invisible selected>Chosen</ui-checkbox>
    </div>
  </section>

  <section>
    <h4>Colored</h4>
    <div class="ui-cluster">
      <ui-checkbox color="red" selected>Red</ui-checkbox>
      <ui-checkbox color="green" appearance="toggle" selected>Green</ui-checkbox>
      <ui-checkbox color="blue" appearance="slider" selected>Blue</ui-checkbox>
      <ui-radio color="purple" name="color" selected>Purple</ui-radio>
    </div>
  </section>

  <section>
    <h4>Inverted</h4>
    <div class="ui-dark ui-p-m ui-cluster" style="background: var(--ui-background)">
      <ui-checkbox inverted>Checkbox</ui-checkbox>
      <ui-checkbox inverted appearance="toggle" selected>Toggle</ui-checkbox>
      <ui-checkbox inverted appearance="slider">Slider</ui-checkbox>
    </div>
  </section>

  <section>
    <h4>Size</h4>
    <div class="ui-stack">
      <ui-checkbox size="mini">Mini</ui-checkbox>
      <ui-checkbox size="small" appearance="toggle">Small</ui-checkbox>
      <ui-radio size="large" name="size">Large</ui-radio>
      <ui-checkbox size="huge" selected>Huge</ui-checkbox>
    </div>
  </section>
</div>
