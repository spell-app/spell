<!-- <ui-device>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-device" data-omit="">
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-fields>
      <ui-property name="device"></ui-property>
      <ui-property name="orientation"></ui-property>
    </ui-fields>
  </ui-property-group>
  <ui-property-group label="Behaviour" data-group="behaviour">
    <ui-property name="controls"></ui-property>
    <ui-fields>
      <ui-property name="modal"></ui-property>
      <ui-property name="closedby"></ui-property>
    </ui-fields>
  </ui-property-group>
</ui-property-editor>
