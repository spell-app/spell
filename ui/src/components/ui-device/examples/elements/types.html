<!-- `<ui-device>`:  a phone round what it holds, at a phone's size, its own buttons in its bottom edge -->
<ui-device device="phone">
  <ui-segment appearance="basic">
    <ui-header size="large">Hello</ui-header>
    <p>An app on a phone's screen, 390 by 844.</p>
    <ui-button color="primary">Start</ui-button>
  </ui-segment>
  <ui-button slot="buttons" size="small" color="primary">Done</ui-button>
</ui-device>
