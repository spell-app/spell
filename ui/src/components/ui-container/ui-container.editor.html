<!-- <ui-container>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-container" data-omit="">
  <ui-property-group label="Name" data-group="name">
    <ui-property name="text"></ui-property>
  </ui-property-group>
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="size"></ui-property>
    <ui-property name="inverted"></ui-property>
  </ui-property-group>
  <ui-property-group label="Layout" data-group="layout">
    <ui-property name="fluid"></ui-property>
    <ui-property name="wide"></ui-property>
    <ui-property name="width"></ui-property>
    <ui-property name="padding"></ui-property>
    <ui-property name="columns"></ui-property>
    <ui-property name="grid"></ui-property>
    <ui-property name="spacing"></ui-property>
    <ui-property name="align"></ui-property>
    <ui-property name="scrolling"></ui-property>
  </ui-property-group>
  <ui-property-group label="Behaviour" data-group="behaviour">
    <ui-property name="resizable"></ui-property>
  </ui-property-group>
</ui-property-editor>
