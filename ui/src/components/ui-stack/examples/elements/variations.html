<!-- `<ui-stack>` variations:  spacing and alignment. -->
<div class="ui-stack">
  <section>
    <h4>Spacing</h4>
    <ui-stack direction="horizontal" spacing="none">
      <ui-button>none</ui-button>
      <ui-button>none</ui-button>
    </ui-stack>
    <ui-stack direction="horizontal" spacing="xl">
      <ui-button>xl</ui-button>
      <ui-button>xl</ui-button>
    </ui-stack>
  </section>
  <section>
    <h4>Centred</h4>
    <ui-stack align="center">
      <ui-icon name="inbox" size="huge"></ui-icon>
      <ui-text>No messages yet</ui-text>
    </ui-stack>
  </section>
</div>
