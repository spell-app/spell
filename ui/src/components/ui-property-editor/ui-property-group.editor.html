<!-- <ui-property-group>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-property-group" data-omit="">
  <ui-property-group label="Name" data-group="name">
    <ui-property name="label"></ui-property>
  </ui-property-group>
  <ui-property-group label="Content" data-group="content">
    <ui-property name="output"></ui-property>
    <ui-property name="icon"></ui-property>
    <ui-property name="badge"></ui-property>
    <ui-property name="description"></ui-property>
  </ui-property-group>
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="selector"></ui-property>
    <ui-property name="flags"></ui-property>
    <ui-property name="level"></ui-property>
    <ui-property name="fold-icon"></ui-property>
    <ui-property name="color"></ui-property>
    <ui-property name="inverted"></ui-property>
    <ui-property name="size"></ui-property>
    <ui-property name="dividing"></ui-property>
    <ui-property name="appearance"></ui-property>
  </ui-property-group>
  <ui-property-group label="Layout" data-group="layout">
    <ui-property name="columns"></ui-property>
    <ui-property name="parent"></ui-property>
    <ui-property name="offset"></ui-property>
    <ui-property name="block"></ui-property>
    <ui-property name="padding"></ui-property>
    <ui-property name="attach-to"></ui-property>
    <ui-property name="scrolling"></ui-property>
    <ui-property name="height"></ui-property>
    <ui-property name="align"></ui-property>
  </ui-property-group>
  <ui-property-group label="States" data-group="states">
    <ui-property name="open"></ui-property>
    <ui-property name="loading"></ui-property>
    <ui-property name="disabled"></ui-property>
  </ui-property-group>
  <ui-property-group label="Form" data-group="form">
    <ui-property name="readonly"></ui-property>
    <ui-property name="state"></ui-property>
    <ui-property name="error"></ui-property>
    <ui-property name="hint"></ui-property>
  </ui-property-group>
  <ui-property-group label="Behaviour" data-group="behaviour">
    <ui-property name="hide-empty"></ui-property>
    <ui-property name="collapsible"></ui-property>
    <ui-property name="sticky"></ui-property>
  </ui-property-group>
</ui-property-editor>
