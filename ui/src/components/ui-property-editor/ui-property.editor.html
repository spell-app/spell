<!-- <ui-property>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-property" data-omit="">
  <ui-property-group label="Name" data-group="name">
    <ui-property name="name"></ui-property>
    <ui-property name="label"></ui-property>
  </ui-property-group>
  <ui-property-group label="Content" data-group="content">
    <ui-property name="description"></ui-property>
    <ui-property name="output"></ui-property>
  </ui-property-group>
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="as"></ui-property>
    <ui-property name="mixed"></ui-property>
  </ui-property-group>
  <ui-property-group label="Layout" data-group="layout">
    <ui-property name="inline"></ui-property>
    <ui-property name="width"></ui-property>
  </ui-property-group>
  <ui-property-group label="States" data-group="states">
    <ui-property name="disabled"></ui-property>
  </ui-property-group>
  <ui-property-group label="Form" data-group="form">
    <ui-property name="default"></ui-property>
    <ui-property name="options"></ui-property>
    <ui-property name="unsaved"></ui-property>
    <ui-property name="hint"></ui-property>
    <ui-property name="error"></ui-property>
    <ui-property name="state"></ui-property>
    <ui-property name="apply"></ui-property>
    <ui-property name="rules"></ui-property>
    <ui-property name="required"></ui-property>
    <ui-property name="readonly"></ui-property>
  </ui-property-group>
</ui-property-editor>
