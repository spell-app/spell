<!-- <ui-tour-step>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-tour-step" data-omit="">
  <ui-property-group label="Name" data-group="name">
    <ui-property name="name"></ui-property>
  </ui-property-group>
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="dim"></ui-property>
  </ui-property-group>
  <ui-property-group label="Layout" data-group="layout">
    <ui-property name="placement"></ui-property>
  </ui-property-group>
  <ui-property-group label="Behaviour" data-group="behaviour">
    <ui-property name="target"></ui-property>
    <ui-property name="wait-for"></ui-property>
  </ui-property-group>
</ui-property-editor>
