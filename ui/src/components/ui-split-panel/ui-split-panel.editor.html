<!-- <ui-split-panel>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-split-panel" data-omit="">
  <ui-property-group label="Layout" data-group="layout">
    <ui-property name="columns"></ui-property>
    <ui-property name="rows"></ui-property>
  </ui-property-group>
  <ui-property-group label="Behaviour" data-group="behaviour">
    <ui-property name="resizable"></ui-property>
    <ui-property name="grows"></ui-property>
    <ui-property name="min-size"></ui-property>
  </ui-property-group>
</ui-property-editor>
