<!-- <ui-popup>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-popup" data-omit="">
  <ui-property-group label="Name" data-group="name">
    <ui-property name="heading"></ui-property>
  </ui-property-group>
  <ui-property-group label="Content" data-group="content">
    <ui-property name="label"></ui-property>
  </ui-property-group>
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="size"></ui-property>
    <ui-property name="color"></ui-property>
    <ui-property name="inverted"></ui-property>
    <ui-property name="appearance"></ui-property>
    <ui-property name="flowing"></ui-property>
    <ui-property name="open-on"></ui-property>
    <ui-property name="for"></ui-property>
    <ui-property name="hide-delay"></ui-property>
  </ui-property-group>
  <ui-property-group label="Layout" data-group="layout">
    <ui-property name="fixed"></ui-property>
    <ui-property name="fluid"></ui-property>
    <ui-property name="wide"></ui-property>
    <ui-property name="position"></ui-property>
  </ui-property-group>
  <ui-property-group label="States" data-group="states">
    <ui-property name="loading"></ui-property>
  </ui-property-group>
  <ui-property-group label="Behaviour" data-group="behaviour">
    <ui-property name="hoverable"></ui-property>
    <ui-property name="show-delay"></ui-property>
    <ui-property name="target"></ui-property>
    <ui-property name="at"></ui-property>
  </ui-property-group>
</ui-property-editor>
