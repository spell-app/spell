<!-- <ui-shape>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-shape" data-omit="">
  <ui-property-group label="Name" data-group="name">
    <ui-property name="text"></ui-property>
  </ui-property-group>
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="cube"></ui-property>
    <ui-property name="active-index"></ui-property>
  </ui-property-group>
  <ui-property-group label="Layout" data-group="layout">
    <ui-property name="direction"></ui-property>
  </ui-property-group>
  <ui-property-group label="Behaviour" data-group="behaviour">
    <ui-property name="duration"></ui-property>
    <ui-property name="flip-on"></ui-property>
  </ui-property-group>
</ui-property-editor>
