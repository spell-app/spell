<!-- <ui-ad>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-ad" data-omit="">
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="unit"></ui-property>
    <ui-property name="test"></ui-property>
  </ui-property-group>
  <ui-property-group label="Layout" data-group="layout">
    <ui-property name="align"></ui-property>
  </ui-property-group>
</ui-property-editor>
