<!-- <ui-breadcrumbs>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-breadcrumbs" data-omit="">
  <ui-property-group label="Content" data-group="content">
    <ui-property name="divider"></ui-property>
  </ui-property-group>
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="size"></ui-property>
    <ui-property name="divider-icon"></ui-property>
    <ui-property name="inverted"></ui-property>
  </ui-property-group>
</ui-property-editor>
