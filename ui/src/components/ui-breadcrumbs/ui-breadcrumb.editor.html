<!-- <ui-breadcrumb>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-breadcrumb" data-omit="">
  <ui-property-group label="States" data-group="states">
    <ui-property name="selected"></ui-property>
  </ui-property-group>
  <ui-property-group label="Link" data-group="link">
    <ui-property name="link"></ui-property>
    <ui-property name="target"></ui-property>
  </ui-property-group>
</ui-property-editor>
