<!-- <ui-cards>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-cards" data-omit="">
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="size"></ui-property>
    <ui-property name="color"></ui-property>
    <ui-property name="inverted"></ui-property>
    <ui-property name="background"></ui-property>
    <ui-property name="appearance"></ui-property>
  </ui-property-group>
  <ui-property-group label="Layout" data-group="layout">
    <ui-property name="columns"></ui-property>
    <ui-property name="layout"></ui-property>
    <ui-property name="doubling"></ui-property>
    <ui-property name="stackable"></ui-property>
    <ui-property name="stack-with"></ui-property>
    <ui-property name="align"></ui-property>
    <ui-property name="direction"></ui-property>
  </ui-property-group>
</ui-property-editor>
