<!-- <ui-diagram>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-diagram" data-omit="">
  <ui-property-group label="Content" data-group="content">
    <ui-property name="spec"></ui-property>
  </ui-property-group>
  <ui-property-group label="Layout" data-group="layout">
    <ui-property name="columns"></ui-property>
  </ui-property-group>
  <ui-property-group label="Behaviour" data-group="behaviour">
    <ui-property name="remember"></ui-property>
    <ui-property name="fixed"></ui-property>
  </ui-property-group>
</ui-property-editor>
