<!-- <ui-diagram-node>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-diagram-node" data-omit="">
  <ui-property-group label="Content" data-group="content">
    <ui-property name="name"></ui-property>
  </ui-property-group>
  <ui-property-group label="Behaviour" data-group="behaviour">
    <ui-property name="resizable"></ui-property>
  </ui-property-group>
</ui-property-editor>
