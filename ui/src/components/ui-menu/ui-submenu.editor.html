<!-- <ui-submenu>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-submenu" data-omit="">
  <ui-property-group label="Name" data-group="name">
    <ui-property name="label"></ui-property>
  </ui-property-group>
  <ui-property-group label="Content" data-group="content">
    <ui-property name="icon"></ui-property>
    <ui-property name="menu"></ui-property>
  </ui-property-group>
  <ui-property-group label="States" data-group="states">
    <ui-property name="disabled"></ui-property>
  </ui-property-group>
</ui-property-editor>
