<!-- <ui-flyout>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-flyout" data-omit="">
  <ui-property-group label="Name" data-group="name">
    <ui-property name="heading"></ui-property>
  </ui-property-group>
  <ui-property-group label="Content" data-group="content">
    <ui-property name="content"></ui-property>
  </ui-property-group>
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="fullscreen"></ui-property>
    <ui-property name="blurring"></ui-property>
    <ui-property name="modeless"></ui-property>
    <ui-property name="inverted"></ui-property>
  </ui-property-group>
  <ui-property-group label="Layout" data-group="layout">
    <ui-property name="position"></ui-property>
    <ui-property name="width"></ui-property>
  </ui-property-group>
  <ui-property-group label="Behaviour" data-group="behaviour">
    <ui-property name="closable"></ui-property>
    <ui-property name="closedby"></ui-property>
  </ui-property-group>
</ui-property-editor>
