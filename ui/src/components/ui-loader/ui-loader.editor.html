<!-- <ui-loader>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-loader" data-omit="">
  <ui-property-group label="Name" data-group="name">
    <ui-property name="text"></ui-property>
  </ui-property-group>
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="size"></ui-property>
    <ui-property name="color"></ui-property>
    <ui-property name="inverted"></ui-property>
    <ui-property name="speed"></ui-property>
    <ui-property name="double"></ui-property>
    <ui-property name="elastic"></ui-property>
  </ui-property-group>
  <ui-property-group label="Layout" data-group="layout">
    <ui-property name="inline"></ui-property>
    <ui-property name="align"></ui-property>
  </ui-property-group>
  <ui-property-group label="States" data-group="states">
    <ui-property name="disabled"></ui-property>
    <ui-property name="indeterminate"></ui-property>
  </ui-property-group>
</ui-property-editor>
