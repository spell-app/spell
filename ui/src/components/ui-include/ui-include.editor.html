<!-- <ui-include>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-include" data-omit="">
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="source"></ui-property>
    <ui-property name="load"></ui-property>
    <ui-property name="selector"></ui-property>
  </ui-property-group>
  <ui-property-group label="Advanced" data-group="advanced">
    <ui-property name="page-styles"></ui-property>
  </ui-property-group>
</ui-property-editor>
