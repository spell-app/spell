<!-- <ui-row>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-row" data-omit="">
  <ui-property-group label="Content" data-group="content">
    <ui-property name="header"></ui-property>
    <ui-property name="footer"></ui-property>
  </ui-property-group>
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="color"></ui-property>
  </ui-property-group>
  <ui-property-group label="Layout" data-group="layout">
    <ui-property name="columns"></ui-property>
    <ui-property name="equal-width"></ui-property>
    <ui-property name="divided"></ui-property>
    <ui-property name="spacing"></ui-property>
    <ui-property name="centered"></ui-property>
    <ui-property name="stretched"></ui-property>
    <ui-property name="stackable"></ui-property>
    <ui-property name="doubling"></ui-property>
    <ui-property name="only"></ui-property>
    <ui-property name="reversed"></ui-property>
    <ui-property name="align"></ui-property>
    <ui-property name="vertical-align"></ui-property>
  </ui-property-group>
</ui-property-editor>
