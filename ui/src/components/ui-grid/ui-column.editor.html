<!-- <ui-column>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-column" data-omit="">
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="color"></ui-property>
    <ui-property name="width-mobile"></ui-property>
    <ui-property name="width-tablet"></ui-property>
    <ui-property name="width-computer"></ui-property>
    <ui-property name="width-large"></ui-property>
    <ui-property name="width-widescreen"></ui-property>
  </ui-property-group>
  <ui-property-group label="Layout" data-group="layout">
    <ui-property name="width"></ui-property>
    <ui-property name="attach-to"></ui-property>
    <ui-property name="centered"></ui-property>
    <ui-property name="stretched"></ui-property>
    <ui-property name="only"></ui-property>
    <ui-property name="align"></ui-property>
    <ui-property name="vertical-align"></ui-property>
  </ui-property-group>
</ui-property-editor>
