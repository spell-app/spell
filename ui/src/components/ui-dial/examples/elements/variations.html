<!-- `<ui-dial>`'s variations as element markup:  sizes, ticks and a unit. -->
<div class="ui-cluster" style="gap: 32px; align-items: end">
  <ui-dial label="Small" size="small" color="violet" value="30"></ui-dial>
  <ui-dial label="Medium" color="violet" value="50" ticks="10"></ui-dial>
  <ui-dial label="Large" size="large" color="violet" value="70" unit="°" max="360"></ui-dial>
</div>
