<!-- `<ui-dial>`'s examples as element markup:  a font's settings, each dial its own colour (epic `mockup` P27). -->
<div class="ui-cluster" style="gap: 24px">
  <ui-dial
    size="small"
    label="Weight"
    color="orange"
    min="100"
    max="900"
    value="777"
    ticks
    style="--ui-dial-value-font-weight: 777"
  ></ui-dial>
  <ui-dial size="small" label="Roundness" color="teal" value="50"></ui-dial>
  <ui-dial size="small" label="Size" color="blue" max="250" value="104"></ui-dial>
  <ui-dial size="small" label="Line height" color="red" min="80" max="200" value="98" unit="%"></ui-dial>
  <ui-dial size="small" label="Spacing" color="yellow" min="-20" max="50" value="0" unit="%"></ui-dial>
</div>
