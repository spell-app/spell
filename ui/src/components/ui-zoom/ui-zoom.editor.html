<!-- <ui-zoom>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-zoom" data-omit="">
  <ui-property-group label="Content" data-group="content">
    <ui-property name="alt"></ui-property>
  </ui-property-group>
  <ui-property-group label="Layout" data-group="layout">
    <ui-property name="max-width"></ui-property>
    <ui-property name="max-height"></ui-property>
    <ui-property name="shrink"></ui-property>
  </ui-property-group>
  <ui-property-group label="States" data-group="states">
    <ui-property name="open"></ui-property>
  </ui-property-group>
  <ui-property-group label="Link" data-group="link">
    <ui-property name="src"></ui-property>
  </ui-property-group>
</ui-property-editor>
