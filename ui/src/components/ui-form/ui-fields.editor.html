<!-- <ui-fields>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-fields" data-omit="">
  <ui-property-group label="Content" data-group="content">
    <ui-property name="grouped"></ui-property>
  </ui-property-group>
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="widths"></ui-property>
  </ui-property-group>
  <ui-property-group label="Layout" data-group="layout">
    <ui-property name="inline"></ui-property>
    <ui-property name="unstackable"></ui-property>
    <ui-property name="equal"></ui-property>
  </ui-property-group>
  <ui-property-group label="States" data-group="states">
    <ui-property name="disabled"></ui-property>
  </ui-property-group>
  <ui-property-group label="Form" data-group="form">
    <ui-property name="state"></ui-property>
    <ui-property name="required"></ui-property>
  </ui-property-group>
</ui-property-editor>
