<!-- <ui-form>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-form" data-omit="">
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="size"></ui-property>
    <ui-property name="inverted"></ui-property>
  </ui-property-group>
  <ui-property-group label="Layout" data-group="layout">
    <ui-property name="fluid"></ui-property>
    <ui-property name="equal-width"></ui-property>
    <ui-property name="unstackable"></ui-property>
    <ui-property name="stack-with"></ui-property>
  </ui-property-group>
  <ui-property-group label="States" data-group="states">
    <ui-property name="loading"></ui-property>
    <ui-property name="disabled"></ui-property>
  </ui-property-group>
  <ui-property-group label="Form" data-group="form">
    <ui-property name="state"></ui-property>
    <ui-property name="validate"></ui-property>
    <ui-property name="apply"></ui-property>
    <ui-property name="rules"></ui-property>
    <ui-property name="value"></ui-property>
  </ui-property-group>
  <ui-property-group label="Advanced" data-group="advanced">
    <ui-property name="error-focus"></ui-property>
    <ui-property name="prevent-leaving"></ui-property>
    <ui-property name="debug"></ui-property>
  </ui-property-group>
</ui-property-editor>
