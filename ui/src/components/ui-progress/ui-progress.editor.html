<!-- <ui-progress>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-progress" data-omit="">
  <ui-property-group label="Name" data-group="name">
    <ui-property name="label"></ui-property>
  </ui-property-group>
  <ui-property-group label="Content" data-group="content">
    <ui-property name="total"></ui-property>
    <ui-property name="percent"></ui-property>
    <ui-property name="bar-colors"></ui-property>
  </ui-property-group>
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="size"></ui-property>
    <ui-property name="color"></ui-property>
    <ui-property name="inverted"></ui-property>
    <ui-property name="appearance"></ui-property>
    <ui-property name="indicating"></ui-property>
    <ui-property name="bar-text"></ui-property>
  </ui-property-group>
  <ui-property-group label="Layout" data-group="layout">
    <ui-property name="align"></ui-property>
    <ui-property name="attach-to"></ui-property>
  </ui-property-group>
  <ui-property-group label="States" data-group="states">
    <ui-property name="speed"></ui-property>
    <ui-property name="active"></ui-property>
    <ui-property name="disabled"></ui-property>
    <ui-property name="indeterminate"></ui-property>
  </ui-property-group>
  <ui-property-group label="Form" data-group="form">
    <ui-property name="state"></ui-property>
    <ui-property name="value"></ui-property>
  </ui-property-group>
  <ui-property-group label="Behaviour" data-group="behaviour">
    <ui-property name="precision"></ui-property>
  </ui-property-group>
</ui-property-editor>
