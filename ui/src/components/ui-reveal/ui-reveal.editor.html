<!-- <ui-reveal>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-reveal" data-omit="">
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="size"></ui-property>
    <ui-property name="fade"></ui-property>
    <ui-property name="move"></ui-property>
    <ui-property name="rotate"></ui-property>
    <ui-property name="slide"></ui-property>
    <ui-property name="instant"></ui-property>
    <ui-property name="clip"></ui-property>
  </ui-property-group>
  <ui-property-group label="States" data-group="states">
    <ui-property name="active"></ui-property>
    <ui-property name="disabled"></ui-property>
  </ui-property-group>
</ui-property-editor>
