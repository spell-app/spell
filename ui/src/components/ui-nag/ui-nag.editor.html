<!-- <ui-nag>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-nag" data-omit="">
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="size"></ui-property>
    <ui-property name="color"></ui-property>
    <ui-property name="inverted"></ui-property>
    <ui-property name="overlay"></ui-property>
    <ui-property name="bottom"></ui-property>
  </ui-property-group>
  <ui-property-group label="Layout" data-group="layout">
    <ui-property name="fixed"></ui-property>
  </ui-property-group>
  <ui-property-group label="Form" data-group="form">
    <ui-property name="value"></ui-property>
  </ui-property-group>
  <ui-property-group label="Behaviour" data-group="behaviour">
    <ui-property name="closable"></ui-property>
    <ui-property name="key"></ui-property>
    <ui-property name="storage"></ui-property>
    <ui-property name="display-time"></ui-property>
  </ui-property-group>
  <ui-property-group label="Advanced" data-group="advanced">
    <ui-property name="expires"></ui-property>
    <ui-property name="persistent"></ui-property>
    <ui-property name="path"></ui-property>
    <ui-property name="domain"></ui-property>
    <ui-property name="secure"></ui-property>
    <ui-property name="samesite"></ui-property>
  </ui-property-group>
</ui-property-editor>
