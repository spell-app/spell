<!-- <ui-dimension>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-dimension" data-omit="">
  <ui-property-group label="Content" data-group="content">
    <ui-property name="value"></ui-property>
    <ui-property name="dimension"></ui-property>
    <ui-property name="unit"></ui-property>
  </ui-property-group>
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="in"></ui-property>
  </ui-property-group>
</ui-property-editor>
