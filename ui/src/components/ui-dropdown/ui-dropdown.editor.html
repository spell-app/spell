<!-- <ui-dropdown>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-dropdown" data-omit="">
  <ui-property-group label="Name" data-group="name">
    <ui-property name="label"></ui-property>
    <ui-property name="name"></ui-property>
  </ui-property-group>
  <ui-property-group label="Content" data-group="content">
    <ui-property name="icon"></ui-property>
    <ui-property name="no-results-text"></ui-property>
    <ui-property name="addition-text"></ui-property>
  </ui-property-group>
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="size"></ui-property>
    <ui-property name="color"></ui-property>
    <ui-property name="inverted"></ui-property>
    <ui-property name="selection"></ui-property>
    <ui-property name="search"></ui-property>
    <ui-property name="floating"></ui-property>
    <ui-property name="button"></ui-property>
    <ui-property name="labeled"></ui-property>
    <ui-property name="appearance"></ui-property>
    <ui-property name="limit"></ui-property>
    <ui-property name="length"></ui-property>
    <ui-property name="columnar"></ui-property>
  </ui-property-group>
  <ui-property-group label="Layout" data-group="layout">
    <ui-property name="inline"></ui-property>
    <ui-property name="padding"></ui-property>
    <ui-property name="fluid"></ui-property>
    <ui-property name="scrolling"></ui-property>
    <ui-property name="pointing"></ui-property>
    <ui-property name="direction"></ui-property>
  </ui-property-group>
  <ui-property-group label="States" data-group="states">
    <ui-property name="disabled"></ui-property>
    <ui-property name="loading"></ui-property>
    <ui-property name="open"></ui-property>
  </ui-property-group>
  <ui-property-group label="Form" data-group="form">
    <ui-property name="state"></ui-property>
    <ui-property name="multiple"></ui-property>
    <ui-property name="clearable"></ui-property>
    <ui-property name="readonly"></ui-property>
    <ui-property name="placeholder"></ui-property>
    <ui-property name="value"></ui-property>
    <ui-property name="parameter"></ui-property>
    <ui-property name="required"></ui-property>
    <ui-property name="allow-additions"></ui-property>
    <ui-property name="min-characters"></ui-property>
    <ui-property name="max-selections"></ui-property>
    <ui-property name="options"></ui-property>
  </ui-property-group>
  <ui-property-group label="Behaviour" data-group="behaviour">
    <ui-property name="resizable"></ui-property>
  </ui-property-group>
</ui-property-editor>
