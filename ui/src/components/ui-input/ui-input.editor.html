<!-- <ui-input>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-input" data-omit="">
  <ui-property-group label="Name" data-group="name">
    <ui-property name="label"></ui-property>
    <ui-property name="name"></ui-property>
  </ui-property-group>
  <ui-property-group label="Content" data-group="content">
    <ui-property name="icon-position"></ui-property>
    <ui-property name="icon"></ui-property>
  </ui-property-group>
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="size"></ui-property>
    <ui-property name="color"></ui-property>
    <ui-property name="inverted"></ui-property>
    <ui-property name="appearance"></ui-property>
    <ui-property name="labeled"></ui-property>
    <ui-property name="action"></ui-property>
    <ui-property name="type"></ui-property>
    <ui-property name="inputmode"></ui-property>
  </ui-property-group>
  <ui-property-group label="Layout" data-group="layout">
    <ui-property name="fluid"></ui-property>
  </ui-property-group>
  <ui-property-group label="States" data-group="states">
    <ui-property name="loading"></ui-property>
    <ui-property name="disabled"></ui-property>
  </ui-property-group>
  <ui-property-group label="Form" data-group="form">
    <ui-property name="state"></ui-property>
    <ui-property name="readonly"></ui-property>
    <ui-property name="value"></ui-property>
    <ui-property name="parameter"></ui-property>
    <ui-property name="placeholder"></ui-property>
    <ui-property name="required"></ui-property>
    <ui-property name="pattern"></ui-property>
    <ui-property name="min"></ui-property>
    <ui-property name="max"></ui-property>
    <ui-property name="step"></ui-property>
    <ui-property name="minlength"></ui-property>
    <ui-property name="maxlength"></ui-property>
    <ui-property name="accept"></ui-property>
    <ui-fields>
      <ui-property name="multiple"></ui-property>
      <ui-property name="folder"></ui-property>
    </ui-fields>
    <ui-property name="autocomplete"></ui-property>
    <ui-property name="rules"></ui-property>
  </ui-property-group>
  <ui-property-group label="Behaviour" data-group="behaviour">
    <ui-property name="clearable"></ui-property>
  </ui-property-group>
</ui-property-editor>
