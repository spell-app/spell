<!-- <ui-comment>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-comment" data-omit="">
  <ui-property-group label="States" data-group="states">
    <ui-property name="collapsed"></ui-property>
    <ui-property name="disabled"></ui-property>
  </ui-property-group>
</ui-property-editor>
