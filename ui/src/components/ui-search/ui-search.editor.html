<!-- <ui-search>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-search" data-omit="">
  <ui-property-group label="Name" data-group="name">
    <ui-property name="name"></ui-property>
  </ui-property-group>
  <ui-property-group label="Content" data-group="content">
    <ui-property name="source"></ui-property>
  </ui-property-group>
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="size"></ui-property>
    <ui-property name="category"></ui-property>
    <ui-property name="length"></ui-property>
    <ui-property name="max-results"></ui-property>
    <ui-property name="full-text-search"></ui-property>
  </ui-property-group>
  <ui-property-group label="Layout" data-group="layout">
    <ui-property name="direction"></ui-property>
    <ui-property name="fluid"></ui-property>
    <ui-property name="scrolling"></ui-property>
    <ui-property name="align"></ui-property>
  </ui-property-group>
  <ui-property-group label="States" data-group="states">
    <ui-property name="loading"></ui-property>
    <ui-property name="disabled"></ui-property>
    <ui-property name="open"></ui-property>
  </ui-property-group>
  <ui-property-group label="Form" data-group="form">
    <ui-property name="readonly"></ui-property>
    <ui-property name="placeholder"></ui-property>
    <ui-property name="value"></ui-property>
    <ui-property name="parameter"></ui-property>
    <ui-property name="required"></ui-property>
    <ui-property name="min-characters"></ui-property>
  </ui-property-group>
  <ui-property-group label="Link" data-group="link">
    <ui-property name="url"></ui-property>
  </ui-property-group>
  <ui-property-group label="Behaviour" data-group="behaviour">
    <ui-property name="resizable"></ui-property>
    <ui-property name="search-delay"></ui-property>
    <ui-property name="delay"></ui-property>
    <ui-property name="search-fields"></ui-property>
  </ui-property-group>
  <ui-property-group label="Advanced" data-group="advanced">
    <ui-property name="ignore-diacritics"></ui-property>
    <ui-property name="highlight-matches"></ui-property>
    <ui-property name="select-first-result"></ui-property>
    <ui-property name="show-no-results"></ui-property>
  </ui-property-group>
</ui-property-editor>
