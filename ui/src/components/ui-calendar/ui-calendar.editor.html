<!-- <ui-calendar>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-calendar" data-omit="">
  <ui-property-group label="Name" data-group="name">
    <ui-property name="name"></ui-property>
  </ui-property-group>
  <ui-property-group label="Content" data-group="content">
    <ui-property name="icon"></ui-property>
  </ui-property-group>
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="size"></ui-property>
    <ui-property name="color"></ui-property>
    <ui-property name="inverted"></ui-property>
    <ui-property name="type"></ui-property>
    <ui-property name="initial-date"></ui-property>
    <ui-property name="first-day-of-week"></ui-property>
    <ui-property name="locale"></ui-property>
    <ui-property name="today"></ui-property>
    <ui-property name="select-adjacent-days"></ui-property>
    <ui-property name="start-calendar"></ui-property>
    <ui-property name="end-calendar"></ui-property>
  </ui-property-group>
  <ui-property-group label="Layout" data-group="layout">
    <ui-property name="padding"></ui-property>
    <ui-property name="fluid"></ui-property>
    <ui-property name="inline"></ui-property>
    <ui-property name="position"></ui-property>
  </ui-property-group>
  <ui-property-group label="States" data-group="states">
    <ui-property name="disabled"></ui-property>
    <ui-property name="open"></ui-property>
  </ui-property-group>
  <ui-property-group label="Form" data-group="form">
    <ui-property name="value"></ui-property>
    <ui-property name="parameter"></ui-property>
    <ui-property name="required"></ui-property>
    <ui-property name="readonly"></ui-property>
    <ui-property name="placeholder"></ui-property>
    <ui-property name="min"></ui-property>
    <ui-property name="max"></ui-property>
  </ui-property-group>
  <ui-property-group label="Behaviour" data-group="behaviour">
    <ui-property name="disable-minute"></ui-property>
    <ui-property name="disable-month"></ui-property>
    <ui-property name="disable-year"></ui-property>
    <ui-property name="disabled-dates"></ui-property>
    <ui-property name="disabled-days-of-week"></ui-property>
  </ui-property-group>
</ui-property-editor>
