<!-- <ui-image>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-image" data-omit="">
  <ui-property-group label="Content" data-group="content">
    <ui-property name="avatar"></ui-property>
    <ui-property name="caption"></ui-property>
    <ui-property name="alt"></ui-property>
  </ui-property-group>
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="size"></ui-property>
    <ui-property name="appearance"></ui-property>
    <ui-property name="background"></ui-property>
    <ui-property name="aspect-ratio"></ui-property>
    <ui-property name="crop"></ui-property>
  </ui-property-group>
  <ui-property-group label="Layout" data-group="layout">
    <ui-property name="align"></ui-property>
    <ui-property name="fluid"></ui-property>
    <ui-property name="inline"></ui-property>
    <ui-property name="floated"></ui-property>
    <ui-property name="spacing"></ui-property>
    <ui-property name="vertical-align"></ui-property>
    <ui-property name="width"></ui-property>
    <ui-property name="height"></ui-property>
  </ui-property-group>
  <ui-property-group label="States" data-group="states">
    <ui-property name="disabled"></ui-property>
    <ui-property name="loading"></ui-property>
  </ui-property-group>
  <ui-property-group label="Link" data-group="link">
    <ui-property name="src"></ui-property>
    <ui-property name="link"></ui-property>
  </ui-property-group>
  <ui-property-group label="Behaviour" data-group="behaviour">
    <ui-property name="zoom"></ui-property>
  </ui-property-group>
</ui-property-editor>
