<!--
  `<ui-theme-editor>`'s types, as element markup (no class-grammar twin:  it's built of other elements).
  - It applies the theme it edits to the whole page while it's on it, so each page shows ONE editor.
-->
<div class="ui-stack">
  <section>
    <h4>Theme editor</h4>
    <ui-theme-editor></ui-theme-editor>
  </section>
</div>
