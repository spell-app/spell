<!-- <ui-theme-editor>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-theme-editor" data-omit="">
  <ui-property-group label="Content" data-group="content">
    <ui-property name="pages"></ui-property>
  </ui-property-group>
  <ui-property-group label="Form" data-group="form">
    <ui-property name="value"></ui-property>
  </ui-property-group>
  <ui-property-group label="Link" data-group="link">
    <ui-property name="base"></ui-property>
  </ui-property-group>
</ui-property-editor>
