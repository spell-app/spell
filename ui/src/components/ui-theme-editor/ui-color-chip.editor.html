<!-- <ui-color-chip>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-color-chip" data-omit="">
  <ui-property-group label="Content" data-group="content">
    <ui-property name="color"></ui-property>
    <ui-property name="label"></ui-property>
  </ui-property-group>
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="scheme"></ui-property>
  </ui-property-group>
</ui-property-editor>
