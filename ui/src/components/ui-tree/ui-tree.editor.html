<!-- <ui-tree>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-tree" data-omit="">
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="appearance"></ui-property>
    <ui-property name="column-titles"></ui-property>
  </ui-property-group>
  <ui-property-group label="Behaviour" data-group="behaviour">
    <ui-property name="choose"></ui-property>
    <ui-property name="filter"></ui-property>
    <ui-property name="label"></ui-property>
    <ui-property name="sticky-path"></ui-property>
  </ui-property-group>
</ui-property-editor>
