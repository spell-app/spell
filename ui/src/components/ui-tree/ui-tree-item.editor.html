<!-- <ui-tree-item>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-tree-item" data-omit="">
  <ui-property-group label="Content" data-group="content">
    <ui-property name="label"></ui-property>
    <ui-property name="which"></ui-property>
    <ui-property name="icon"></ui-property>
    <ui-property name="value"></ui-property>
    <ui-property name="count"></ui-property>
    <ui-property name="badge"></ui-property>
  </ui-property-group>
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="band"></ui-property>
  </ui-property-group>
  <ui-property-group label="Behaviour" data-group="behaviour">
    <ui-property name="open"></ui-property>
    <ui-property name="selected"></ui-property>
    <ui-property name="expandable"></ui-property>
    <ui-property name="group"></ui-property>
  </ui-property-group>
</ui-property-editor>
