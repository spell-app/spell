<!-- <ui-transition>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-transition" data-omit="">
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="color"></ui-property>
    <ui-property name="inverted"></ui-property>
    <ui-property name="looping"></ui-property>
    <ui-property name="pulsating"></ui-property>
  </ui-property-group>
  <ui-property-group label="Layout" data-group="layout">
    <ui-property name="inline"></ui-property>
  </ui-property-group>
  <ui-property-group label="States" data-group="states">
    <ui-property name="disabled"></ui-property>
  </ui-property-group>
  <ui-property-group label="Behaviour" data-group="behaviour">
    <ui-property name="duration"></ui-property>
  </ui-property-group>
  <ui-property-group label="Advanced" data-group="advanced">
    <ui-property name="interrupt"></ui-property>
    <ui-property name="allow-repeats"></ui-property>
  </ui-property-group>
</ui-property-editor>
