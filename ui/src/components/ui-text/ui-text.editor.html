<!-- <ui-text>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-text" data-omit="">
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="size"></ui-property>
    <ui-property name="color"></ui-property>
    <ui-property name="inverted"></ui-property>
    <ui-property name="bold"></ui-property>
    <ui-property name="heavy"></ui-property>
    <ui-property name="italic"></ui-property>
    <ui-property name="underline"></ui-property>
    <ui-property name="strikethrough"></ui-property>
    <ui-property name="highlight"></ui-property>
    <ui-property name="subscript"></ui-property>
    <ui-property name="superscript"></ui-property>
    <ui-property name="all-caps"></ui-property>
    <ui-property name="title-caps"></ui-property>
    <ui-property name="headline"></ui-property>
    <ui-property name="subhead"></ui-property>
    <ui-property name="serif"></ui-property>
    <ui-property name="sans-serif"></ui-property>
    <ui-property name="typewriter"></ui-property>
    <ui-property name="code"></ui-property>
  </ui-property-group>
  <ui-property-group label="Layout" data-group="layout">
    <ui-property name="paragraph"></ui-property>
  </ui-property-group>
  <ui-property-group label="States" data-group="states">
    <ui-property name="disabled"></ui-property>
  </ui-property-group>
  <ui-property-group label="Form" data-group="form">
    <ui-property name="state"></ui-property>
  </ui-property-group>
</ui-property-editor>
