<!-- <ui-page>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-page" data-omit="">
  <ui-property-group label="Content" data-group="content">
    <ui-property name="icons"></ui-property>
    <ui-property name="emoji"></ui-property>
  </ui-property-group>
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="display"></ui-property>
    <ui-property name="theme"></ui-property>
    <ui-property name="size"></ui-property>
    <ui-property name="defaults"></ui-property>
  </ui-property-group>
  <ui-property-group label="Layout" data-group="layout">
    <ui-property name="stack-with"></ui-property>
    <ui-property name="width"></ui-property>
    <ui-property name="height"></ui-property>
    <ui-property name="fixed"></ui-property>
  </ui-property-group>
  <ui-property-group label="States" data-group="states">
    <ui-property name="loading"></ui-property>
  </ui-property-group>
  <ui-property-group label="Link" data-group="link">
    <ui-property name="assets"></ui-property>
  </ui-property-group>
  <ui-property-group label="Behaviour" data-group="behaviour">
    <ui-property name="timeout"></ui-property>
    <ui-property name="app"></ui-property>
  </ui-property-group>
  <ui-property-group label="Advanced" data-group="advanced">
    <ui-property name="pure"></ui-property>
  </ui-property-group>
</ui-property-editor>
