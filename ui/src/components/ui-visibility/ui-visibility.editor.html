<!-- <ui-visibility>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-visibility" data-omit="">
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="once"></ui-property>
    <ui-property name="continuous"></ui-property>
    <ui-property name="type"></ui-property>
  </ui-property-group>
  <ui-property-group label="Layout" data-group="layout">
    <ui-property name="offset"></ui-property>
  </ui-property-group>
  <ui-property-group label="Behaviour" data-group="behaviour">
    <ui-property name="duration"></ui-property>
  </ui-property-group>
</ui-property-editor>
