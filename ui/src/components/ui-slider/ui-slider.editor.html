<!-- <ui-slider>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-slider" data-omit="">
  <ui-property-group label="Name" data-group="name">
    <ui-property name="name"></ui-property>
  </ui-property-group>
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="size"></ui-property>
    <ui-property name="color"></ui-property>
    <ui-property name="inverted"></ui-property>
    <ui-property name="appearance"></ui-property>
    <ui-property name="hover"></ui-property>
    <ui-property name="labeled"></ui-property>
    <ui-property name="range"></ui-property>
    <ui-property name="smooth"></ui-property>
    <ui-property name="ticked"></ui-property>
    <ui-property name="tick-step"></ui-property>
    <ui-property name="end"></ui-property>
    <ui-property name="step-labels"></ui-property>
  </ui-property-group>
  <ui-property-group label="Layout" data-group="layout">
    <ui-property name="direction"></ui-property>
    <ui-property name="align"></ui-property>
  </ui-property-group>
  <ui-property-group label="States" data-group="states">
    <ui-property name="disabled"></ui-property>
  </ui-property-group>
  <ui-property-group label="Form" data-group="form">
    <ui-property name="readonly"></ui-property>
    <ui-property name="min"></ui-property>
    <ui-property name="max"></ui-property>
    <ui-property name="step"></ui-property>
    <ui-property name="value"></ui-property>
    <ui-property name="parameter"></ui-property>
    <ui-property name="required"></ui-property>
  </ui-property-group>
</ui-property-editor>
