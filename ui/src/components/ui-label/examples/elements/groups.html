<!-- `src/components/ui-label/examples/groups.html` as element markup. -->
<div class="ui-stack">
  <section>
    <h4>Group size</h4>
    <ui-labels size="huge">
      <ui-label>Fun</ui-label>
      <ui-label>Happy</ui-label>
      <ui-label>Smart</ui-label>
    </ui-labels>
  </section>

  <section>
    <h4>Colored group</h4>
    <ui-labels color="blue">
      <ui-label link="#fun">Fun</ui-label>
      <ui-label link="#happy" detail="22">Happy</ui-label>
      <ui-label link="#smart">Smart</ui-label>
    </ui-labels>
  </section>

  <section>
    <h4>Basic group</h4>
    <ui-labels appearance="basic">
      <ui-label>Fun</ui-label>
      <ui-label>Happy</ui-label>
      <ui-label>Smart</ui-label>
    </ui-labels>
  </section>

  <section>
    <h4>Tag group</h4>
    <ui-labels tag>
      <ui-label link="#one">$10.00</ui-label>
      <ui-label link="#two">$19.99</ui-label>
      <ui-label link="#three">$24.99</ui-label>
    </ui-labels>
  </section>

  <section>
    <h4>Circular group</h4>
    <ui-labels appearance="circular">
      <ui-label link="#a">11</ui-label>
      <ui-label link="#b">22</ui-label>
      <ui-label link="#c">33</ui-label>
    </ui-labels>
  </section>
</div>
