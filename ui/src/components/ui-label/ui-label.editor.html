<!-- <ui-label>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-label" data-omit="">
  <ui-property-group label="Content" data-group="content">
    <ui-property name="image"></ui-property>
    <ui-property name="prompt"></ui-property>
    <ui-property name="icon"></ui-property>
    <ui-property name="detail"></ui-property>
  </ui-property-group>
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="size"></ui-property>
    <ui-property name="color"></ui-property>
    <ui-property name="inverted"></ui-property>
    <ui-property name="tag"></ui-property>
    <ui-property name="corner"></ui-property>
    <ui-property name="ribbon"></ui-property>
    <ui-property name="floating"></ui-property>
    <ui-property name="appearance"></ui-property>
    <ui-property name="empty"></ui-property>
  </ui-property-group>
  <ui-property-group label="Layout" data-group="layout">
    <ui-property name="pointing"></ui-property>
    <ui-property name="attach-to"></ui-property>
    <ui-property name="direction"></ui-property>
    <ui-property name="fluid"></ui-property>
    <ui-property name="align"></ui-property>
  </ui-property-group>
  <ui-property-group label="States" data-group="states">
    <ui-property name="selected"></ui-property>
    <ui-property name="disabled"></ui-property>
  </ui-property-group>
  <ui-property-group label="Link" data-group="link">
    <ui-property name="link"></ui-property>
    <ui-property name="target"></ui-property>
  </ui-property-group>
  <ui-property-group label="Behaviour" data-group="behaviour">
    <ui-property name="removable"></ui-property>
  </ui-property-group>
</ui-property-editor>
