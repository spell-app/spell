<!-- <ui-keys>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-keys" data-omit="">
  <ui-property-group label="Content" data-group="content">
    <ui-property name="shortcut"></ui-property>
  </ui-property-group>
  <ui-property-group label="Advanced" data-group="advanced">
    <ui-property name="platform"></ui-property>
  </ui-property-group>
</ui-property-editor>
