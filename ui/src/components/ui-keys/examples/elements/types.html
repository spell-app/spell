<!-- `<ui-keys>`:  shortcuts as key caps, on the reader's own keyboard, a Mac's, and everyone else's. -->
<div class="ui-stack">
  <section>
    <h4>Keys</h4>
    <p>Save with <ui-keys shortcut="mod+S"></ui-keys>, undo with <ui-keys shortcut="mod+Z"></ui-keys>.</p>
  </section>
  <section>
    <h4>On a Mac, and elsewhere</h4>
    <p>
      <ui-keys shortcut="shift+mod+P" platform="apple"></ui-keys> on a Mac,
      <ui-keys shortcut="shift+mod+P" platform="other"></ui-keys> elsewhere.
    </p>
  </section>
  <section>
    <h4>Two shortcuts</h4>
    <p>Redo with <ui-keys shortcut="shift+mod+Z mod+Y"></ui-keys>.</p>
  </section>
</div>
