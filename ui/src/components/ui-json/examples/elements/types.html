<!-- `<ui-json>`:  data in a page draws nothing, so an example shows it read by a `<ui-tree-diagram>`. -->
<div class="ui-stack">
  <section>
    <h4>A tree diagram's data</h4>
    <ui-tree-diagram>
      <ui-json>{ "label": "Add", "children": [{ "label": "Number 1" }, { "label": "Number 2" }] }</ui-json>
    </ui-tree-diagram>
  </section>
</div>
