<!-- <ui-content>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-content" data-omit="">
  <ui-property-group label="Content" data-group="content">
    <ui-property name="image"></ui-property>
    <ui-property name="markdown"></ui-property>
  </ui-property-group>
  <ui-property-group label="Layout" data-group="layout">
    <ui-property name="scrolling"></ui-property>
    <ui-property name="align"></ui-property>
    <ui-property name="vertical-align"></ui-property>
  </ui-property-group>
</ui-property-editor>
