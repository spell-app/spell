<!-- <ui-avatar>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-avatar" data-omit="">
  <ui-property-group label="Content" data-group="content">
    <ui-property name="tooltip"></ui-property>
  </ui-property-group>
  <ui-property-group label="Link" data-group="link">
    <ui-property name="src"></ui-property>
  </ui-property-group>
</ui-property-editor>
