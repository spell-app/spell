<!-- <ui-toolbar>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-toolbar" data-omit="">
  <ui-property-group label="Content" data-group="content">
    <ui-property name="icon"></ui-property>
    <ui-property name="items"></ui-property>
    <ui-property name="show-keys"></ui-property>
    <ui-property name="all-items-icon"></ui-property>
  </ui-property-group>
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="size"></ui-property>
    <ui-property name="color"></ui-property>
    <ui-property name="inverted"></ui-property>
    <ui-property name="appearance"></ui-property>
    <ui-property name="pagination"></ui-property>
    <ui-property name="labeled"></ui-property>
    <ui-property name="wrap"></ui-property>
    <ui-property name="icon-column"></ui-property>
  </ui-property-group>
  <ui-property-group label="Layout" data-group="layout">
    <ui-property name="position"></ui-property>
    <ui-property name="direction"></ui-property>
    <ui-property name="fluid"></ui-property>
    <ui-property name="stackable"></ui-property>
    <ui-property name="centered"></ui-property>
    <ui-property name="wrapping"></ui-property>
    <ui-property name="padding"></ui-property>
    <ui-property name="attach-to"></ui-property>
    <ui-property name="fixed"></ui-property>
    <ui-property name="align"></ui-property>
    <ui-property name="equal"></ui-property>
    <ui-property name="shrinkable"></ui-property>
    <ui-property name="scroll-first"></ui-property>
    <ui-property name="scroll-only"></ui-property>
    <ui-property name="max-visible"></ui-property>
    <ui-property name="remember"></ui-property>
    <ui-property name="all-items-at-end"></ui-property>
  </ui-property-group>
  <ui-property-group label="Form" data-group="form">
    <ui-property name="name"></ui-property>
    <ui-property name="value"></ui-property>
  </ui-property-group>
  <ui-property-group label="Behaviour" data-group="behaviour">
    <ui-property name="choose"></ui-property>
    <ui-property name="ticks"></ui-property>
    <ui-property name="tabs"></ui-property>
    <ui-property name="interactive"></ui-property>
    <ui-property name="reorderable"></ui-property>
  </ui-property-group>
</ui-property-editor>
