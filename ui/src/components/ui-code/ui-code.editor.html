<!-- <ui-code>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-code" data-omit="">
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="source"></ui-property>
    <ui-property name="load"></ui-property>
    <ui-property name="language"></ui-property>
    <ui-property name="line-numbers"></ui-property>
    <ui-property name="start"></ui-property>
    <ui-property name="copy"></ui-property>
  </ui-property-group>
  <ui-property-group label="Layout" data-group="layout">
    <ui-property name="wrap"></ui-property>
  </ui-property-group>
</ui-property-editor>
