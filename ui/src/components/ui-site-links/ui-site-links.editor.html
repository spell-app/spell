<!-- <ui-site-links>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-site-links" data-omit="">
  <ui-property-group label="Content" data-group="content">
    <ui-property name="pages"></ui-property>
    <ui-property name="current"></ui-property>
  </ui-property-group>
  <ui-property-group label="Link" data-group="link">
    <ui-property name="report"></ui-property>
  </ui-property-group>
</ui-property-editor>
