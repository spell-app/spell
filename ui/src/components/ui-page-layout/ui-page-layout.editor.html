<!-- <ui-page-layout>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-page-layout" data-omit="">
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="drawer"></ui-property>
    <ui-property name="floating"></ui-property>
    <ui-fields>
      <ui-property name="left"></ui-property>
      <ui-property name="right"></ui-property>
    </ui-fields>
  </ui-property-group>
  <ui-property-group label="Behaviour" data-group="behaviour">
    <ui-property name="drawer-hides"></ui-property>
  </ui-property-group>
</ui-property-editor>
