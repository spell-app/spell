<!-- <ui-accordion>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-accordion" data-omit="">
  <ui-property-group label="Content" data-group="content">
    <ui-property name="tree"></ui-property>
  </ui-property-group>
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="appearance"></ui-property>
    <ui-property name="source"></ui-property>
    <ui-property name="selector"></ui-property>
    <ui-property name="inverted"></ui-property>
  </ui-property-group>
  <ui-property-group label="Layout" data-group="layout">
    <ui-property name="fluid"></ui-property>
    <ui-property name="padding"></ui-property>
  </ui-property-group>
  <ui-property-group label="States" data-group="states">
    <ui-property name="exclusive"></ui-property>
    <ui-property name="open"></ui-property>
  </ui-property-group>
  <ui-property-group label="Behaviour" data-group="behaviour">
    <ui-property name="collapsible"></ui-property>
  </ui-property-group>
</ui-property-editor>
