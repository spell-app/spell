<!-- <ui-toast>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-toast" data-omit="">
  <ui-property-group label="Name" data-group="name">
    <ui-property name="heading"></ui-property>
  </ui-property-group>
  <ui-property-group label="Content" data-group="content">
    <ui-property name="icon"></ui-property>
  </ui-property-group>
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="type"></ui-property>
    <ui-property name="color"></ui-property>
    <ui-property name="inverted"></ui-property>
    <ui-property name="message"></ui-property>
    <ui-property name="close-on-click"></ui-property>
    <ui-property name="progress"></ui-property>
    <ui-property name="actions"></ui-property>
  </ui-property-group>
  <ui-property-group label="Layout" data-group="layout">
    <ui-property name="compact"></ui-property>
  </ui-property-group>
  <ui-property-group label="Behaviour" data-group="behaviour">
    <ui-property name="closable"></ui-property>
    <ui-property name="display-time"></ui-property>
    <ui-property name="progress-up"></ui-property>
    <ui-property name="pause-on-hover"></ui-property>
  </ui-property-group>
</ui-property-editor>
