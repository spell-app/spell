<!-- <ui-tab>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-tab" data-omit="">
  <ui-property-group label="Name" data-group="name">
    <ui-property name="label"></ui-property>
  </ui-property-group>
  <ui-property-group label="Content" data-group="content">
    <ui-property name="icon"></ui-property>
  </ui-property-group>
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="appearance"></ui-property>
    <ui-property name="inverted"></ui-property>
  </ui-property-group>
  <ui-property-group label="Layout" data-group="layout">
    <ui-property name="attach-to"></ui-property>
    <ui-property name="parent"></ui-property>
  </ui-property-group>
  <ui-property-group label="States" data-group="states">
    <ui-property name="selected"></ui-property>
    <ui-property name="disabled"></ui-property>
    <ui-property name="loading"></ui-property>
  </ui-property-group>
  <ui-property-group label="Form" data-group="form">
    <ui-property name="value"></ui-property>
  </ui-property-group>
  <ui-property-group label="Advanced" data-group="advanced">
    <ui-property name="lazy"></ui-property>
  </ui-property-group>
</ui-property-editor>
