<!-- <ui-list>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-list" data-omit="">
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="size"></ui-property>
    <ui-property name="bulleted"></ui-property>
    <ui-property name="ordered"></ui-property>
    <ui-property name="suffixed"></ui-property>
    <ui-property name="appearance"></ui-property>
    <ui-property name="selection"></ui-property>
    <ui-property name="hover"></ui-property>
    <ui-property name="inverted"></ui-property>
  </ui-property-group>
  <ui-property-group label="Layout" data-group="layout">
    <ui-property name="direction"></ui-property>
    <ui-property name="divided"></ui-property>
    <ui-property name="celled"></ui-property>
    <ui-property name="spacing"></ui-property>
    <ui-property name="padding"></ui-property>
    <ui-property name="vertical-align"></ui-property>
  </ui-property-group>
</ui-property-editor>
