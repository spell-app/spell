<!-- `<ui-video>` and `<ui-audio>`:  the browser's own players. -->
<div class="ui-stack">
  <section>
    <h4>Video</h4>
    <ui-video
      src="examples/media/sample.webm"
      captions="examples/media/sample.vtt"
      ratio="16/9"
      label="A ball rolls across the screen"
      style="max-width: 32em"
    ></ui-video>
  </section>
  <section>
    <h4>Audio</h4>
    <ui-audio src="examples/media/chime.wav" controls label="A chime"></ui-audio>
  </section>
</div>
