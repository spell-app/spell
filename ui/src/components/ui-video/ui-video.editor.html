<!-- <ui-video>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-video" data-omit="">
  <ui-property-group label="Content" data-group="content">
    <ui-property name="poster"></ui-property>
    <ui-property name="captions"></ui-property>
  </ui-property-group>
  <ui-property-group label="Layout" data-group="layout">
    <ui-property name="ratio"></ui-property>
  </ui-property-group>
  <ui-property-group label="Link" data-group="link">
    <ui-property name="src"></ui-property>
  </ui-property-group>
  <ui-property-group label="Behaviour" data-group="behaviour">
    <ui-property name="autoplay"></ui-property>
    <ui-property name="muted"></ui-property>
    <ui-property name="loop"></ui-property>
    <ui-property name="controls"></ui-property>
  </ui-property-group>
</ui-property-editor>
