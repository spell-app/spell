<!-- <ui-markdown>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-markdown" data-omit="">
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="source"></ui-property>
    <ui-property name="load"></ui-property>
    <ui-property name="size"></ui-property>
    <ui-property name="breaks"></ui-property>
    <ui-property name="heading-offset"></ui-property>
  </ui-property-group>
  <ui-property-group label="Behaviour" data-group="behaviour">
    <ui-property name="skip-title"></ui-property>
    <ui-property name="editable"></ui-property>
  </ui-property-group>
  <ui-property-group label="Advanced" data-group="advanced">
    <ui-property name="sanitized"></ui-property>
  </ui-property-group>
</ui-property-editor>
