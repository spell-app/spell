<!-- <ui-placeholder-image>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-placeholder-image" data-omit="">
  <ui-property-group label="Content" data-group="content">
    <ui-property name="rectangular"></ui-property>
  </ui-property-group>
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="square"></ui-property>
  </ui-property-group>
</ui-property-editor>
