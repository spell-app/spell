<!-- <ui-table>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-table" data-omit="">
  <ui-property-group label="Content" data-group="content">
    <ui-property name="column-defs"></ui-property>
    <ui-property name="caption"></ui-property>
    <ui-property name="rows"></ui-property>
  </ui-property-group>
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="size"></ui-property>
    <ui-property name="color"></ui-property>
    <ui-property name="inverted"></ui-property>
    <ui-property name="definition"></ui-property>
    <ui-property name="single-line"></ui-property>
    <ui-property name="appearance"></ui-property>
    <ui-property name="overflowing"></ui-property>
    <ui-property name="stuck"></ui-property>
  </ui-property-group>
  <ui-property-group label="Layout" data-group="layout">
    <ui-property name="celled"></ui-property>
    <ui-property name="collapsing"></ui-property>
    <ui-property name="fixed"></ui-property>
    <ui-property name="unstackable"></ui-property>
    <ui-property name="padding"></ui-property>
    <ui-property name="attach-to"></ui-property>
    <ui-property name="stackable"></ui-property>
    <ui-property name="stack-by"></ui-property>
    <ui-property name="scrolling"></ui-property>
    <ui-property name="columns"></ui-property>
    <ui-property name="align"></ui-property>
    <ui-property name="vertical-align"></ui-property>
  </ui-property-group>
  <ui-property-group label="Behaviour" data-group="behaviour">
    <ui-property name="selectable"></ui-property>
    <ui-property name="editable"></ui-property>
    <ui-property name="sortable"></ui-property>
    <ui-property name="sort"></ui-property>
    <ui-property name="sort-column"></ui-property>
    <ui-property name="sort-direction"></ui-property>
  </ui-property-group>
  <ui-property-group label="Advanced" data-group="advanced">
    <ui-property name="client-sort"></ui-property>
  </ui-property-group>
</ui-property-editor>
