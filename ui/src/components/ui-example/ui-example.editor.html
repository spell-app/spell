  <ui-property-group label="Appearance" data-group="appearance">

    <ui-property name="description"></ui-property>
    <ui-property name="level"></ui-property>
    <ui-property name="code"></ui-property>
    <ui-property name="language"></ui-property>
    <ui-property name="bare"></ui-property>
    <ui-property name="variation"></ui-property>
  </ui-property-group>
</ui-property-editor>
