<!-- `src/components/ui-button/examples/states.html` as element markup. -->
<div class="ui-stack">
  <section>
    <h4>Active</h4>
    <ui-button selected icon="user">Follow</ui-button>
    <ui-button selected color="primary">Primary</ui-button>
    <ui-button selected appearance="basic">Basic</ui-button>
  </section>

  <section>
    <h4>Disabled</h4>
    <ui-button disabled icon="user">Followed</ui-button>
    <ui-button disabled="yes" color="primary">Disabled attribute</ui-button>
  </section>

  <section>
    <h4>Loading</h4>
    <ui-button loading>Loading</ui-button>
    <ui-button loading appearance="basic">Loading</ui-button>
    <ui-button loading color="primary">Loading</ui-button>
    <ui-button loading color="secondary">Loading</ui-button>
  </section>

  <section>
    <h4>Toggle</h4>
    <ui-button toggle>Vote</ui-button>
    <ui-button toggle selected>Voted</ui-button>
  </section>
</div>
