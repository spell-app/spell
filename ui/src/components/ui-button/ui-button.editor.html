<!-- <ui-button>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-button" data-omit="">
  <ui-property-group label="Name" data-group="name">
    <ui-property name="name"></ui-property>
  </ui-property-group>
  <ui-property-group label="Content" data-group="content">
    <ui-property name="icon"></ui-property>
    <ui-property name="icon-position"></ui-property>
    <ui-property name="label"></ui-property>
    <ui-property name="badge"></ui-property>
  </ui-property-group>
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="size"></ui-property>
    <ui-property name="color"></ui-property>
    <ui-property name="inverted"></ui-property>
    <ui-property name="appearance"></ui-property>
    <ui-property name="toggle"></ui-property>
    <ui-property name="wrap"></ui-property>
    <ui-property name="ellipsis"></ui-property>
    <ui-property name="labeled"></ui-property>
    <ui-property name="reveal"></ui-property>
    <ui-property name="type"></ui-property>
  </ui-property-group>
  <ui-property-group label="Layout" data-group="layout">
    <ui-property name="fluid"></ui-property>
    <ui-property name="padding"></ui-property>
    <ui-property name="attach-to"></ui-property>
  </ui-property-group>
  <ui-property-group label="States" data-group="states">
    <ui-property name="selected"></ui-property>
    <ui-property name="active-text"></ui-property>
    <ui-property name="inactive-text"></ui-property>
    <ui-property name="disabled"></ui-property>
    <ui-property name="loading"></ui-property>
  </ui-property-group>
  <ui-property-group label="Form" data-group="form">
    <ui-property name="value"></ui-property>
  </ui-property-group>
  <ui-property-group label="Link" data-group="link">
    <ui-property name="link"></ui-property>
    <ui-property name="target"></ui-property>
    <ui-property name="download"></ui-property>
  </ui-property-group>
  <ui-property-group label="Behaviour" data-group="behaviour">
    <ui-property name="commandfor"></ui-property>
    <ui-property name="command"></ui-property>
  </ui-property-group>
</ui-property-editor>
