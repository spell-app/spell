<!-- <ui-action>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<!-- Owen (epic `editor` I208):  one Appearance section;  no Name, Content, Form, Link or Behaviour:  an action's words, icon and what it does are its action's. -->
<ui-property-editor schema="ui-action" data-omit="description image flag kind shortcut value link target action">
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-fields>
      <ui-property name="label"></ui-property>
      <ui-property name="icon"></ui-property>
    </ui-fields>
    <ui-fields>
      <ui-property name="appearance"></ui-property>
      <ui-property name="color"></ui-property>
    </ui-fields>
    <ui-fields>
      <ui-property name="disabled"></ui-property>
      <ui-property name="selected"></ui-property>
      <ui-property name="icon-only"></ui-property>
    </ui-fields>
  </ui-property-group>
  <ui-property-group label="Layout" data-group="layout">
    <ui-property name="position"></ui-property>
    <ui-property name="padding"></ui-property>
  </ui-property-group>
</ui-property-editor>
