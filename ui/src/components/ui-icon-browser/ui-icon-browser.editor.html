<!-- <ui-icon-browser>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-icon-browser" data-omit="">
  <ui-property-group label="Content" data-group="content">
    <ui-property name="pack"></ui-property>
    <ui-property name="query"></ui-property>
  </ui-property-group>
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="compact"></ui-property>
  </ui-property-group>
  <ui-property-group label="Behaviour" data-group="behaviour">
    <ui-property name="address"></ui-property>
    <ui-property name="pick"></ui-property>
  </ui-property-group>
</ui-property-editor>
