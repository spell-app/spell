<!-- `src/components/ui-tree-diagram/examples/types.html` as element markup. -->
<div class="ui-stack">
  <section>
    <h4>Tree diagram</h4>
    <ui-tree-diagram>
      <ui-tree-node label="If" hover-text="if number / 15 is an integer">
        <ui-tree-node label="IsA · integer" detail="boolean" edge-label="condition">
          <ui-tree-node label="Divide" detail="number" edge-label="value">
            <ui-tree-node label="Variable number" detail="number"></ui-tree-node>
            <ui-tree-node label="Number 15" detail="number"></ui-tree-node>
          </ui-tree-node>
        </ui-tree-node>
        <ui-tree-node label="Print" edge-label="body">
          <ui-tree-node label="Variable number" detail="number"></ui-tree-node>
          <ui-tree-node label='Text "fizzbuzz"' detail="text"></ui-tree-node>
        </ui-tree-node>
        <ui-tree-node label="If …" edge-label="otherwise"></ui-tree-node>
      </ui-tree-node>
    </ui-tree-diagram>
  </section>

  <section>
    <h4>Labels only</h4>
    <ui-tree-diagram>
      <ui-tree-node label="Add">
        <ui-tree-node label="Number 1"></ui-tree-node>
        <ui-tree-node label="Number 2"></ui-tree-node>
      </ui-tree-node>
    </ui-tree-diagram>
  </section>
</div>
