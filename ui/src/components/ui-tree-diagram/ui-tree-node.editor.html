<!-- <ui-tree-node>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-tree-node" data-omit="">
  <ui-property-group label="Content" data-group="content">
    <ui-property name="label"></ui-property>
    <ui-property name="detail"></ui-property>
    <ui-property name="edge-label"></ui-property>
    <ui-property name="hover-text"></ui-property>
  </ui-property-group>
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="color"></ui-property>
    <ui-property name="kind"></ui-property>
  </ui-property-group>
  <ui-property-group label="Behaviour" data-group="behaviour">
    <ui-property name="folded"></ui-property>
  </ui-property-group>
</ui-property-editor>
