<!-- `<ui-theme-menu>`:  a page's theme and light / dark, in each of its three shapes. -->
<div class="ui-stack">
  <section>
    <h4>In a dark top bar</h4>
    <ui-segment inverted>
      <ui-theme-menu inverted size="small"></ui-theme-menu>
    </ui-segment>
  </section>

  <section>
    <h4>A theme dropdown</h4>
    <ui-theme-menu show="theme"></ui-theme-menu>
  </section>

  <section>
    <h4>Light / dark only</h4>
    <ui-theme-menu show="scheme"></ui-theme-menu>
  </section>
</div>
