<!-- <ui-theme-menu>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-theme-menu" data-omit="">
  <ui-property-group label="Appearance" data-group="appearance">
    <ui-property name="show"></ui-property>
    <ui-property name="size"></ui-property>
    <ui-property name="compact"></ui-property>
    <ui-property name="bench"></ui-property>
    <ui-property name="bench-page"></ui-property>
    <ui-property name="inverted"></ui-property>
  </ui-property-group>
</ui-property-editor>
