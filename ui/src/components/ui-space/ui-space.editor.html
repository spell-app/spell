<!-- <ui-space>'s property editor layout:  move, pair (<ui-fields>) or leave out (data-omit) its properties.  How:  Spell UI's AGENTS.md, "Property editor layouts". -->
<ui-property-editor schema="ui-space" data-omit="">
  <ui-property-group label="Layout" data-group="layout">
    <ui-property name="inline"></ui-property>
    <ui-property name="width"></ui-property>
    <ui-property name="height"></ui-property>
    <ui-property name="fluid"></ui-property>
    <ui-property name="grow"></ui-property>
    <ui-property name="shrink"></ui-property>
  </ui-property-group>
</ui-property-editor>
