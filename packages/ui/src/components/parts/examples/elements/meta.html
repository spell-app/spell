<!-- `src/components/parts/examples/meta.html` as element markup. -->
<!-- Owners are `stub-*` stand-ins (`StubOwner`) until card, feed, modal ... land;  each owns the parts Fomantic styles in it. -->
<div class="ui-stack">
  <section>
    <h4>Standalone</h4>
    <ui-meta><span>2 days ago</span></ui-meta>
  </section>

  <section>
    <h4>In owners</h4>
    <stub-card>
      <ui-content>
        <ui-meta><span>Joined in 2013</span><a href="#friends">Friends</a></ui-meta>
      </ui-content>
    </stub-card>
    <div class="ui items">
      <stub-item>
        <ui-content>
          <ui-meta><span>Description</span><span>Stevie</span></ui-meta>
        </ui-content>
      </stub-item>
    </div>
    <stub-feed>
      <div class="event">
        <ui-content>
          <ui-meta><a href="#like">4 Likes</a><a href="#reply">Reply</a></ui-meta>
        </ui-content>
      </div>
    </stub-feed>
    <div class="ui comments">
      <stub-comment>
        <ui-content>
          <ui-author href="#matt">Matt</ui-author>
          <ui-meta><span>Today at 5:42PM</span></ui-meta>
        </ui-content>
      </stub-comment>
    </div>
  </section>
</div>
