<div class="ui-stack">
  <section>
    <h4>Standalone</h4>
    <ui-author>Matt</ui-author>
  </section>

  <section>
    <h4>In owners</h4>
    <div class="ui comments">
      <stub-comment>
        <ui-content><ui-author href="#matt">Matt</ui-author></ui-content>
      </stub-comment>
    </div>
    <stub-feed>
      <div class="event">
        <ui-content>
          <ui-summary><ui-author href="#elliot">Elliot Fu</ui-author> posted on his page</ui-summary>
        </ui-content>
      </div>
    </stub-feed>
  </section>
</div>
