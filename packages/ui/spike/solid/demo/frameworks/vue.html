<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Solid spike: Vue 3 host</title>
    <script src="https://unpkg.com/vue@3.5.22/dist/vue.global.prod.js"></script>
  </head>
  <body>
    <h1>Vue 3 host</h1>
    <div id="app">
      <ui-dropdown
        selection
        placeholder="Fruit"
        .options="options"
        :value="value"
        :open="open"
        @ui-change="value = $event.detail.value"
        @ui-open="open = true"
        @ui-close="open = false"
      ></ui-dropdown>
      <output id="value">{{ value }}</output>
      <button id="set" @click="value = 'cherry'">set cherry</button>
      <button id="open" @click="open = true">open</button>
    </div>
    <script type="module" src="./smoke.ts"></script>
    <script>
      // `isCustomElement` so Vue leaves `ui-*` alone;  `.options` forces a property, `:value` / `:open` are
      // properties too once the element is defined (Vue checks `key in el`).
      const app = Vue.createApp({
        data: () => ({
          value: "banana",
          open: false,
          options: [
            { value: "apple", text: "Apple" },
            { value: "banana", text: "Banana" },
            { value: "cherry", text: "Cherry" }
          ]
        })
      })
      app.config.compilerOptions.isCustomElement = (tag) => tag.startsWith("ui-")
      app.mount("#app")
      window.smokeHost = "vue"
    </script>
  </body>
</html>
