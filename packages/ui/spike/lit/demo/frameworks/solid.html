<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Solid 1.9 -- Lit spike</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        padding: 1em 2em 16em;
        font-family: system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <h1>Solid 1.9</h1>
    <div id="root"></div>
    <pre id="result">checking...</pre>
    <script type="module">
      import "/src/index.ts"
      import { createSignal } from "https://esm.sh/solid-js@1.9.9"
      import { render } from "https://esm.sh/solid-js@1.9.9/web"
      import h from "https://esm.sh/solid-js@1.9.9/h"
      import { OPTIONS, roundTrip } from "./check.js"

      /** `prop:` for rich data and controlled values, `on:` for `ui-*` events. */
      function App() {
        const [value, setValue] = createSignal("b")
        const [open, setOpen] = createSignal(true)
        return h("div", {}, [
          h("ui-dropdown", {
            selection: "",
            placeholder: "Fruit",
            "prop:options": OPTIONS,
            "prop:value": () => value(),
            "prop:open": () => open(),
            "on:ui-change": (event) => setValue(event.detail.value),
            "on:ui-open": () => setOpen(true),
            "on:ui-close": () => setOpen(false)
          }),
          h("p", {}, ["Solid state: ", h("output", { id: "value" }, () => value())])
        ])
      }
      render(App, document.querySelector("#root"))
      roundTrip("solid 1.9.9")
    </script>
  </body>
</html>
