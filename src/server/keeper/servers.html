<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      The Spell Servers page (epic `editor` P49):  every server Spell's server keeper keeps, a card each, so you see
      at a glance whether main's servers are fine.
      - Served by the keeper itself (`ServerKeeper.route()`, at `/servers/` on its own port), so it still answers
        while every page server is down.
      - Drawn by `servers.js` from the keeper's `/api/servers`, asked again every 2 seconds:  compact cards, three a
        row, in sections (This Mac, each repo, then Epics, the worktree used most recently first).
      - Spell UI from the docs pages' bundle, which the keeper serves too (the settings' `uiScript`);  without it, a
        plain table.
      - The keeper puts its settings where the mark below is (`window.SPELL_KEEPER`:  its write token, Spell UI's
        address).
    -->
    <title>Spell Servers</title>
    <!-- keeper settings -->
    <style>
      :root {
        color-scheme: light dark;
        --servers-muted: light-dark(#6b6b76, #a3a3ae);
        --servers-bg: light-dark(#ffffff, #1b1b1f);
        --servers-text: light-dark(#1b1b1f, #ececf1);
      }
      html {
        background: var(--servers-bg);
      }
      body {
        margin: 0;
        min-height: 100vh;
        box-sizing: border-box;
        padding: 16px;
        background: var(--servers-bg);
        color: var(--servers-text);
        font:
          16px/1.5 system-ui,
          -apple-system,
          sans-serif;
      }
      main {
        max-width: 1040px;
        margin: 0 auto;
      }
      h1 {
        margin: 8px 0 4px 0;
        font-size: 28px;
      }
      h2 {
        margin: 24px 0 8px 0;
        font-size: 20px;
      }
      .servers-lead {
        margin: 0 0 16px 0;
        color: var(--servers-muted);
      }
      h3 {
        margin: 16px 0 8px 0;
        font-size: 16px;
      }
      h2 + h3 {
        margin-top: 8px;
      }
      /*
       * the cards, compact (epic `editor` I374, as the epic hub's Servers tab drew them):  three a row, fewer as the
       * page narrows, never narrower than 200px;  each ONE row:  its name, its button, its state
       */
      .servers-cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(max(min(100%, 200px), calc((100% - 16px) / 3)), 1fr));
        gap: 8px;
        --ui-card-margin-block: 0;
        --ui-card-content-padding: 8px 12px;
      }
      .servers-card {
        min-width: 0;
      }
      .servers-card-row {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 24px;
      }
      .servers-name {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 600;
        line-height: 24px;
      }
      .servers-name a {
        color: inherit;
        text-decoration: none;
      }
      .servers-name a:hover {
        text-decoration: underline;
      }
      .servers-actions {
        display: flex;
        --ui-button-basic-border-width: 0px;
      }
      .servers-state {
        flex: none;
      }
      .servers-facts {
        color: var(--servers-muted);
        font-variant-numeric: tabular-nums;
        white-space: pre-line;
      }
      /* without Spell UI:  a plain table */
      .servers-table {
        width: 100%;
        border-collapse: collapse;
      }
      .servers-table th,
      .servers-table td {
        padding: 4px 8px;
        text-align: left;
        vertical-align: top;
        border-bottom: 1px solid light-dark(#e4e4e8, #34343a);
      }
      .servers-problem {
        margin: 0 0 16px 0;
      }
      /* in a frame (the epic tooling's Servers tab):  its cards only, the page around it has the title */
      .servers-embedded,
      .servers-embedded body {
        background: transparent;
      }
      .servers-embedded body {
        min-height: 0;
        padding: 0 0 4px 0;
      }
      .servers-embedded h1,
      .servers-embedded .servers-lead {
        display: none;
      }
      .servers-embedded #servers-page > :first-child {
        margin-top: 0;
      }
      .servers-embedded main {
        max-width: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Servers</h1>
      <p class="servers-lead">Spell's servers on this Mac, and whether each one is working.</p>
      <div id="servers-problem" class="servers-problem"></div>
      <div id="servers-page"></div>
    </main>
    <script type="module" src="/servers/servers.js"></script>
  </body>
</html>
