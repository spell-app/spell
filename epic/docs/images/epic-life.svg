<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 872 420" width="872" height="420" role="img" aria-labelledby="title desc">
  <title id="title">An epic's life</title>
  <desc id="desc">Nine steps.  1, you type /epic name and what to plan.  2, the session is named for the epic.  3, epic creates a git worktree and a new VS Code window.  4, the agent explores and drafts the plan.  5, the page fills with phases, questions and calls.  6, each phase is built and committed, with 7, review rounds, any time, beside it.  8, doc review:  the guide, the changelog.  9, merged into main, and the worktree goes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6550CA"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1A1C27; }
    .title { font-size: 21px; font-weight: 700; }
    .sub { font-size: 13px; fill: #5B5E6E; }
    .line { font-size: 13px; text-anchor: middle; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; font-weight: 700; fill: #4A3AA0; }
    .num { font-size: 12px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
    .lbl { font-size: 12px; font-style: italic; fill: #6550CA; }
    .box { fill: #EFECFB; stroke: #6550CA; stroke-width: 2; }
    .review { fill: #F1E7D4; stroke: #C9B48A; stroke-width: 2; }
    .last { fill: #E1DBFA; stroke: #4A3AA0; stroke-width: 2.5; }
    .badge { fill: #6550CA; stroke: #FAF9FE; stroke-width: 2; }
    .rbadge { fill: #A88A4E; stroke: #FAF9FE; stroke-width: 2; }
    .edge { fill: none; stroke: #6550CA; stroke-width: 1.8; }
    .loop { fill: none; stroke: #A88A4E; stroke-width: 1.8; stroke-dasharray: 6 4; }
  </style>

  <rect x="1" y="1" width="870" height="418" rx="16" fill="#FAF9FE" stroke="#E4E0F5" stroke-width="2"/>
  <text class="title" x="40" y="44">An epic's life</text>
  <text class="sub" x="40" y="66">Plan on a page, build in a worktree, review on the page.</text>

  <!-- edges:  row 1 left to right, down, row 2 right to left -->
  <path class="edge" d="M214,132 L234,132" marker-end="url(#arrow)"/>
  <path class="edge" d="M424,132 L444,132" marker-end="url(#arrow)"/>
  <path class="edge" d="M634,132 L654,132" marker-end="url(#arrow)"/>
  <path class="edge" d="M751,166 L751,210" marker-end="url(#arrow)"/>
  <path class="edge" d="M658,250 L638,250" marker-end="url(#arrow)"/>
  <path class="edge" d="M448,250 L428,250" marker-end="url(#arrow)"/>
  <path class="edge" d="M238,250 L218,250" marker-end="url(#arrow)"/>
  <path class="loop" d="M541,288 L541,328" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text class="lbl" x="551" y="312">any time</text>

  <!-- row 1 -->
  <rect class="box" x="28" y="98" width="186" height="68" rx="12"/>
  <circle class="badge" cx="46" cy="98" r="11"/><text class="num" x="46" y="102">1</text>
  <text class="line" x="121" y="128">You type <tspan class="code">/epic name</tspan></text>
  <text class="line" x="121" y="146">and what to plan</text>

  <rect class="box" x="238" y="98" width="186" height="68" rx="12"/>
  <circle class="badge" cx="256" cy="98" r="11"/><text class="num" x="256" y="102">2</text>
  <text class="line" x="331" y="128">The session is named</text>
  <text class="line" x="331" y="146">for the epic</text>

  <rect class="box" x="448" y="98" width="186" height="68" rx="12"/>
  <circle class="badge" cx="466" cy="98" r="11"/><text class="num" x="466" y="102">3</text>
  <text class="line" x="541" y="128">Epic creates a git worktree</text>
  <text class="line" x="541" y="146">and new VS Code window</text>

  <rect class="box" x="658" y="98" width="186" height="68" rx="12"/>
  <circle class="badge" cx="676" cy="98" r="11"/><text class="num" x="676" y="102">4</text>
  <text class="line" x="751" y="128">The agent explores</text>
  <text class="line" x="751" y="146">and drafts the plan</text>

  <!-- row 2 -->
  <rect class="box" x="658" y="214" width="186" height="72" rx="12"/>
  <circle class="badge" cx="676" cy="214" r="11"/><text class="num" x="676" y="218">5</text>
  <text class="line" x="751" y="245">The page fills:</text>
  <text class="line" x="751" y="263">phases, questions, calls</text>

  <rect class="box" x="448" y="214" width="186" height="72" rx="12"/>
  <circle class="badge" cx="466" cy="214" r="11"/><text class="num" x="466" y="218">6</text>
  <text class="line" x="541" y="245">Each phase built</text>
  <text class="line" x="541" y="263">and committed</text>

  <rect class="box" x="238" y="214" width="186" height="72" rx="12"/>
  <circle class="badge" cx="256" cy="214" r="11"/><text class="num" x="256" y="218">8</text>
  <text class="line" x="331" y="245">Doc review:  the</text>
  <text class="line" x="331" y="263">guide, the changelog</text>

  <rect class="last" x="28" y="214" width="186" height="72" rx="12"/>
  <circle class="badge" cx="46" cy="214" r="11"/><text class="num" x="46" y="218">9</text>
  <text class="line" x="121" y="245">Merged into main;</text>
  <text class="line" x="121" y="263">the worktree goes</text>

  <!-- 7, beside 6 -->
  <rect class="review" x="448" y="332" width="186" height="52" rx="26"/>
  <circle class="rbadge" cx="468" cy="332" r="11"/><text class="num" x="468" y="336">7</text>
  <text class="line" x="541" y="363">Review rounds</text>
</svg>
