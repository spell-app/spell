<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Run Title</title>
    <meta
      name="description"
      content="A run page:  a command asks, Owen answers each row, Send, and the command carries on with his answers."
    />
    <link rel="stylesheet" href="/_epic/assets/spell-doc.css" />
  </head>
  <body class="spell-doc-page spell-run-page" data-spell-needs-server>
    <ui-root>
      <ui-components source="/_epic/pack/epics.pack.js"></ui-components>
      <spell-site-header></spell-site-header>
      <div class="spell-doc">
        <main class="spell-doc-main">
          <!--
            TEMPLATE:  a RUN PAGE, a command's review page (epic `epic-engine` P23), the tool's own (tracked with each
            branch, as its elements are).  NEVER copied:  spell-epic's route module serves it at `/runs/<id>/`
            (`src/tools/runRoutes.ts`), its title and `<epic-run run>` set from the run's `run.json5`.
            - The command writes the run (the kit's `SRV.CommandRun`):  `pages/runs/<id>/` in the content folder.
            - `<epic-run>` draws the rest from `/api/runs/<id>`:  who is waiting, the progress, a row per thing to
              answer (`<epic-run-row>`), and Send.
          -->
          <ui-breadcrumbs class="spell-crumbs" size="small" aria-label="Breadcrumb">
            <ui-breadcrumb link="/pages/index.html" target="src-packages-docs-index-html">Docs</ui-breadcrumb>
            <ui-breadcrumb selected>Run</ui-breadcrumb>
          </ui-breadcrumbs>
          <ui-sticky class="spell-h1"
            ><header class="spell-page-head"><h1>Run Title</h1></header></ui-sticky
          >
          <epic-run run="run-id"></epic-run>
        </main>
      </div>
    </ui-root>
    <script src="/_epic/assets/highlight.min.js"></script>
    <script src="/_epic/assets/spell-ui.js"></script>
  </body>
</html>
