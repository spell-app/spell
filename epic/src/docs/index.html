<!doctype html>
<!--
  Epic UI (a Spell guide, `@spell/guides/EpicUI`), with no editor (epic `editor` P44, as Spell UI's site in P43).
  - The page server answers every one of the site's addresses under `/components/epics/` with this page
    (the component set's `sitePage`), and its `<spell-viewer>` shows the page that address names:
    `/components/epics/epic-card` is that page, `#section` and all.
  - Going to another page changes the address, so the browser's back and forward work (`RunSiteHost`).
  - The same under a worktree's address, `/worktrees/<w>/components/epics/...`:  the base and the viewer's script are
    worked out from the page's own address.
  - `/components/epics` is written here by hand:  a plain page can't import `SpellUIGuide`, its one home.
  - A guide page is changed in the editor, with Change this (Q83):  this page is for reading.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Epic UI</title>
    <meta
      name="description"
      content="The elements the epic pages are built from:  each one's examples, attributes and look."
    />
    <!-- Before first paint:  the viewer's colour scheme, as every docs page (`ThemePreference.HEAD_SCRIPT`) -->
    <script>
      try {
        var l = localStorage,
          d = document.documentElement,
          s = l.getItem("spell-site:scheme") || l.getItem("spell-site:theme") || l.getItem("spell-ui-site:scheme")
        if (s === "light" || s === "dark") {
          d.classList.add("ui-" + s)
          d.style.colorScheme = s
        }
      } catch (e) {}
    </script>
    <style>
      body {
        margin: 0;
      }
      /* the page's paper and ink follow the viewer's scheme (its `theme`):  its own sheet paints the runner's, light */
      spell-viewer {
        display: block;
        min-height: 100dvh;
        background: Canvas;
        color: CanvasText;
      }
    </style>
  </head>
  <body>
    <spell-viewer project="@spell/guides/EpicUI"></spell-viewer>
    <script type="module">
      // `/worktrees/<w>` (or nothing), then the site's own address:  `/components/epics`
      const [, worktree = ""] = /^((?:\/worktrees\/[^/]+)?)\/components\/epics(?:\/|$)/.exec(location.pathname) ?? []
      const viewer = document.querySelector("spell-viewer")
      viewer.setAttribute("base", `${worktree}/components/epics`)
      // the scheme the person picked (the head script, the theme menu), else the device's:  everything inside wears it
      const root = document.documentElement.classList
      const device = matchMedia("(prefers-color-scheme: dark)")
      const wearScheme = () => {
        const dark = root.contains("ui-dark") || (!root.contains("ui-light") && device.matches)
        viewer.setAttribute("theme", dark ? "dark" : "light")
      }
      wearScheme()
      new MutationObserver(wearScheme).observe(document.documentElement, { attributeFilter: ["class"] })
      device.addEventListener("change", wearScheme)
      await import(`${worktree}/element/spell-viewer.js`)
    </script>
  </body>
</html>
