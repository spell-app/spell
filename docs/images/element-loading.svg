<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 540" width="800" height="540" role="img" aria-labelledby="title desc">
  <title id="title">A page loading its elements</title>
  <desc id="desc">Eight steps between a page, its ui-root and the element families.  1, the ui-root connects.  2, it hides its content, keeping its space.  3, it draws skeletons from its catalog.  4, it imports each family a tag needs, once.  5, it loads the component packs the page names.  6, the runtime's own chunk arrives.  7, each element renders.  8, ui-ready:  the content shows.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6550CA"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1A1C27; }
    .title { font-size: 21px; font-weight: 700; }
    .sub { font-size: 13px; fill: #5B5E6E; }
    .lane { font-size: 15px; font-weight: 700; text-anchor: middle; }
    .lanesub { font-size: 12px; fill: #4A4D5C; text-anchor: middle; }
    .msg { font-size: 13px; text-anchor: middle; paint-order: stroke; stroke: #FAF9FE; stroke-width: 5px; stroke-linejoin: round; }
    .self { font-size: 13px; paint-order: stroke; stroke: #FAF9FE; stroke-width: 5px; stroke-linejoin: round; }
    .num { font-size: 12px; font-weight: 700; fill: #FFFFFF; text-anchor: middle; }
    .head { fill: #EFECFB; stroke: #6550CA; stroke-width: 2; }
    .life { stroke: #C9C2EE; stroke-width: 2; stroke-dasharray: 4 5; }
    .edge { fill: none; stroke: #6550CA; stroke-width: 1.8; }
    .back { fill: none; stroke: #6550CA; stroke-width: 1.8; stroke-dasharray: 6 4; }
    .badge { fill: #6550CA; }
    .done { fill: #F1E7D4; stroke: #C9B48A; stroke-width: 1.2; }
  </style>

  <rect x="1" y="1" width="798" height="538" rx="16" fill="#FAF9FE" stroke="#E4E0F5" stroke-width="2"/>
  <text class="title" x="40" y="44">A page loading its elements</text>
  <text class="sub" x="40" y="66">The page shows skeletons until every element it holds is ready.</text>

  <!-- lanes -->
  <line class="life" x1="170" y1="132" x2="170" y2="510"/>
  <line class="life" x1="410" y1="132" x2="410" y2="510"/>
  <line class="life" x1="690" y1="132" x2="690" y2="510"/>
  <rect class="head" x="100" y="86" width="140" height="46" rx="12"/>
  <text class="lane" x="170" y="107">the page</text>
  <text class="lanesub" x="170" y="123">its HTML</text>
  <rect class="head" x="340" y="86" width="140" height="46" rx="12"/>
  <text class="lane" x="410" y="107">&lt;ui-root&gt;</text>
  <text class="lanesub" x="410" y="123">and its catalog</text>
  <rect class="head" x="610" y="86" width="160" height="46" rx="12"/>
  <text class="lane" x="690" y="107">the families</text>
  <text class="lanesub" x="690" y="123">ui-button, ui-card ...</text>

  <!-- step badges, one column -->
  <g>
    <circle class="badge" cx="56" cy="168" r="11"/><text class="num" x="56" y="172">1</text>
    <circle class="badge" cx="56" cy="210" r="11"/><text class="num" x="56" y="214">2</text>
    <circle class="badge" cx="56" cy="252" r="11"/><text class="num" x="56" y="256">3</text>
    <circle class="badge" cx="56" cy="300" r="11"/><text class="num" x="56" y="304">4</text>
    <circle class="badge" cx="56" cy="344" r="11"/><text class="num" x="56" y="348">5</text>
    <circle class="badge" cx="56" cy="388" r="11"/><text class="num" x="56" y="392">6</text>
    <circle class="badge" cx="56" cy="432" r="11"/><text class="num" x="56" y="436">7</text>
    <circle class="badge" cx="56" cy="482" r="11"/><text class="num" x="56" y="486">8</text>
  </g>

  <!-- 1 -->
  <path class="edge" d="M170,168 L406,168" marker-end="url(#arrow)"/>
  <text class="msg" x="290" y="160">connects</text>
  <!-- 2, 3:  ui-root on its own -->
  <path class="edge" d="M410,202 C452,202 452,218 414,218" marker-end="url(#arrow)"/>
  <text class="self" x="460" y="214">hides its content, its space kept</text>
  <path class="edge" d="M410,244 C452,244 452,260 414,260" marker-end="url(#arrow)"/>
  <text class="self" x="460" y="256">draws skeletons, from the catalog</text>
  <!-- 4, 5 -->
  <path class="edge" d="M410,300 L686,300" marker-end="url(#arrow)"/>
  <text class="msg" x="550" y="292">imports each family a tag needs, once</text>
  <path class="edge" d="M410,344 L686,344" marker-end="url(#arrow)"/>
  <text class="msg" x="550" y="336">loads the packs the page names</text>
  <!-- 6 -->
  <path class="back" d="M690,388 L414,388" marker-end="url(#arrow)"/>
  <text class="msg" x="550" y="380">the runtime's own chunk arrives</text>
  <!-- 7 -->
  <path class="back" d="M690,432 L174,432" marker-end="url(#arrow)"/>
  <text class="msg" x="290" y="424">each element renders</text>
  <!-- 8 -->
  <path class="edge" d="M410,482 L174,482" marker-end="url(#arrow)"/>
  <rect class="done" x="186" y="455" width="208" height="22" rx="11"/>
  <text x="290" y="470" style="font-size:13px;font-weight:600;text-anchor:middle">ui-ready:  the content shows</text>
</svg>
