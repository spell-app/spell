<!doctype html>
<!-- no `lang`:  the editor speaks the browser's language, and names it here as it starts (`AppTexts`) -->
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Spell.app</title>
    <link rel="stylesheet" type="text/css" href="../static/semantic-ui-css/semantic.min.css" />
    <link rel="stylesheet" type="text/css" href="../static/lato/index.css" />
    <!-- Spell's favicon:  copies the kit's `yarn favicon` writes;  vite bundles them into `dist/` -->
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon/favicon.svg" />
    <link rel="apple-touch-icon" href="/static/favicon/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Light / dark before first paint, as Spell UI's docs pages do:  a copy of `ThemePreference.HEAD_SCRIPT`
         (spell-ui's `src/components/ui-theme-menu/ThemePreference.ts`), which the editor's theme (`EditorTheme`) then keeps -->
    <script>
      try {
        var l = localStorage,
          d = document.documentElement,
          s = l.getItem("spell-site:scheme")
        if (s === "light" || s === "dark") {
          d.classList.add("ui-" + s)
          d.style.colorScheme = s
        }
      } catch (e) {}
    </script>
    <style>
      /* The page shows the theme's background (Fruity's wallpaper), not `semantic.min.css`'s white:
         that sheet is for running programs.  Text in the theme's colour, on light and dark. */
      html {
        min-height: 100%;
        background-color: var(--ui-background);
        color: var(--ui-text-color);
      }
      body {
        font-family: var(--ui-font-family, Lato, Arial, sans-serif);
        background: transparent;
        color: inherit;
      }
      /* The whole page, until it's ready to show at once (`PageLoading`):  nothing appears piecemeal.
         Plain markup:  it shows before any script has run, so no `<ui-*>` could draw it yet. */
      #PageLoading {
        position: fixed;
        inset: 0;
        z-index: 2147483000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: light-dark(#f6f5fb, #16151d);
        color-scheme: light dark;
        overflow: hidden;
        transition: opacity 0.15s ease-out;
      }
      /* A magic wand's stars:  they spill out from under the hat, and trail after the mouse, each one fading as it
         drifts (the script after the markup makes them).  Above the card, never in the way of a click. */
      #PageLoading .Sparkle {
        position: absolute;
        z-index: 2;
        left: 0;
        top: 0;
        width: var(--size);
        height: var(--size);
        margin: calc(var(--size) / -2) 0 0 calc(var(--size) / -2);
        background: var(--color);
        clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%);
        filter: drop-shadow(0 0 3px var(--color));
        pointer-events: none;
      }
      #PageLoading.done {
        opacity: 0;
        pointer-events: none;
      }
      #PageLoading section {
        position: relative;
        z-index: 1;
        box-sizing: border-box;
        width: min(100% - 32px, 760px);
        padding: clamp(32px, 8vh, 72px) 24px;
        border: 1px solid light-dark(#5b4bd626, #b9a7ff26);
        border-radius: 24px;
        background: light-dark(#ffffffcc, #16151dcc);
        backdrop-filter: blur(2px);
        color: light-dark(#1d1a2e, #f4f2ff);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Lato, Arial, sans-serif;
        text-align: center;
        /* the word's size:  the hat and the line under it are measured from it */
        --hero-size: clamp(64px, 15vmin, 148px);
      }
      /* the hat, "Spell" and the line under it, centred as one block, the line starting where the word does */
      #PageLoading section > div {
        display: inline-block;
        text-align: start;
      }
      /* the hat and "Spell":  the hat's height set by the word's, on one line */
      #PageLoading h1 {
        display: flex;
        align-items: center;
        gap: 0.18em;
        margin: 0;
        font-family: inherit;
        font-size: var(--hero-size);
        font-weight: 800;
        letter-spacing: -0.035em;
        line-height: 1;
      }
      #PageLoading img {
        width: 1.05em;
        height: 1.05em;
      }
      #PageLoading p {
        /* past the hat and the gap after it:  1.05em + 0.18em of the word's size */
        margin: 0.6em 0 0 calc(var(--hero-size) * 1.23);
        color: light-dark(#5b4bd6, #b9a7ff);
        font-size: clamp(20px, 3.6vmin, 36px);
        font-weight: 500;
        line-height: 1.2;
        animation: PageLoadingBreathe 1.6s ease-in-out infinite alternate;
      }
      @keyframes PageLoadingBreathe {
        from {
          opacity: 0.55;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #PageLoading p {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="PageLoading" role="status">
      <section>
        <div>
          <h1><img src="/static/favicon/favicon.svg" alt="" /><span>Spell</span></h1>
          <p>Making magic...</p>
        </div>
      </section>
    </div>
    <!-- Spell's name and the line in Spanish:  before any script of the app's has run, so no `AppTexts` yet -->
    <script>
      if (/^es\b/i.test(navigator.language)) {
        document.querySelector("#PageLoading span").textContent = "Encanto"
        document.querySelector("#PageLoading p").textContent = "Haciendo magia..."
      }
    </script>
    <!-- The wand's stars (`.Sparkle` above):  plain script, before the app's, so they show from the first paint.
         They stop once the page shows (`#PageLoading.done`), and never start for someone who asks for less motion. -->
    <script>
      ;(function () {
        var hero = document.getElementById("PageLoading")
        if (!hero.animate || matchMedia("(prefers-reduced-motion: reduce)").matches) return
        var hat = hero.querySelector("img")
        var dark = matchMedia("(prefers-color-scheme: dark)").matches
        var colors = dark ? ["#ffe08a", "#b9a7ff", "#ffffff", "#ff9ad5"] : ["#f5b301", "#7b6cf0", "#ff6fb5", "#3fb6ff"]
        /** One star at (x, y), page pixels, drifting by (dx, dy) as it turns, shrinks and fades. */
        function sparkle(x, y, dx, dy, size, life) {
          var star = document.createElement("i")
          star.className = "Sparkle"
          star.style.setProperty("--size", size + "px")
          star.style.setProperty("--color", colors[(Math.random() * colors.length) | 0])
          hero.append(star)
          var turn = (Math.random() - 0.5) * 360
          star.animate(
            [
              { transform: "translate(" + x + "px," + y + "px) scale(0.2) rotate(0deg)", opacity: 0 },
              {
                transform:
                  "translate(" +
                  (x + dx * 0.25) +
                  "px," +
                  (y + dy * 0.25) +
                  "px) scale(1) rotate(" +
                  turn * 0.25 +
                  "deg)",
                opacity: 1,
                offset: 0.2
              },
              {
                transform: "translate(" + (x + dx) + "px," + (y + dy) + "px) scale(0.3) rotate(" + turn + "deg)",
                opacity: 0
              }
            ],
            { duration: life, easing: "cubic-bezier(0.2, 0.6, 0.4, 1)" }
          ).onfinish = function () {
            star.remove()
          }
        }
        // from under the hat's brim:  a few at a time, out past it and drifting down
        var spill = setInterval(function () {
          if (hero.classList.contains("done")) return stop()
          var box = hat.getBoundingClientRect()
          if (!box.width) return
          for (var count = 0; count < 3; count++) {
            var across = (Math.random() - 0.5) * box.width * 0.8
            var angle = Math.PI * (0.15 + Math.random() * 0.7)
            var reach = 60 + Math.random() * 110
            sparkle(
              box.left + box.width / 2 + across,
              box.top + box.height * 0.78,
              Math.cos(angle) * reach * (across < 0 ? -1 : 1),
              Math.sin(angle) * reach * 0.6 + 20,
              9 + Math.random() * 14,
              1100 + Math.random() * 900
            )
          }
        }, 140)
        // after the mouse:  one every 14px it moves, sinking a little as it fades
        var last
        function trail(event) {
          if (last && Math.hypot(event.clientX - last.x, event.clientY - last.y) < 14) return
          last = { x: event.clientX, y: event.clientY }
          sparkle(
            last.x,
            last.y,
            (Math.random() - 0.5) * 30,
            18 + Math.random() * 26,
            7 + Math.random() * 10,
            700 + Math.random() * 500
          )
        }
        hero.addEventListener("pointermove", trail)
        function stop() {
          clearInterval(spill)
          hero.removeEventListener("pointermove", trail)
        }
      })()
    </script>
    <!-- `icons`:  the app's icon names are Fomantic's, for every `<ui-*>` in the page (see `src/app/solid/loadUI.ts`);
         Font Awesome's logos too (the Program panel's `python`, `js`), and its own names where Fomantic has none.
         `semantic.min.css` above is for running PROGRAMS, which draw with Semantic UI's React kit. -->
    <ui-root app icons="fa7-brands, fomantic"><div id="app-root"></div></ui-root>
    <script type="module" src="../src/app/index.tsx"></script>
  </body>
</html>
