<!-- Element markup for `src/components/button/examples/content.html`. -->
<div class="ui-stack">
  <section>
    <h4>Conditionals</h4>
    <ui-buttons>
      <ui-button>Cancel</ui-button>
      <ui-or></ui-or>
      <ui-button positive>Save</ui-button>
    </ui-buttons>
  </section>

  <section>
    <h4>Conditionals, translated</h4>
    <ui-buttons>
      <ui-button>un</ui-button>
      <ui-or text="ou"></ui-or>
      <ui-button>deux</ui-button>
    </ui-buttons>
  </section>

  <section>
    <h4>Icon and text</h4>
    <ui-button icon="cloud">Upload</ui-button>
    <ui-button primary icon="download">Download</ui-button>
    <ui-button icon="arrow right">Next</ui-button>
  </section>

  <section>
    <h4>Link</h4>
    <ui-button href="#example">A link styled as a button</ui-button>
  </section>
</div>
