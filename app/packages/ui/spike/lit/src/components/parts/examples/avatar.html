<!-- Element markup for `src/components/parts/examples/avatar.html`. -->
<!--
  A part's host is `display: contents`:  inline styles on it never reach the box, so the fragment's inline sizes
  go through `::part(avatar)`.
-->
<div class="ui-stack">
  <style>
    ui-avatar.example-standalone::part(avatar) {
      display: inline-block;
      width: 3em;
    }
    ui-avatar.example-small::part(avatar) {
      width: 2em;
      height: 2em;
    }
  </style>
  <section>
    <h4>Standalone</h4>

      alt=""

  </section>

  <section>
