<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Vue 3 -- Lit spike</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        padding: 1em 2em 16em;
        font-family: system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <h1>Vue 3</h1>
    <div id="root"></div>
    <pre id="result">checking...</pre>
    <script type="module">
      import "/src/index.ts"
      import { createApp, ref, version } from "https://unpkg.com/vue@3/dist/vue.esm-browser.js"
      import { OPTIONS, roundTrip } from "./check.js"

      const app = createApp({
        setup() {
          const value = ref("b")
          const open = ref(true)
          return { options: OPTIONS, value, open }
        },
        template: `<ui-dropdown selection placeholder="Fruit" :options="options" :value="value" :open="open"
            @ui-change="value = $event.detail.value" @ui-open="open = true" @ui-close="open = false"></ui-dropdown>
          <p>Vue state: <output id="value">{{ value }}</output></p>`
      })
      app.config.compilerOptions.isCustomElement = (tag) => tag.startsWith("ui-")
      app.mount("#root")
      roundTrip(`vue ${version}`)
    </script>
  </body>
</html>
