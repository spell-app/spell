<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Solid spike: React 19 host</title>
  </head>
  <body>
    <h1>React 19 host</h1>
    <div id="app"></div>
    <script type="module" src="./smoke.ts"></script>
    <script type="module">
      // React 19 sets `options` as a PROPERTY (`"options" in el`), `value` / `open` likewise, and listens to
      // `ui-change` through `onui-change`.
      import React from "https://esm.sh/react@19.2.0"
      import { createRoot } from "https://esm.sh/react-dom@19.2.0/client"
      const h = React.createElement
      const OPTIONS = [
        { value: "apple", text: "Apple" },
        { value: "banana", text: "Banana" },
        { value: "cherry", text: "Cherry" }
      ]
      function App() {
        const [value, setValue] = React.useState("banana")
        const [open, setOpen] = React.useState(false)
        return h(
          "div",
          null,
          h("ui-dropdown", {
            selection: true,
            placeholder: "Fruit",
            options: OPTIONS,
            value,
            open,
            "onui-change": (event) => setValue(event.detail.value),
            "onui-open": () => setOpen(true),
            "onui-close": () => setOpen(false)
          }),
          h("output", { id: "value" }, value),
          h("button", { id: "set", onClick: () => setValue("cherry") }, "set cherry"),
          h("button", { id: "open", onClick: () => setOpen(true) }, "open")
        )
      }
      createRoot(document.getElementById("app")).render(h(App))
      window.smokeHost = "react"
    </script>
  </body>
</html>
