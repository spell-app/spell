# The repo's checks on a push to `main`, a pull request, or by hand (Actions tab => "checks" => "Run workflow"):
# `yarn ts`, `yarn lint` and `yarn test`, over the kit and each of its folders, lowest first (`tools/repos.ts run`).
# - ONE repo since epic `repo-split` P20:  the kit's own `src/`, and its folders `parser/`, `ui/`, `epic/` and `app/`,
#   once spell-parser, spell-ui, spell-epic and spell-app, each with a workflow of its own.
# - spell-brand, a project beside the kit, has its own workflow, which checks it on this repo.
name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    # a hung test fails the run in an hour (four folders' tests), not GitHub's 6 hours (epic `repo-split` I73)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      # parser's and app's Python (their `yarn test`'s pytest and `yarn lint`'s ruff run through uv);  uv fetches the
      # Python each project pins
      - uses: astral-sh/setup-uv@v6

      - run: yarn install
      # the two VS Code extensions:  yarn projects of their own, which epic's and app's `yarn lint` lint
      # (epic `epic-engine` I65)
      - run: yarn install
        working-directory: epic/vscode
      - run: yarn install
        working-directory: app/vscode

      # browser tests run in a real chromium
      - run: yarn playwright install --with-deps chromium
      # tests that commit make throwaway git repos
      - run: git config --global user.name CI && git config --global user.email ci@spell.invalid

      - run: yarn ts
      - run: yarn lint
      - run: yarn test

  # The epic tools on Windows (epic `epic-friend` P15):  the process, link and clipboard helpers (`Processes`,
  # `Links`, the extension's `ClipboardImage`), then epic's node tests and the window script's.
  # - Linux runs everything in `checks` above.
  # - It doesn't fail the run yet:  nobody has run the epic tools on Windows, and what this job finds is epic
  #   `epic-windows`' to fix;  once it's green, take `continue-on-error` out.
  epic-on-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: yarn install
      - run: git config --global user.name CI && git config --global user.email ci@spell.invalid
      - run: yarn vp test run --project server tests/server/Processes.test.ts
      - run: yarn test:node
        working-directory: epic
      - run: yarn test:scripts
        working-directory: epic
